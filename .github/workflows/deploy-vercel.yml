name: Deploy to Vercel (GitHub Action)

# NOTE: Primary deployment uses Vercel Git integration (automatic)
# This workflow is only for manual deployments or specific path triggers
# Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets

on:
  # DISABLED push trigger - using Vercel Git integration instead
  # push:
  #   branches: [main]
  #   paths:
  #     - 'curiouskelly-marketing-site/**'
  #     - 'daily-lesson-marketing/**'
  #     - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Vercel environment (production | preview)'
        required: true
        default: 'preview'
        type: choice
        options:
          - production
          - preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          if [ -f "curiouskelly-marketing-site/package.json" ]; then
            cd curiouskelly-marketing-site
            pnpm install
          elif [ -f "daily-lesson-marketing/package.json" ]; then
            cd daily-lesson-marketing
            pnpm install
          else
            pnpm install
          fi

      - name: Build
        run: |
          if [ -f "curiouskelly-marketing-site/package.json" ]; then
            cd curiouskelly-marketing-site
            pnpm run build
          elif [ -f "daily-lesson-marketing/package.json" ]; then
            cd daily-lesson-marketing
            pnpm run build
          else
            pnpm run build
          fi
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || 'https://curiouskelly.com' }}

      - name: Deploy with Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          working-directory: ${{ contains(github.event.head_commit.message, 'marketing') && 'curiouskelly-marketing-site' || (contains(github.event.head_commit.message, 'daily-lesson') && 'daily-lesson-marketing' || '.') }}




