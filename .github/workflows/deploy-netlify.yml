name: Deploy to Netlify

# DISABLED: Requires NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets
# Currently using Vercel for primary deployment

on:
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production? (true/false)'
        required: true
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || 'https://curiouskelly.com' }}

      - name: Deploy with Netlify CLI
        uses: netlify/actions/cli@v4
        with:
          args: deploy --dir=dist ${{ github.event.inputs.production == 'true' && '--prod' || '' }}
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}












