name: Health Check

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check site responds
        run: |
          echo "🔍 Checking curiouskelly.com..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://curiouskelly.com)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Site is up (HTTP $HTTP_STATUS)"
          else
            echo "❌ Site returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Check learn page responds
        run: |
          echo "🔍 Checking learn.html..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://curiouskelly.com/learn.html)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Learn page is up (HTTP $HTTP_STATUS)"
          else
            echo "❌ Learn page returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Check API health endpoint
        run: |
          echo "🔍 Checking API health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://curiouskelly.com/api/ping)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ API is healthy (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ API returned HTTP $HTTP_STATUS (may not have health endpoint)"
          fi

      - name: Check today's lesson exists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "⚠️ Supabase credentials not set, skipping database check"
            exit 0
          fi
          
          # Calculate today's day number
          START_DATE="2025-01-01"
          TODAY=$(date +%Y-%m-%d)
          DAY_NUM=$(( ($(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s)) / 86400 + 1 ))
          
          echo "📅 Today is day $DAY_NUM"
          
          # Check if today's lesson has videos
          RESPONSE=$(curl -s "${SUPABASE_URL}/rest/v1/kelly_video_assets?lesson_day=eq.${DAY_NUM}&status=eq.validated&select=count" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          echo "Video assets for day $DAY_NUM: $RESPONSE"

  notify-failure:
    runs-on: ubuntu-latest
    needs: check
    if: failure()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Send failure alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          echo "🚨 Health check FAILED!"
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            npx tsx scripts/alert.ts SYSTEM_ERROR '{"error": "Health check failed - site may be down"}'
          fi
