name: Health Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check site responds
        run: |
          echo "Checking curiouskelly.com..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://curiouskelly.com)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Site is up (HTTP $HTTP_STATUS)"
          else
            echo "Site returned HTTP $HTTP_STATUS"
            exit 1
          fi
