<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Kelly Blue gradient -->
    <linearGradient id="kelly-blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Sparkle glow -->
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dark background -->
  <rect width="64" height="64" rx="16" fill="#0f0f1a"/>
  <!-- Kelly Blue circle -->
  <circle cx="32" cy="32" r="24" fill="url(#kelly-blue-gradient)"/>
  <!-- Sparkle symbol -->
  <text x="32" y="38" font-size="28" fill="#fbbf24" font-family="system-ui" text-anchor="middle" dominant-baseline="central">✨</text>
  <!-- Subtle glow ring -->
  <circle cx="32" cy="32" r="24" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.3"/>
</svg>

