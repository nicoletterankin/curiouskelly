name = "curious-kelly-tts"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Ensure production traffic uses the custom domain route and avoid defaulting to workers.dev
workers_dev = false
preview_urls = false

routes = [
  { pattern = "tts.curiouskelly.com/*", zone_name = "curiouskelly.com" }
]

[vars]
ENVIRONMENT = "production"

[[r2_buckets]]
binding = "AUDIO_CACHE"
bucket_name = "curious-kelly-audio-cache"

# Optional fallback library (only needed if you want pre-generated MP3 fallback from R2)
# [[r2_buckets]]
# binding = "AUDIO_PREGEN"
# bucket_name = "curious-kelly-audio-pregen"


