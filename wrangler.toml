# Cloudflare Workers & D1 Configuration
# For lesson mirror redundancy

name = "curious-kelly-api"
main = "functions/cloudflare/api/lessons.ts"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lessons-db"
database_id = "" # Fill in after running: wrangler d1 create lessons-db

# Environment variables (set via dashboard or wrangler secret)
# SUPABASE_URL - for reference only, not used in D1 mirror
# SUPABASE_ANON_KEY - for reference only, not used in D1 mirror

[vars]
ENVIRONMENT = "production"

# Development settings
[env.development]
name = "curious-kelly-api-dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "lessons-db-dev"
database_id = "" # Fill in after running: wrangler d1 create lessons-db-dev

# Preview settings for Pages
[env.preview]
name = "curious-kelly-api-preview"
