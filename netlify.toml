[build]
  # Deploy public/index.html as the homepage of curiouskelly.com
  # Configure Git to skip LFS before any operations
  # This must run early to prevent LFS errors during clone
  command = "git config --global lfs.fetchexclude '*' && git lfs install --skip-smudge || true"
  publish = "public"

# CORS headers for Unity WebGL build (required for SharedArrayBuffer/WebAssembly)
[[headers]]
  for = "/unity/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/unity/kelly-live/Build/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  # Skip Git LFS smudge filter to prevent LFS download errors
  # This tells Git to skip downloading LFS objects (like .ccProject files)
  GIT_LFS_SKIP_SMUDGE = "1"

[functions]
  # Functions are at root level: functions/netlify
  directory = "functions/netlify"

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

[[redirects]]
from = "/api/rum"
to = "/.netlify/functions/rum"
status = 200
force = true

[[redirects]]
from = "/api/stripe-checkout"
to = "/.netlify/functions/stripe-checkout"
status = 200
force = true

[[redirects]]
from = "/api/stripe-session"
to = "/.netlify/functions/stripe-session"
status = 200
force = true

[[redirects]]
from = "/api/stripe-public"
to = "/.netlify/functions/stripe-public"
status = 200
force = true

[[redirects]]
from = "/api/waitlist"
to = "/.netlify/functions/waitlist"
status = 200
force = true

# Custom 404 page
[[redirects]]
from = "/*"
to = "/404.html"
status = 404












