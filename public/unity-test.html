<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Kelly 3D - Minimal Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; color: #00d4ff; }
    .status { 
      margin-bottom: 20px; 
      padding: 10px 20px;
      background: #16213e;
      border-radius: 8px;
      font-family: monospace;
    }
    .status.error { background: #3d1f1f; color: #ff6b6b; }
    .status.success { background: #1f3d2f; color: #6bff6b; }
    #unity-container {
      width: 800px;
      height: 600px;
      background: #0f0f23;
      border: 2px solid #00d4ff;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 35, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #16213e;
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-text { margin-top: 20px; font-size: 14px; }
    .progress-bar {
      width: 200px;
      height: 6px;
      background: #16213e;
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #00ff88);
      width: 0%;
      transition: width 0.3s ease;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      background: #16213e;
      color: #00d4ff;
      border: 1px solid #00d4ff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      background: #00d4ff;
      color: #1a1a2e;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .log {
      margin-top: 20px;
      width: 800px;
      max-height: 200px;
      overflow-y: auto;
      background: #0f0f23;
      border-radius: 8px;
      padding: 15px;
      font-family: monospace;
      font-size: 12px;
    }
    .log-entry { margin: 4px 0; }
    .log-entry.error { color: #ff6b6b; }
    .log-entry.success { color: #6bff6b; }
    .log-entry.info { color: #00d4ff; }
  </style>
</head>
<body>
  <h1>🎭 Unity Kelly 3D - Minimal Test</h1>
  <div id="status" class="status">Initializing...</div>
  
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="progress-text" id="progress-text">Loading Unity...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-happy" disabled>😊 Happy</button>
    <button id="btn-curious" disabled>🤔 Curious</button>
    <button id="btn-explaining" disabled>💡 Explaining</button>
    <button id="btn-neutral" disabled>😐 Neutral</button>
    <button id="btn-lipsync" disabled>🗣️ Test Lip Sync</button>
    <button id="btn-stop" disabled>⏹️ Stop</button>
  </div>

  <div class="log" id="log"></div>

  <script>
    // === LOGGING ===
    const logEl = document.getElementById('log');
    function log(msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(`[Unity Test] ${msg}`);
    }

    // === STATUS ===
    const statusEl = document.getElementById('status');
    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = `status ${type}`;
    }

    // === PROGRESS ===
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const loadingOverlay = document.getElementById('loading-overlay');

    function updateProgress(msg, percent) {
      progressText.textContent = msg;
      progressFill.style.width = `${percent}%`;
    }

    // === UNITY INSTANCE ===
    let unityInstance = null;

    // === LOAD UNITY ===
    async function loadUnity() {
      log('Starting Unity load...');
      setStatus('Loading Unity WebGL build...');

      const canvas = document.getElementById('unity-canvas');
      
      // Local build path - using new Kelly_Web_Build with unityweb compression
      const buildUrl = '/unity/kelly-live/Build';
      const loaderUrl = `${buildUrl}/Kelly_Web_Build.loader.js`;
      
      log(`Loading from: ${buildUrl}`, 'info');

      try {
        // Load the Unity loader script
        log('Loading Unity loader script...', 'info');
        await loadScript(loaderUrl);
        log('Unity loader script loaded ✓', 'success');

        if (typeof createUnityInstance !== 'function') {
          throw new Error('createUnityInstance not found - loader failed');
        }

        // Unity config - using .unityweb compressed files
        const config = {
          dataUrl: `${buildUrl}/Kelly_Web_Build.data.unityweb`,
          frameworkUrl: `${buildUrl}/Kelly_Web_Build.framework.js.unityweb`,
          codeUrl: `${buildUrl}/Kelly_Web_Build.wasm.unityweb`,
          streamingAssetsUrl: `${buildUrl}/../StreamingAssets`,
          companyName: 'LessonOfTheDay',
          productName: 'CuriousKelly',
          productVersion: '2.0'
        };

        log('Creating Unity instance...', 'info');
        updateProgress('Creating Unity instance...', 20);

        // Create Unity instance
        unityInstance = await createUnityInstance(canvas, config, (progress) => {
          const percent = Math.round(20 + progress * 75);
          const msg = progress < 0.5 
            ? `Downloading... ${Math.round(progress * 100)}%`
            : progress < 0.9 
              ? `Preparing... ${Math.round(progress * 100)}%`
              : 'Almost ready...';
          updateProgress(msg, percent);
          
          if (progress % 0.1 < 0.02) {
            log(`Progress: ${Math.round(progress * 100)}%`, 'info');
          }
        });

        // Success!
        updateProgress('Kelly 3D Ready!', 100);
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 500);

        log('✅ Unity loaded successfully!', 'success');
        setStatus('Kelly 3D is ready! (Check if visible)', 'success');
        
        // Enable controls
        document.querySelectorAll('.controls button').forEach(btn => btn.disabled = false);

        // Log initial state
        log('Kelly should now be visible in the canvas above', 'success');
        log('If Kelly appears GRAY/WHITE, it\'s a shader compatibility issue', 'info');
        log('If Kelly appears correctly, the build is working!', 'info');

      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        setStatus(`Error: ${error.message}`, 'error');
        updateProgress('Load failed', 0);
      }
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) {
          log('Script already loaded', 'info');
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`Failed to load: ${src}`));
        document.head.appendChild(script);
      });
    }

    // === CONTROLS ===
    document.getElementById('btn-happy').onclick = () => {
      if (unityInstance) {
        log('Sending: SetExpression("happy")', 'info');
        unityInstance.SendMessage('kelly_fbx_v4', 'SetExpression', 'happy');
      }
    };

    document.getElementById('btn-curious').onclick = () => {
      if (unityInstance) {
        log('Sending: SetExpression("curious")', 'info');
        unityInstance.SendMessage('kelly_fbx_v4', 'SetExpression', 'curious');
      }
    };

    document.getElementById('btn-explaining').onclick = () => {
      if (unityInstance) {
        log('Sending: SetExpression("explaining")', 'info');
        unityInstance.SendMessage('kelly_fbx_v4', 'SetExpression', 'explaining');
      }
    };

    document.getElementById('btn-neutral').onclick = () => {
      if (unityInstance) {
        log('Sending: SetExpression("neutral")', 'info');
        unityInstance.SendMessage('kelly_fbx_v4', 'SetExpression', 'neutral');
      }
    };

    document.getElementById('btn-lipsync').onclick = () => {
      if (unityInstance) {
        log('Sending: StartLipSync("Hello world, I am Kelly!")', 'info');
        unityInstance.SendMessage('kelly_fbx_v4', 'StartLipSync', 'Hello world, I am Kelly!');
      }
    };

    document.getElementById('btn-stop').onclick = () => {
      if (unityInstance) {
        log('Sending: StopLipSync()', 'info');
        unityInstance.SendMessage('kelly_fbx_v4', 'StopLipSync', '');
      }
    };

    // === START ===
    window.addEventListener('DOMContentLoaded', loadUnity);
  </script>
</body>
</html>
