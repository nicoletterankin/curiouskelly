<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Learn with Kelly — Curious Kelly</title>
    
    <meta name="description" content="5 minutes of wonder. Every day. Kelly teaches you something new.">
    <meta property="og:title" content="Learn with Kelly — Curious Kelly">
    <meta property="og:description" content="5 minutes of wonder. Every day.">
    <meta property="og:image" content="https://curiouskelly.com/images/brand/og-image.jpg">
    
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/apple-touch-icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --kelly-blue: #2563eb;
            --kelly-blue-light: #3b82f6;
            --kelly-blue-glow: rgba(37, 99, 235, 0.25);
            --gold: #f59e0b;
            --success: #10b981;
            --bg: #09090b;
            --surface: #18181b;
            --text: #fafafa;
            --text-dim: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255,255,255,0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        
        /* ============================================
           MAIN LAYOUT
           ============================================ */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }
        
        /* Progress bar at very top */
        .progress-bar {
            height: 3px;
            background: var(--surface);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--kelly-blue), var(--gold));
            width: 0%;
            transition: width 0.5s ease;
        }
        
        /* Kelly Video Area */
        .kelly-stage {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #0f0f18 0%, var(--bg) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .kelly-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .kelly-video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        
        .kelly-placeholder {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, #1e3a5f 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            animation: breathe 4s ease-in-out infinite;
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; }
        }
        
        /* Caption overlay */
        .caption-area {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            text-align: center;
        }
        
        .caption-phase {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--kelly-blue);
            margin-bottom: 8px;
        }
        
        .caption-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        
        /* ============================================
           BOTTOM CONTROLS
           ============================================ */
        .controls {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        
        .lesson-info {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .lesson-day {
            font-size: 0.75rem;
            color: var(--kelly-blue);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .lesson-topic {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.4rem;
            font-weight: 400;
            margin-top: 4px;
        }
        
        /* Phase dots */
        .phase-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .phase-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .phase-dot.active {
            background: var(--kelly-blue);
            box-shadow: 0 0 12px var(--kelly-blue-glow);
            transform: scale(1.2);
        }
        
        .phase-dot.completed {
            background: var(--success);
        }
        
        /* Play button */
        .play-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 16px 32px;
            background: var(--kelly-blue);
            color: white;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .play-btn:hover {
            background: var(--kelly-blue-light);
            transform: scale(1.02);
        }
        
        .play-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }
        
        .play-btn.playing {
            background: var(--text-muted);
        }
        
        /* ============================================
           COMPLETION SCREEN
           ============================================ */
        .completion-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            z-index: 100;
        }
        
        .completion-screen.visible {
            display: flex;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .completion-emoji {
            font-size: 80px;
            margin-bottom: 24px;
            animation: bounce 0.6s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .completion-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        
        .completion-subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 32px;
        }
        
        .completion-next {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 32px;
            margin-bottom: 24px;
        }
        
        .completion-next-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .completion-next-topic {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.25rem;
            margin-top: 8px;
            color: var(--gold);
        }
        
        .completion-cta {
            display: inline-block;
            padding: 14px 32px;
            background: var(--kelly-blue);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .completion-cta:hover {
            background: var(--kelly-blue-light);
            transform: scale(1.02);
        }
        
        /* ============================================
           AGE GATE (First visit)
           ============================================ */
        .age-gate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            z-index: 200;
        }
        
        .age-gate.visible {
            display: flex;
        }
        
        .age-gate-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        
        .age-gate-subtitle {
            color: var(--text-dim);
            margin-bottom: 32px;
        }
        
        .age-input-container {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .age-input {
            width: 100px;
            padding: 16px;
            font-size: 2rem;
            text-align: center;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            font-family: inherit;
        }
        
        .age-input:focus {
            outline: none;
            border-color: var(--kelly-blue);
        }
        
        .age-label {
            font-size: 1.25rem;
            color: var(--text-dim);
        }
        
        .age-submit {
            padding: 16px 48px;
            background: var(--kelly-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .age-submit:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }
        
        /* ============================================
           LOADING STATE
           ============================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            transition: opacity 0.5s;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-logo {
            font-size: 48px;
            margin-bottom: 16px;
            animation: breathe 2s ease-in-out infinite;
        }
        
        .loading-text {
            color: var(--text-dim);
        }
        
        /* ============================================
           EXPLORER MODE EXTRAS (Hidden by default)
           ============================================ */
        .explorer-controls {
            display: none;
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 50;
        }
        
        body.explorer-mode .explorer-controls {
            display: flex;
            gap: 8px;
        }
        
        .explorer-btn {
            padding: 8px 16px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 0.85rem;
            cursor: pointer;
        }
        
        .explorer-btn:hover {
            color: var(--text);
            border-color: var(--kelly-blue);
        }
        
        /* Mode toggle (subtle) */
        .mode-toggle {
            position: fixed;
            bottom: 100px;
            right: 16px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
            z-index: 50;
        }
        
        .mode-toggle:hover {
            opacity: 1;
        }
        
        /* Mobile */
        @media (max-width: 600px) {
            .lesson-topic {
                font-size: 1.2rem;
            }
            .caption-text {
                font-size: 1rem;
                padding: 12px 16px;
            }
            .completion-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="loading-logo">✨</div>
        <div class="loading-text">Preparing your lesson...</div>
    </div>
    
    <!-- Age Gate (first visit) -->
    <div class="age-gate" id="age-gate">
        <div class="age-gate-title">Welcome! 👋</div>
        <div class="age-gate-subtitle">Kelly adapts to teach everyone — from ages 2 to 102</div>
        <div class="age-input-container">
            <input type="number" class="age-input" id="age-input" min="2" max="102" placeholder="?">
            <span class="age-label">years old</span>
        </div>
        <button class="age-submit" id="age-submit" disabled>Start Learning</button>
    </div>
    
    <!-- Main App -->
    <div class="app" id="app">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div class="kelly-stage" id="kelly-stage">
            <!-- Explorer mode controls (hidden by default) -->
            <div class="explorer-controls">
                <button class="explorer-btn" id="archetype-btn">🎭 The Explorer</button>
            </div>
            
            <div class="kelly-container" id="kelly-container">
                <div class="kelly-placeholder">✨</div>
            </div>
            
            <div class="caption-area">
                <div class="caption-phase" id="caption-phase">HOOK</div>
                <div class="caption-text" id="caption-text">Loading today's lesson...</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="lesson-info">
                <div class="lesson-day" id="lesson-day">Day 1 of 365</div>
                <div class="lesson-topic" id="lesson-topic">Loading...</div>
            </div>
            
            <div class="phase-dots" id="phase-dots">
                <div class="phase-dot active" data-phase="0"></div>
                <div class="phase-dot" data-phase="1"></div>
                <div class="phase-dot" data-phase="2"></div>
                <div class="phase-dot" data-phase="3"></div>
                <div class="phase-dot" data-phase="4"></div>
            </div>
            
            <button class="play-btn" id="play-btn">▶ Start Lesson</button>
        </div>
    </div>
    
    <!-- Completion Screen -->
    <div class="completion-screen" id="completion">
        <div class="completion-emoji">🎉</div>
        <div class="completion-title" id="completion-title">Day 1 Complete!</div>
        <div class="completion-subtitle" id="completion-subtitle">You learned about Starting Fresh</div>
        
        <div class="completion-next">
            <div class="completion-next-label">Tomorrow</div>
            <div class="completion-next-topic" id="next-topic">The Mystery of Sleep</div>
        </div>
        
        <a href="/" class="completion-cta">See You Tomorrow ✨</a>
    </div>
    
    <!-- Mode toggle (subtle) -->
    <button class="mode-toggle" id="mode-toggle">⚙️</button>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // CONFIG
        // ============================================
        const SUPABASE_URL = 'https://tvjalxxsyryjphkforjv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2amFseHhzeXJ5anBoa2Zvcmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NjM5MTksImV4cCI6MjA3OTEzOTkxOX0.VFrBs9sWkIgfFNpavQHxo0vSy6tkICpSbuj_TWvGHxI';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const PHASES = ['hook', 'q1', 'q2', 'q3', 'wisdom'];
        const PHASE_NAMES = {
            hook: 'Hook',
            q1: 'Fact 1',
            q2: 'Fact 2',
            q3: 'Fact 3',
            wisdom: 'Wisdom'
        };
        
        // Age to Archetype mapping (invisible to user)
        const AGE_TO_ARCHETYPE = {
            '2-5': 'The Explorer',
            '6-12': 'The Explorer',
            '13-17': 'The Scientist',
            '18-35': 'The Scientist',
            '36-55': 'The Provider',
            '56-102': 'The Mystic'
        };
        
        // ============================================
        // STATE
        // ============================================
        let state = {
            age: null,
            archetype: 'The Explorer',
            dayNumber: 1,
            currentPhase: 0,
            isPlaying: false,
            lessonData: null,
            atoms: [],
            videoElement: null,
            explorerMode: false
        };
        
        // ============================================
        // ELEMENTS
        // ============================================
        const els = {
            loading: document.getElementById('loading'),
            ageGate: document.getElementById('age-gate'),
            ageInput: document.getElementById('age-input'),
            ageSubmit: document.getElementById('age-submit'),
            app: document.getElementById('app'),
            progressFill: document.getElementById('progress-fill'),
            kellyContainer: document.getElementById('kelly-container'),
            captionPhase: document.getElementById('caption-phase'),
            captionText: document.getElementById('caption-text'),
            lessonDay: document.getElementById('lesson-day'),
            lessonTopic: document.getElementById('lesson-topic'),
            phaseDots: document.getElementById('phase-dots'),
            playBtn: document.getElementById('play-btn'),
            completion: document.getElementById('completion'),
            completionTitle: document.getElementById('completion-title'),
            completionSubtitle: document.getElementById('completion-subtitle'),
            nextTopic: document.getElementById('next-topic'),
            modeToggle: document.getElementById('mode-toggle'),
            archetypeBtn: document.getElementById('archetype-btn')
        };
        
        // ============================================
        // INIT
        // ============================================
        async function init() {
            // Check for stored age
            const storedAge = localStorage.getItem('kelly_user_age');
            
            if (storedAge) {
                state.age = parseInt(storedAge);
                state.archetype = getArchetypeForAge(state.age);
                await startLearning();
            } else {
                els.loading.classList.add('hidden');
                els.ageGate.classList.add('visible');
            }
            
            setupEventListeners();
        }
        
        function getArchetypeForAge(age) {
            if (age <= 5) return 'The Explorer';
            if (age <= 12) return 'The Explorer';
            if (age <= 17) return 'The Scientist';
            if (age <= 35) return 'The Scientist';
            if (age <= 55) return 'The Provider';
            return 'The Mystic';
        }
        
        function getDayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }
        
        // ============================================
        // DATA LOADING
        // ============================================
        async function startLearning() {
            els.ageGate.classList.remove('visible');
            
            // Get today's day number
            state.dayNumber = getDayOfYear();
            if (state.dayNumber < 1) state.dayNumber = 1;
            if (state.dayNumber > 365) state.dayNumber = 365;
            
            // Check URL for specific day
            const urlParams = new URLSearchParams(window.location.search);
            const dayParam = urlParams.get('day');
            if (dayParam) {
                state.dayNumber = Math.max(1, Math.min(365, parseInt(dayParam)));
            }
            
            await loadLesson(state.dayNumber);
            
            els.loading.classList.add('hidden');
            updateUI();
        }
        
        async function loadLesson(dayNumber) {
            try {
                // Load core lesson data
                const { data: lesson, error } = await supabase
                    .from('core_lessons')
                    .select('id, day_number, topic, universal_truth, marketing_headline')
                    .eq('day_number', dayNumber)
                    .single();
                
                if (error || !lesson) {
                    console.error('Lesson not found:', error);
                    state.lessonData = { topic: 'Today\'s Lesson', day_number: dayNumber };
                    return;
                }
                
                state.lessonData = lesson;
                
                // Load atoms for this lesson + archetype
                const { data: atoms } = await supabase
                    .from('lesson_atoms')
                    .select('phase, content, hd_video_url')
                    .eq('core_lesson_id', lesson.id)
                    .eq('archetype', state.archetype);
                
                state.atoms = atoms || [];
                
                // Also try to load from kelly_video_assets for video URLs
                const { data: videoAssets } = await supabase
                    .from('kelly_video_assets')
                    .select('phase, public_url, asset_type')
                    .eq('day_number', dayNumber)
                    .eq('age_bucket', state.archetype)
                    .eq('asset_type', 'video');
                
                // Merge video URLs into atoms
                if (videoAssets) {
                    for (const asset of videoAssets) {
                        const atom = state.atoms.find(a => a.phase === asset.phase || 
                            (asset.phase === 'q1' && a.phase === 'Fact1') ||
                            (asset.phase === 'q2' && a.phase === 'Fact2') ||
                            (asset.phase === 'q3' && a.phase === 'Fact3'));
                        if (atom && !atom.hd_video_url) {
                            atom.hd_video_url = asset.public_url;
                        }
                    }
                }
                
                console.log('✅ Lesson loaded:', state.lessonData.topic, '| Atoms:', state.atoms.length);
                
                // Load tomorrow's topic for completion screen
                const { data: nextLesson } = await supabase
                    .from('core_lessons')
                    .select('topic')
                    .eq('day_number', dayNumber < 365 ? dayNumber + 1 : 1)
                    .single();
                
                if (nextLesson) {
                    els.nextTopic.textContent = nextLesson.topic;
                }
                
            } catch (e) {
                console.error('Load error:', e);
            }
        }
        
        // ============================================
        // UI UPDATES
        // ============================================
        function updateUI() {
            // Lesson info
            els.lessonDay.textContent = `Day ${state.lessonData.day_number} of 365`;
            els.lessonTopic.textContent = state.lessonData.topic;
            
            // Progress
            const progress = ((state.currentPhase + 1) / PHASES.length) * 100;
            els.progressFill.style.width = progress + '%';
            
            // Phase dots
            const dots = els.phaseDots.querySelectorAll('.phase-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'completed');
                if (i < state.currentPhase) dot.classList.add('completed');
                if (i === state.currentPhase) dot.classList.add('active');
            });
            
            // Caption
            const phase = PHASES[state.currentPhase];
            els.captionPhase.textContent = PHASE_NAMES[phase] || phase;
            
            const atom = getAtomForPhase(phase);
            if (atom && atom.content) {
                const script = typeof atom.content === 'string' ? atom.content : 
                              (atom.content.script || atom.content.text || '');
                els.captionText.textContent = script || state.lessonData.universal_truth || 'Loading...';
            } else {
                els.captionText.textContent = state.lessonData.universal_truth || 'Loading...';
            }
            
            // Play button
            els.playBtn.textContent = state.isPlaying ? '⏸ Pause' : 
                                      state.currentPhase === 0 ? '▶ Start Lesson' : '▶ Continue';
            
            // Explorer mode archetype button
            if (els.archetypeBtn) {
                els.archetypeBtn.textContent = `🎭 ${state.archetype}`;
            }
        }
        
        function getAtomForPhase(phase) {
            // Map phase names
            const phaseMap = {
                'hook': ['hook', 'Hook'],
                'q1': ['q1', 'Fact1', 'fact1'],
                'q2': ['q2', 'Fact2', 'fact2'],
                'q3': ['q3', 'Fact3', 'fact3'],
                'wisdom': ['wisdom', 'Wisdom']
            };
            
            const validNames = phaseMap[phase] || [phase];
            return state.atoms.find(a => validNames.includes(a.phase));
        }
        
        // ============================================
        // PLAYBACK
        // ============================================
        async function playPhase() {
            const phase = PHASES[state.currentPhase];
            const atom = getAtomForPhase(phase);
            
            state.isPlaying = true;
            els.playBtn.classList.add('playing');
            els.playBtn.textContent = '⏸ Playing...';
            
            // Try to play video
            if (atom && atom.hd_video_url) {
                await playVideo(atom.hd_video_url);
            } else {
                // No video - simulate with timer
                console.log('No video for phase:', phase, '- using timer');
                await simulatePhase();
            }
        }
        
        async function playVideo(url) {
            return new Promise((resolve) => {
                // Remove existing video
                if (state.videoElement) {
                    state.videoElement.remove();
                }
                
                // Create video element
                const video = document.createElement('video');
                video.className = 'kelly-video';
                video.src = url;
                video.playsInline = true;
                video.autoplay = true;
                
                video.onended = () => {
                    handlePhaseComplete();
                    resolve();
                };
                
                video.onerror = () => {
                    console.error('Video error');
                    simulatePhase().then(resolve);
                };
                
                // Replace placeholder
                els.kellyContainer.innerHTML = '';
                els.kellyContainer.appendChild(video);
                state.videoElement = video;
                
                video.play().catch(e => {
                    console.error('Autoplay blocked:', e);
                    // User needs to interact - show play again
                    state.isPlaying = false;
                    updateUI();
                });
            });
        }
        
        async function simulatePhase() {
            return new Promise(resolve => {
                // Simulate 15-30 second phase
                const duration = 5000 + Math.random() * 10000;
                setTimeout(() => {
                    handlePhaseComplete();
                    resolve();
                }, duration);
            });
        }
        
        function handlePhaseComplete() {
            state.isPlaying = false;
            els.playBtn.classList.remove('playing');
            
            if (state.currentPhase < PHASES.length - 1) {
                // Next phase
                state.currentPhase++;
                updateUI();
                
                // Auto-advance after brief pause
                setTimeout(() => {
                    playPhase();
                }, 1000);
            } else {
                // Lesson complete!
                showCompletion();
            }
        }
        
        function showCompletion() {
            els.completionTitle.textContent = `Day ${state.lessonData.day_number} Complete!`;
            els.completionSubtitle.textContent = `You learned about ${state.lessonData.topic}`;
            els.completion.classList.add('visible');
            
            // Save completion
            localStorage.setItem('kelly_last_completed_day', state.dayNumber.toString());
            localStorage.setItem('kelly_last_completed_at', new Date().toISOString());
            
            // Track streak
            const lastDate = localStorage.getItem('kelly_last_lesson_date');
            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 86400000).toDateString();
            
            let streak = parseInt(localStorage.getItem('kelly_streak') || '0');
            if (lastDate === yesterday) {
                streak++;
            } else if (lastDate !== today) {
                streak = 1;
            }
            localStorage.setItem('kelly_streak', streak.toString());
            localStorage.setItem('kelly_last_lesson_date', today);
        }
        
        function togglePlayPause() {
            if (state.isPlaying) {
                // Pause
                if (state.videoElement) {
                    state.videoElement.pause();
                }
                state.isPlaying = false;
                updateUI();
            } else {
                // Play
                if (state.videoElement && state.videoElement.paused) {
                    state.videoElement.play();
                    state.isPlaying = true;
                    els.playBtn.textContent = '⏸ Playing...';
                } else {
                    playPhase();
                }
            }
        }
        
        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            // Age gate
            els.ageInput.addEventListener('input', () => {
                const val = parseInt(els.ageInput.value);
                els.ageSubmit.disabled = !(val >= 2 && val <= 102);
            });
            
            els.ageSubmit.addEventListener('click', () => {
                const age = parseInt(els.ageInput.value);
                if (age >= 2 && age <= 102) {
                    state.age = age;
                    state.archetype = getArchetypeForAge(age);
                    localStorage.setItem('kelly_user_age', age.toString());
                    localStorage.setItem('kelly_age_verified', 'true');
                    startLearning();
                }
            });
            
            // Enter key on age input
            els.ageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    els.ageSubmit.click();
                }
            });
            
            // Play button
            els.playBtn.addEventListener('click', togglePlayPause);
            
            // Phase dots
            els.phaseDots.addEventListener('click', (e) => {
                if (e.target.classList.contains('phase-dot') && state.explorerMode) {
                    const phase = parseInt(e.target.dataset.phase);
                    if (!isNaN(phase)) {
                        state.currentPhase = phase;
                        state.isPlaying = false;
                        if (state.videoElement) {
                            state.videoElement.pause();
                        }
                        updateUI();
                    }
                }
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlayPause();
                }
                if (e.code === 'ArrowRight' && state.explorerMode) {
                    if (state.currentPhase < PHASES.length - 1) {
                        state.currentPhase++;
                        updateUI();
                    }
                }
                if (e.code === 'ArrowLeft' && state.explorerMode) {
                    if (state.currentPhase > 0) {
                        state.currentPhase--;
                        updateUI();
                    }
                }
            });
            
            // Mode toggle
            els.modeToggle.addEventListener('click', () => {
                state.explorerMode = !state.explorerMode;
                document.body.classList.toggle('explorer-mode', state.explorerMode);
                els.modeToggle.textContent = state.explorerMode ? '🎯' : '⚙️';
            });
            
            // Click on stage to play/pause
            els.kellyContainer.addEventListener('click', () => {
                togglePlayPause();
            });
        }
        
        // ============================================
        // START
        // ============================================
        init();
    </script>
</body>
</html>
