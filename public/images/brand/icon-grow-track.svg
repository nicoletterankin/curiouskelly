<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Purple/Violet gradient for Grow track -->
    <linearGradient id="grow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="grow-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Brain/neural network icon - professional, modern -->
  <!-- Main brain shape -->
  <path d="M32 16 Q24 18, 20 24 Q18 28, 18 32 Q18 36, 20 40 Q24 46, 32 48 Q40 46, 44 40 Q46 36, 46 32 Q46 28, 44 24 Q40 18, 32 16 Z" 
        fill="url(#grow-gradient)"/>
  
  <!-- Neural pathways (curved lines representing connections) -->
  <path d="M24 24 Q28 26, 32 28 Q36 26, 40 24" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M26 32 Q30 30, 32 32 Q34 34, 38 32" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M24 40 Q28 38, 32 36 Q36 38, 40 40" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Connection nodes -->
  <circle cx="24" cy="24" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="32" cy="28" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="40" cy="24" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="26" cy="32" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff" opacity="1"/>
  <circle cx="38" cy="32" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="24" cy="40" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="32" cy="36" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="40" cy="40" r="2" fill="#ffffff" opacity="0.8"/>
  
  <!-- Glow effect -->
  <circle cx="32" cy="32" r="18" fill="url(#grow-glow)"/>
</svg>

