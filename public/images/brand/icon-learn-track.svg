<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gold/Amber gradient for Learn track -->
    <linearGradient id="learn-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="learn-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Book icon - professional, clean design -->
  <!-- Book cover (back) -->
  <rect x="18" y="14" width="20" height="28" rx="2" fill="url(#learn-gradient)" opacity="0.8"/>
  
  <!-- Book cover (front) -->
  <rect x="22" y="12" width="20" height="28" rx="2" fill="url(#learn-gradient)"/>
  
  <!-- Book pages -->
  <rect x="24" y="14" width="16" height="24" rx="1" fill="#ffffff" opacity="0.95"/>
  
  <!-- Book binding lines -->
  <line x1="24" y1="18" x2="40" y2="18" stroke="#f59e0b" stroke-width="0.8" opacity="0.3"/>
  <line x1="24" y1="22" x2="40" y2="22" stroke="#f59e0b" stroke-width="0.8" opacity="0.3"/>
  <line x1="24" y1="26" x2="40" y2="26" stroke="#f59e0b" stroke-width="0.8" opacity="0.3"/>
  <line x1="24" y1="30" x2="40" y2="30" stroke="#f59e0b" stroke-width="0.8" opacity="0.3"/>
  
  <!-- Glow effect -->
  <circle cx="32" cy="28" r="18" fill="url(#learn-glow)"/>
</svg>

