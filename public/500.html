<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Went Wrong - Curious Kelly</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #fafaf9 0%, #f5f5f4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      text-align: center;
    }
    .icon {
      font-size: 72px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      color: #1c1917;
      font-weight: 500;
      margin-bottom: 16px;
    }
    p {
      font-size: 18px;
      color: #57534e;
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-family: -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 500;
      transition: transform 0.2s;
    }
    a.button:hover {
      transform: translateY(-2px);
    }
    a.primary {
      background: #2563eb;
      color: white;
    }
    a.secondary {
      background: white;
      color: #1c1917;
      border: 1px solid #e7e5e4;
    }
    .status {
      margin-top: 32px;
      padding: 16px;
      background: #fef3c7;
      border-radius: 8px;
      font-size: 14px;
      color: #92400e;
    }
    .footer {
      margin-top: 48px;
      font-size: 14px;
      color: #a8a29e;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">😅</div>
    <h1>Oops, something broke</h1>
    <p>
      I'm usually more put together than this. 
      Give me a moment and try again?
    </p>
    <div class="buttons">
      <a href="javascript:location.reload()" class="button primary">Try Again</a>
      <a href="/" class="button secondary">Go Home</a>
    </div>
    <div class="status">
      If this keeps happening, check <a href="https://status.curiouskelly.com" style="color: #92400e; text-decoration: underline;">status.curiouskelly.com</a>
    </div>
    <div class="footer">
      Need help? <a href="mailto:hello@curiouskelly.com" style="text-decoration: underline;">hello@curiouskelly.com</a>
    </div>
  </div>
</body>
</html>
