<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>My Profile — Curious Kelly</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/apple-touch-icon.png" />

    <!-- Brand CSS -->
    <link rel="stylesheet" href="/css/brand-colors.css" />

    <!-- Config -->
    <script src="/config.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-dark);
        color: var(--text-primary);
        min-height: 100vh;
        padding-bottom: 80px;
      }

      .profile-header {
        padding: 40px 20px;
        text-align: center;
        background: linear-gradient(180deg, var(--surface-dark) 0%, var(--bg-dark) 100%);
      }

      .avatar-circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--kelly-blue) 0%, #60a5fa 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        margin: 0 auto 16px;
        border: 3px solid var(--border-dark);
      }

      .profile-name {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .profile-email {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      .member-since {
        font-size: 12px;
        color: var(--text-muted);
      }

      .streak-hero {
        padding: 32px 20px;
        text-align: center;
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
        border-top: 1px solid rgba(245, 158, 11, 0.2);
        border-bottom: 1px solid rgba(245, 158, 11, 0.2);
      }

      .streak-number {
        font-size: 72px;
        font-weight: 900;
        color: var(--gold);
        line-height: 1;
        margin-bottom: 8px;
      }

      .streak-label {
        font-size: 18px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stats-grid {
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .stat-box {
        padding: 20px;
        background: var(--surface-dark);
        border-radius: 12px;
        text-align: center;
      }

      .stat-box-value {
        font-size: 32px;
        font-weight: 700;
        color: var(--kelly-blue);
        margin-bottom: 4px;
      }

      .stat-box-label {
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
      }

      .section {
        padding: 20px;
      }

      .section-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badges-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .badge-card {
        padding: 20px;
        background: var(--surface-dark);
        border-radius: 12px;
        text-align: center;
        transition: all 0.2s;
      }

      .badge-card.earned {
        border: 2px solid var(--kelly-blue);
        box-shadow: 0 0 20px rgba(37, 99, 235, 0.2);
      }

      .badge-card.locked {
        opacity: 0.4;
      }

      .badge-icon {
        font-size: 48px;
        margin-bottom: 8px;
      }

      .badge-name {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .badge-desc {
        font-size: 11px;
        color: var(--text-secondary);
      }

      /* Bottom Navigation */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 70px;
        background: var(--surface-dark);
        border-top: 1px solid var(--border-dark);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 1000;
      }

      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-decoration: none;
        color: var(--text-secondary);
        transition: all 0.2s;
        padding: 8px;
      }

      .nav-item:hover,
      .nav-item.active {
        color: var(--kelly-blue);
      }

      .nav-icon {
        font-size: 24px;
      }

      .nav-label {
        font-size: 11px;
        font-weight: 500;
      }

      @media (max-width: 640px) {
        .badges-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="profile-header">
      <div class="avatar-circle">👤</div>
      <div class="profile-name" id="profile-name">Loading...</div>
      <div class="profile-email" id="profile-email"></div>
      <div class="member-since" id="member-since"></div>
    </div>

    <div class="streak-hero">
      <div class="streak-number" id="streak-number">0</div>
      <div class="streak-label">🔥 Day Streak</div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-box-value" id="completed-stat">0</div>
        <div class="stat-box-label">Completed</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-value" id="remaining-stat">365</div>
        <div class="stat-box-label">Remaining</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-value" id="percent-stat">0%</div>
        <div class="stat-box-label">Progress</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        <span>🏆</span>
        <span>Badges</span>
      </div>
      <div class="badges-grid">
        <div class="badge-card" data-badge="first-lesson">
          <div class="badge-icon">📚</div>
          <div class="badge-name">First Lesson</div>
          <div class="badge-desc">Complete 1 lesson</div>
        </div>
        <div class="badge-card" data-badge="week-streak">
          <div class="badge-icon">🔥</div>
          <div class="badge-name">Week Warrior</div>
          <div class="badge-desc">7-day streak</div>
        </div>
        <div class="badge-card" data-badge="month-streak">
          <div class="badge-icon">👑</div>
          <div class="badge-name">Month Master</div>
          <div class="badge-desc">30-day streak</div>
        </div>
        <div class="badge-card" data-badge="explorer">
          <div class="badge-icon">🧭</div>
          <div class="badge-name">Explorer</div>
          <div class="badge-desc">Try all tones</div>
        </div>
        <div class="badge-card" data-badge="scholar">
          <div class="badge-icon">🎓</div>
          <div class="badge-name">Scholar</div>
          <div class="badge-desc">100 lessons</div>
        </div>
        <div class="badge-card" data-badge="completionist">
          <div class="badge-icon">🏆</div>
          <div class="badge-name">Completionist</div>
          <div class="badge-desc">All 365 days</div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="/" class="nav-item">
        <div class="nav-icon">⌂</div>
        <div class="nav-label">Home</div>
      </a>
      <a href="/calendar.html" class="nav-item">
        <div class="nav-icon">🗓️</div>
        <div class="nav-label">Calendar</div>
      </a>
      <a href="/learn.html" class="nav-item">
        <div class="nav-icon">📖</div>
        <div class="nav-label">Learn</div>
      </a>
      <a href="/me.html" class="nav-item active">
        <div class="nav-icon">👤</div>
        <div class="nav-label">Me</div>
      </a>
      <a href="/settings.html" class="nav-item">
        <div class="nav-icon">⚙️</div>
        <div class="nav-label">Settings</div>
      </a>
    </nav>

    <script>
      const supabase = window.supabase.createClient(
        window.SUPABASE_URL || 'https://tvjalxxsyryjphkforjv.supabase.co',
        window.SUPABASE_ANON_KEY ||
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2amFseHhzeXJ5anBoa2Zvcmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NjM5MTksImV4cCI6MjA3OTEzOTkxOX0.VFrBs9sWkIgfFNpavQHxo0vSy6tkICpSbuj_TWvGHxI'
      );

      let completedDays = new Set();
      let streakCount = 0;

      async function loadProfile() {
        try {
          const {
            data: { user }
          } = await supabase.auth.getUser();

          if (user) {
            // Display user info
            document.getElementById('profile-name').textContent =
              user.user_metadata?.full_name || user.email?.split('@')[0] || 'Learner';
            document.getElementById('profile-email').textContent = user.email || '';

            const memberSince = new Date(user.created_at).toLocaleDateString('en-US', {
              month: 'long',
              year: 'numeric'
            });
            document.getElementById('member-since').textContent = `Member since ${memberSince}`;

            // Load progress
            const { data, error } = await supabase
              .from('user_progress')
              .select('day_number')
              .eq('user_id', user.id);

            if (!error && data) {
              completedDays = new Set(data.map((p) => p.day_number));
              calculateStreak();
              updateStats();
              updateBadges();
            }
          } else {
            // Guest mode
            document.getElementById('profile-name').textContent = 'Guest';
            document.getElementById('profile-email').textContent = 'Sign in to save progress';
            document.getElementById('member-since').textContent = '';
          }
        } catch (error) {
          console.error('[Profile] Error loading:', error);
        }
      }

      function calculateStreak() {
        if (completedDays.size === 0) {
          streakCount = 0;
          return;
        }

        const sorted = Array.from(completedDays).sort((a, b) => b - a);
        const today = getDayOfYear();

        let streak = 0;
        let checkDay = today;

        while (sorted.includes(checkDay)) {
          streak++;
          checkDay--;
        }

        streakCount = streak;
      }

      function getDayOfYear() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        return Math.floor((now - start) / (1000 * 60 * 60 * 24));
      }

      function updateStats() {
        const completed = completedDays.size;
        const remaining = 365 - completed;
        const percent = Math.round((completed / 365) * 100);

        document.getElementById('streak-number').textContent = streakCount;
        document.getElementById('completed-stat').textContent = completed;
        document.getElementById('remaining-stat').textContent = remaining;
        document.getElementById('percent-stat').textContent = `${percent}%`;
      }

      function updateBadges() {
        const completed = completedDays.size;

        // First Lesson
        if (completed >= 1) {
          document.querySelector('[data-badge="first-lesson"]').classList.add('earned');
        }

        // Week Streak
        if (streakCount >= 7) {
          document.querySelector('[data-badge="week-streak"]').classList.add('earned');
        }

        // Month Streak
        if (streakCount >= 30) {
          document.querySelector('[data-badge="month-streak"]').classList.add('earned');
        }

        // Scholar (100 lessons)
        if (completed >= 100) {
          document.querySelector('[data-badge="scholar"]').classList.add('earned');
        }

        // Completionist (all 365)
        if (completed >= 365) {
          document.querySelector('[data-badge="completionist"]').classList.add('earned');
        }

        // Mark locked badges
        document.querySelectorAll('.badge-card').forEach((badge) => {
          if (!badge.classList.contains('earned')) {
            badge.classList.add('locked');
          }
        });
      }

      // Initialize
      loadProfile();
    </script>
  </body>
</html>
