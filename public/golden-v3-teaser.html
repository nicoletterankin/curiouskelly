  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --c-bg: #000000;
      --c-surface: #0a0a0a;
      --c-accent: #D4A574;
      --c-accent-light: #E8C9A6;
      --c-text: #FAFAF9;
      --c-text-dim: #A8A29E;

      --font-body: 'Inter', -apple-system, system-ui, sans-serif;
      
      --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
    }
    
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    
    body {
      font-family: var(--font-body);
      background: var(--c-bg);
      color: var(--c-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ═══════════════════════════════════════════════════════════════════════════
       HERO SECTION - FULL SCREEN VIDEO
    ═══════════════════════════════════════════════════════════════════════════ */
    
    .hero {
      position: relative;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }
    
    /* Video Container */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .hero-video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      object-fit: cover;
    }
    
    /* Cinematic Gradient Overlay */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(180deg, 
          rgba(0,0,0,0.3) 0%, 
          transparent 30%,
          transparent 50%,
          rgba(0,0,0,0.7) 80%,
          rgba(0,0,0,0.95) 100%
        );
      pointer-events: none;
    }
    
    /* Vignette Effect */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 200px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    
    /* Film Grain Effect */
    .grain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
    
    /* Content Overlay */
    .hero-content {
      position: relative;
      z-index: 10;
      padding: 0 clamp(24px, 5vw, 80px) clamp(40px, 8vh, 120px);
      max-width: 800px;
    }
    
    /* Pre-title */
    .pre-title {
      font-family: var(--font-body);
      font-size: clamp(0.7rem, 1vw, 0.85rem);
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--c-gold);
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out-expo) 0.5s forwards;
    }
    
    /* Main Title */
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 1.2s var(--ease-out-expo) 0.7s forwards;
    }
    
    .hero-title span {
      display: block;
    }
    
    .hero-title .line-2 {
      font-style: italic;
      font-weight: 400;
      color: var(--c-accent-light);
    }
    
    /* Subtitle */
    .hero-subtitle {

      opacity: 0;
      animation: fadeUp 1s var(--ease-out-expo) 0.9s forwards;
    }
    
    /* CTA Button */
    .cta-container {
      margin-top: 32px;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out-expo) 1.1s forwards;
    }
    
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      background: transparent;
      border: 1px solid var(--c-gold);
      color: var(--c-gold);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
      position: relative;
      overflow: hidden;
    }
    
    .cta-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--c-gold);
      transform: translateX(-101%);
      transition: transform 0.4s var(--ease-out-expo);
      z-index: -1;
    }
    
    .cta-btn:hover {
      color: var(--c-bg);
      box-shadow: 0 0 40px var(--c-gold-glow);
    }
    
    .cta-btn:hover::before {
      transform: translateX(0);
    }
    
    .cta-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }
    
    .cta-btn:hover svg {
      transform: translateX(4px);
    }
    
    /* Play Button (Center) */
    .play-btn-center {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 100px;
      height: 100px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1s ease 1.5s forwards;
    }
    
    .play-btn-center:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 60px rgba(255,255,255,0.3);
    }
    
    .play-btn-center svg {
      width: 40px;
      height: 40px;
      fill: white;
      margin-left: 6px;
    }
    
    .play-btn-center.playing {
      opacity: 0;
      pointer-events: none;
    }
    
    /* Video Phase Selector */
    .phase-selector {
      position: absolute;
      bottom: 120px;
      right: clamp(24px, 5vw, 80px);
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 8px;

      animation: fadeIn 1s ease 2s forwards;
    }
    
    .phase-btn {

      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: var(--c-text-dim);
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
    }
    
    .phase-btn:hover, .phase-btn.active {
      background: rgba(201, 168, 108, 0.15);
      border-color: var(--c-gold);
      color: var(--c-gold);
    }
    
    .phase-btn.active {
      box-shadow: 0 0 20px var(--c-gold-glow);
    }
    
    /* Progress Bar */
    .video-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.1);
      z-index: 20;
    }
    
    .video-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--c-gold), var(--c-accent-light));
      width: 0%;
      transition: width 0.1s linear;
    }
    
    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* Badge */
    .golden-badge {
      position: absolute;
      top: clamp(20px, 4vh, 40px);
      right: clamp(24px, 5vw, 80px);
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(201, 168, 108, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201, 168, 108, 0.3);
      border-radius: 4px;
      opacity: 0;
      animation: fadeIn 1s ease 1.8s forwards;
    }
    
    .golden-badge span {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--c-gold);
    }
    
    /* Logo */
    .logo {
      position: absolute;
      top: clamp(20px, 4vh, 40px);
      left: clamp(24px, 5vw, 80px);
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s ease 0.3s forwards;
    }
    
    .logo-icon {
      font-size: 1.5rem;
    }
    
    .logo-text {
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--c-text);
      letter-spacing: 0.02em;
    }
    
    /* Sound Toggle */
    .sound-toggle {
      position: absolute;
      bottom: clamp(20px, 4vh, 40px);
      right: clamp(24px, 5vw, 80px);
      z-index: 25;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }
    
    .sound-toggle:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.1);
    }
    
    .sound-toggle svg {
      width: 20px;
      height: 20px;
      fill: white;
    }
    
    .sound-toggle.muted .sound-on { display: none; }
    .sound-toggle:not(.muted) .sound-off { display: none; }
    
    /* Responsive */
    @media (max-width: 768px) {
      .phase-selector {
        bottom: auto;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        gap: 6px;
      }
      
      .phase-btn {
        padding: 8px 12px;
        font-size: 0.7rem;
      }
      
      .play-btn-center {
        width: 80px;
        height: 80px;
      }
      
      .play-btn-center svg {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <!-- Video Background -->
    <div class="video-container">

      >

    <!-- Phase Selector -->
    <div class="phase-selector">

      <svg class="sound-on" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg class="sound-off" viewBox="0 0 24 24">
        <path d="M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>

    <!-- Progress Bar -->
    <div class="video-progress">
      <div class="video-progress-fill" id="progressFill"></div>

    <!-- Hero Content -->
    <div class="hero-content">

  <script>
    /**
     * GOLDEN V3 - Video Player Controller
     */
    const SUPABASE_BASE = 'https://tvjalxxsyryjphkforjv.supabase.co/storage/v1/object/public/kelly-templates/production/videos/golden';
    const ARCHETYPE = 'The_Explorer';
    
    const video = document.getElementById('heroVideo');
    const videoSource = document.getElementById('videoSource');
    const playBtn = document.getElementById('playBtn');
    const soundToggle = document.getElementById('soundToggle');
    const progressFill = document.getElementById('progressFill');
    const phaseBtns = document.querySelectorAll('.phase-btn');
    
    let currentPhase = 'Hook';
    let isPlaying = false;
    
    // Build video URL for phase
    function getVideoUrl(phase) {
      return `${SUPABASE_BASE}/day_001_${phase}_${ARCHETYPE}_golden.mp4`;
    }
    
    // Load video for phase
    function loadPhase(phase) {
      currentPhase = phase;
      const url = getVideoUrl(phase);
      
      // Update active button
      phaseBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.phase === phase);
      });
      
      // Load new video
      videoSource.src = url;
      video.load();
      
      // Auto-play if was playing
      if (isPlaying) {
        video.play();
      }
      
      console.log(`[Golden V3] Loading: ${phase}`);
    }
    
    // Play/Pause toggle
    function togglePlay() {
      if (video.paused) {
        video.play();
        playBtn.classList.add('playing');
        isPlaying = true;
      } else {
        video.pause();
        playBtn.classList.remove('playing');
        isPlaying = false;
      }
    }
    
    // Sound toggle
    function toggleSound() {
      video.muted = !video.muted;
      soundToggle.classList.toggle('muted', video.muted);
    }
    
    // Progress update
    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const percent = (video.currentTime / video.duration) * 100;
        progressFill.style.width = `${percent}%`;
      }
    });
    
    // Auto-advance to next phase
    video.addEventListener('ended', () => {
      const phases = ['Hook', 'Fact1', 'Fact2', 'Fact3', 'Wisdom'];
      const currentIndex = phases.indexOf(currentPhase);
      
      if (currentIndex < phases.length - 1) {
        loadPhase(phases[currentIndex + 1]);
        video.play();
      } else {
        // Loop back to start
        loadPhase('Hook');
        playBtn.classList.remove('playing');
        isPlaying = false;
      }
    });
    
    // Event listeners
    playBtn.addEventListener('click', togglePlay);
    soundToggle.addEventListener('click', toggleSound);
    
    phaseBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        loadPhase(btn.dataset.phase);
        if (!isPlaying) togglePlay();
      });
    });
    
    // Click video to toggle
    video.addEventListener('click', togglePlay);
    
    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyM') {
        toggleSound();
      } else if (e.code === 'ArrowRight') {
        const phases = ['Hook', 'Fact1', 'Fact2', 'Fact3', 'Wisdom'];
        const currentIndex = phases.indexOf(currentPhase);
        if (currentIndex < phases.length - 1) {
          loadPhase(phases[currentIndex + 1]);
        }
      } else if (e.code === 'ArrowLeft') {
        const phases = ['Hook', 'Fact1', 'Fact2', 'Fact3', 'Wisdom'];
        const currentIndex = phases.indexOf(currentPhase);
        if (currentIndex > 0) {
          loadPhase(phases[currentIndex - 1]);
        }
      }
    });
    
    // Preload all videos
    const preloadPhases = ['Hook', 'Fact1', 'Fact2', 'Fact3', 'Wisdom'];
    preloadPhases.forEach(phase => {
      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = getVideoUrl(phase);
      link.as = 'video';
      document.head.appendChild(link);
    });
    
    console.log('✨ Golden V3 Teaser Ready');
    console.log('Controls: SPACE=play/pause, M=mute, ←→=phases');
  </script>
</body>
