<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ziggurat — Floor Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: #1a1a24;
            --led: #ff6b35;
            --cyan: #00d4ff;
            --magenta: #ff00aa;
            --green: #22c55e;
            --yellow: #eab308;
            --building: #c4a574;
            --text: #fff;
            --text-muted: #888;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        /* Header */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
        }
        
        .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo-icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--led), var(--cyan));
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        
        .logo span { 
            background: linear-gradient(135deg, var(--led), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 24px;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.2s;
        }
        
        nav a:hover { 
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }
        
        /* Main Layout */
        main {
            display: flex;
            min-height: calc(100vh - 70px);
        }
        
        /* Floor Selector */
        .floor-nav {
            width: 100px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            position: sticky;
            top: 70px;
            height: calc(100vh - 70px);
        }
        
        .floor-nav-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }
        
        .floor-btn {
            width: 60px;
            height: 60px;
            margin: 6px 0;
            background: rgba(255,255,255,0.03);
            border: 2px solid transparent;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            position: relative;
        }
        
        .floor-btn::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--led), var(--cyan));
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
        }
        
        .floor-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            transform: translateX(5px);
        }
        
        .floor-btn.active {
            background: linear-gradient(135deg, var(--led), var(--magenta));
            color: white;
            transform: translateX(5px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }
        
        .floor-btn.lobby {
            border: 2px solid var(--led);
        }
        
        .floor-btn-sf {
            font-size: 8px;
            font-weight: 400;
            opacity: 0.7;
        }
        
        /* Content */
        .content {
            flex: 1;
            padding: 50px;
            overflow-y: auto;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .floor-header {
            margin-bottom: 50px;
        }
        
        .floor-header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .floor-header h1 .floor-name {
            background: linear-gradient(135deg, #fff 0%, var(--building) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .floor-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--led), var(--magenta));
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .floor-desc {
            color: var(--text-muted);
            font-size: 17px;
            margin-top: 20px;
            max-width: 700px;
            line-height: 1.7;
        }
        
        /* Stats Grid */
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 32px;
            min-width: 160px;
            transition: all 0.3s ease;
        }
        
        .stat-box:hover {
            border-color: rgba(255, 107, 53, 0.3);
            transform: translateY(-3px);
        }
        
        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--led) 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Zones */
        .zones-section {
            margin-bottom: 50px;
        }
        
        .zones-section h2 {
            font-size: 14px;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .zones-section h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
        }
        
        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .zone-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .zone-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--led), var(--cyan));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .zone-card:hover {
            border-color: rgba(255, 107, 53, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .zone-card:hover::before {
            opacity: 1;
        }
        
        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .zone-name {
            font-weight: 700;
            font-size: 15px;
        }
        
        .zone-sf {
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--led), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .zone-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }
        
        .zone-confidence {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .zone-confidence::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        .zone-confidence.high {
            background: rgba(34, 197, 94, 0.15);
            color: var(--green);
        }
        
        .zone-confidence.high::before {
            background: var(--green);
        }
        
        .zone-confidence.medium {
            background: rgba(234, 179, 8, 0.15);
            color: var(--yellow);
        }
        
        .zone-confidence.medium::before {
            background: var(--yellow);
        }
        
        /* Features */
        .features-list {
            list-style: none;
        }
        
        .features-list li {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .features-list li:hover {
            padding-left: 10px;
        }
        
        .features-list li::before {
            content: '✓';
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--led), var(--magenta));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .feature-verified {
            background: rgba(34, 197, 94, 0.15);
            color: var(--green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            margin-left: auto;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Cross-section */
        .cross-section {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-top: 50px;
        }
        
        .cross-section h3 {
            margin-bottom: 30px;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .section-diagram {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .section-floor {
            height: 40px;
            background: linear-gradient(135deg, var(--building) 0%, #9a8462 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .section-floor::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--led), var(--cyan));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .section-floor:hover {
            transform: translateX(10px);
        }
        
        .section-floor:hover::before {
            opacity: 1;
        }
        
        .section-floor.current {
            background: linear-gradient(135deg, var(--led), var(--magenta));
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
            transform: translateX(10px);
        }
        
        .section-floor.below-grade {
            opacity: 0.6;
        }
        
        .section-floor-sf {
            font-weight: 400;
            opacity: 0.8;
        }
        
        /* LED Indicator */
        .led-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 12px 16px;
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.2);
            border-radius: 12px;
            font-size: 12px;
            color: var(--led);
        }
        
        .led-indicator::before {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--led);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--led);
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>

                tag: "Ground / Below Grade",
                sf: "331,200",
                terrace: null,
                dimensions: "~1,020' × 325'",
                bays: "~34 × 11",
                grade: "BELOW (buried in hillside)",
                windows: "NONE",
                ceiling: "18-20 ft clear",
                desc: "The largest floor at 331,200 SF, entirely below grade and windowless. Originally designed for electronics manufacturing with cleanrooms for aerospace guidance systems. Contains spray-on asbestos fireproofing on ceiling structure. National Archives previously stored records here (now relocated to Perris, CA).",
                zones: [
                    { name: "Central Core", sf: "14,400", desc: "Elevator machine rooms (bottom of shafts), fire stairs, main mechanical risers, electrical switchgear", confidence: "high" },
                    { name: "Manufacturing Bays", sf: "180,000", desc: "Open-span manufacturing. Original: electronics assembly, PCB production. Currently: storage/warehouse", confidence: "high" },
                    { name: "Cleanroom Zone", sf: "40,000", desc: "Original Class 100-1000 cleanrooms for guidance system assembly. Laminar flow HVAC, gowning rooms", confidence: "medium" },
                    { name: "Loading/Receiving", sf: "25,000", desc: "Multiple truck-height loading docks. East/west ends for service road access", confidence: "medium" },
                    { name: "Warehouse/Storage", sf: "30,000", desc: "Raw materials, WIP, finished goods. National Archives used for records", confidence: "medium" },
                    { name: "Central Mechanical", sf: "25,000", desc: "Main HVAC air handlers, chilled water distribution, electrical substations, generators", confidence: "medium" },
                    { name: "Circulation/Service", sf: "16,800", desc: "Wide service corridors (forklift-capable), freight elevator lobbies", confidence: "medium" }
                ],
                features: [
                    { text: "Completely below grade (buried in hillside)", verified: true },
                    { text: "No windows — windowless manufacturing", verified: true },
                    { text: "Spray-on asbestos fire-resistant material on ceiling", verified: true },
                    { text: "Asbestos thermal insulation pipe wrap", verified: true },
                    { text: "Original cleanroom infrastructure", verified: false },
                    { text: "18-20 ft clear ceiling height", verified: false }
                ]
            }
        };
        
        function renderFloor(floorNum) {
            const floor = floorData[floorNum];
            const content = document.getElementById('floorContent');
            
            // Update nav
            document.querySelectorAll('.floor-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.floor == floorNum);
            });
            
            // Animate content change
            content.style.animation = 'none';
            content.offsetHeight; // Trigger reflow
            content.style.animation = 'fadeIn 0.4s ease';
            
            content.innerHTML = `
                <div class="floor-header">
                    <h1>
                        <span class="floor-name">${floor.name}</span>
                        <span class="floor-tag">${floor.tag}</span>
                    </h1>
                    <p class="floor-desc">${floor.desc}</p>
                </div>
                
                <div class="stats-row">
                    <div class="stat-box">
                        <div class="stat-value">${floor.sf}</div>
                        <div class="stat-label">Square Feet</div>
                    </div>
                    ${floor.terrace ? `
                    <div class="stat-box">
                        <div class="stat-value">${floor.terrace}</div>
                        <div class="stat-label">Terrace SF Above</div>
                    </div>
                    ` : ''}
                    <div class="stat-box">
                        <div class="stat-value">${floor.dimensions}</div>
                        <div class="stat-label">Dimensions</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${floor.bays}</div>
                        <div class="stat-label">Bay Count (30' grid)</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${floor.ceiling}</div>
                        <div class="stat-label">Ceiling Height</div>
                    </div>
                </div>
                
                ${floor.terrace ? `
                <div class="led-indicator">
                    <span><strong>${floor.terrace} SF</strong> of terrace above = LED canvas potential</span>
                </div>
                ` : ''}
                
                <div class="zones-section">
                    <h2>Predicted Spatial Organization</h2>
                    <div class="zones-grid">
                        ${floor.zones.map(zone => `
                            <div class="zone-card">
                                <div class="zone-header">
                                    <span class="zone-name">${zone.name}</span>
                                    <span class="zone-sf">${zone.sf} SF</span>
                                </div>
                                <p class="zone-desc">${zone.desc}</p>
                                <span class="zone-confidence ${zone.confidence}">${zone.confidence} confidence</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="zones-section">
                    <h2>Documented Features</h2>
                    <ul class="features-list">
                        ${floor.features.map(f => `
                            <li>${f.text} ${f.verified ? '<span class="feature-verified">Verified</span>' : ''}</li>
                        `).join('')}
                    </ul>
                </div>
                
                <div class="cross-section">
                    <h3>Building Cross-Section</h3>
                    <div class="section-diagram">
                        ${[7,6,5,4,3,2,1].map(f => `
                            <div class="section-floor ${f == floorNum ? 'current' : ''} ${f == 1 ? 'below-grade' : ''}" 
                                 style="width: ${[15, 30, 45, 60, 75, 90, 100][7-f]}%"
                                 onclick="renderFloor(${f})">
                                <span>F${f} ${f == 4 ? '★ LOBBY' : ''}</span>
                                <span class="section-floor-sf">${floorData[f].sf} SF</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        // Event listeners
        document.querySelectorAll('.floor-btn').forEach(btn => {
            btn.addEventListener('click', () => renderFloor(parseInt(btn.dataset.floor)));
        });
        
        // Initial render - start with the lobby (most interesting floor)
        renderFloor(4);
    </script>
</body>
</html>
