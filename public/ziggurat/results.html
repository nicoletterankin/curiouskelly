<!DOCTYPE html>
<html>
<head>
    <title>Generated Mockups</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; font-family: sans-serif; color: #fff; }
        h1 { text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1600px; margin: 0 auto; }
        .card { background: #222; border-radius: 12px; overflow: hidden; }
        .card h2 { padding: 15px; margin: 0; font-size: 18px; background: #333; }
        .card img { width: 100%; display: block; }
    </style>
</head>
<body>
    <h1>Ziggurat LED Mockups — Generated</h1>
    <div class="grid">
        <div class="card">
            <h2>Before (Original)</h2>
            <img src="ziggurat-before.png" alt="Before">
        </div>
        <div class="card">
            <h2>Zoning Diagram</h2>
            <img src="ziggurat-led-zoning.png" alt="Zoning">
        </div>
        <div class="card">
            <h2>Day</h2>
            <img src="ziggurat-led-day.png" alt="Day">
        </div>
        <div class="card">
            <h2>Dusk</h2>
            <img src="ziggurat-led-dusk.png" alt="Dusk">
        </div>
        <div class="card">
            <h2>Night</h2>
            <img src="ziggurat-led-night.png" alt="Night">
        </div>
        <div class="card">
            <h2>Final</h2>
            <img src="ziggurat-led-final.png" alt="Final">
        </div>
    </div>
</body>
</html>
