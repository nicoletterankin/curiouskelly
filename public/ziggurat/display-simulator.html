<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziggurat Display Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .main-view {
            flex: 1;
            position: relative;
            background: #050505;
        }
        
        #mainCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .view-selector {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            gap: 6px;
        }
        
        .view-btn {
            padding: 8px 14px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #333;
            border-radius: 4px;
            color: #888;
            font-size: 11px;
            cursor: pointer;
        }
        
        .view-btn:hover { border-color: #666; color: #fff; }
        .view-btn.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
        
        .time-controls {
            position: absolute;
            bottom: 16px;
            left: 16px;
            display: flex;
            gap: 6px;
        }
        
        .panel {
            width: 320px;
            background: #0f0f0f;
            border-left: 1px solid #222;
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            padding: 16px;
            border-bottom: 1px solid #222;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .section {
            margin-bottom: 24px;
        }
        
        .section-title {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        /* Content presets */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .content-thumb {
            aspect-ratio: 2/1;
            background: #222;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .content-thumb:hover { border-color: #444; }
        .content-thumb.active { border-color: #ff6b35; }
        
        .content-thumb img, .content-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Color mode */
        .color-modes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        
        .color-mode {
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .color-mode:hover { border-color: #444; }
        .color-mode.active { border-color: #fff; }
        
        /* Upload */
        .upload-zone {
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .upload-zone:hover {
            border-color: #ff6b35;
            background: rgba(255, 107, 53, 0.05);
        }
        
        .upload-zone p {
            font-size: 11px;
            color: #666;
        }
        
        #fileInput {
            display: none;
        }
        
        /* Animation controls */
        .animation-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .anim-btn {
            flex: 1;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #888;
            font-size: 10px;
            cursor: pointer;
        }
        
        .anim-btn:hover { border-color: #ff6b35; color: #fff; }
        .anim-btn.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
        
        /* Stats */
        .stats {
            background: #151515;
            border-radius: 6px;
            padding: 12px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 11px;
            border-bottom: 1px solid #222;
        }
        
        .stat-row:last-child { border: none; }
        .stat-value { color: #ff6b35; font-weight: 600; }
        
        /* Mini building diagram */
        .building-diagram {
            background: #151515;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .diagram-floor {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        
        .diagram-bar {
            height: 16px;
            background: #333;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }
        
        .diagram-bar.active {
            background: linear-gradient(90deg, #ff6b35, #ff8f35);
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }
        
        .diagram-label {
            width: 30px;
            font-size: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-view">
            <canvas id="mainCanvas"></canvas>
            
            <div class="view-selector">
                <button class="view-btn active" onclick="setView(0)">NW Quarter</button>
                <button class="view-btn" onclick="setView(1)">North Front</button>
                <button class="view-btn" onclick="setView(2)">NE Corner</button>
                <button class="view-btn" onclick="setView(3)">Close-up</button>
            </div>
            
            <div class="time-controls">
                <button class="view-btn" onclick="setTime('day')">Day</button>
                <button class="view-btn active" onclick="setTime('dusk')">Dusk</button>
                <button class="view-btn" onclick="setTime('night')">Night</button>
            </div>
        </div>
        
        <div class="panel">
            <div class="panel-header">Display Content</div>
            <div class="panel-content">
                
                <div class="section">
                    <div class="section-title">Active Terraces</div>
                    <div class="building-diagram">
                        <div class="diagram-floor">
                            <span class="diagram-label">F6</span>
                            <div class="diagram-bar active" style="width: 60px" onclick="toggleTerrace(6)"></div>
                        </div>
                        <div class="diagram-floor">
                            <span class="diagram-label">F5</span>
                            <div class="diagram-bar active" style="width: 90px" onclick="toggleTerrace(5)"></div>
                        </div>
                        <div class="diagram-floor">
                            <span class="diagram-label">F4</span>
                            <div class="diagram-bar active" style="width: 120px" onclick="toggleTerrace(4)"></div>
                        </div>
                        <div class="diagram-floor">
                            <span class="diagram-label">F3</span>
                            <div class="diagram-bar active" style="width: 160px" onclick="toggleTerrace(3)"></div>
                        </div>
                        <div class="diagram-floor">
                            <span class="diagram-label">F2</span>
                            <div class="diagram-bar active" style="width: 200px" onclick="toggleTerrace(2)"></div>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">Content Mode</div>
                    <div class="content-grid">
                        <div class="content-thumb active" onclick="setContent('solid')" title="Solid Color">🎨</div>
                        <div class="content-thumb" onclick="setContent('gradient')" title="Gradient">🌈</div>
                        <div class="content-thumb" onclick="setContent('wave')" title="Wave Animation">🌊</div>
                        <div class="content-thumb" onclick="setContent('pulse')" title="Pulse">💫</div>
                        <div class="content-thumb" onclick="setContent('chase')" title="Chase">➡️</div>
                        <div class="content-thumb" onclick="setContent('image')" title="Custom Image">🖼️</div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">Color Palette</div>
                    <div class="color-modes">
                        <div class="color-mode active" style="background: #ff6b35" onclick="setColor('#ff6b35')"></div>
                        <div class="color-mode" style="background: #00d4ff" onclick="setColor('#00d4ff')"></div>
                        <div class="color-mode" style="background: #ff00aa" onclick="setColor('#ff00aa')"></div>
                        <div class="color-mode" style="background: #00ff88" onclick="setColor('#00ff88')"></div>
                        <div class="color-mode" style="background: linear-gradient(90deg, #ff6b35, #00d4ff)" onclick="setColor('gradient1')"></div>
                        <div class="color-mode" style="background: linear-gradient(90deg, #ff00aa, #ffd700)" onclick="setColor('gradient2')"></div>
                        <div class="color-mode" style="background: linear-gradient(90deg, #00ff88, #00d4ff)" onclick="setColor('gradient3')"></div>
                        <div class="color-mode" style="background: #fff" onclick="setColor('#ffffff')"></div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">Upload Content</div>
                    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                        <p>Drop image/video here<br>or click to browse</p>
                    </div>
                    <input type="file" id="fileInput" accept="image/*,video/*" onchange="handleUpload(event)">
                </div>
                
                <div class="section">
                    <div class="section-title">Display Statistics</div>
                    <div class="stats">
                        <div class="stat-row">
                            <span>Total Linear Feet</span>
                            <span class="stat-value" id="statLinear">6,360 ft</span>
                        </div>
                        <div class="stat-row">
                            <span>Panel Area (4ft H)</span>
                            <span class="stat-value" id="statArea">25,440 SF</span>
                        </div>
                        <div class="stat-row">
                            <span>Est. Pixels (16mm)</span>
                            <span class="stat-value" id="statPixels">11.6M</span>
                        </div>
                        <div class="stat-row">
                            <span>Visible from view</span>
                            <span class="stat-value" id="statVisible">~3,100 ft</span>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        // Photo data with panel mappings
        const views = [
            {
                src: 'before/hero-01-quarter-view.jpg',
                name: 'NW Quarter View',
                panels: [
                    { terrace: 2, points: [[0.08, 0.54], [0.92, 0.46], [0.92, 0.48], [0.08, 0.56]] },
                    { terrace: 3, points: [[0.12, 0.46], [0.88, 0.40], [0.88, 0.42], [0.12, 0.48]] },
                    { terrace: 4, points: [[0.18, 0.40], [0.82, 0.35], [0.82, 0.37], [0.18, 0.42]] },
                    { terrace: 5, points: [[0.24, 0.35], [0.76, 0.31], [0.76, 0.33], [0.24, 0.37]] },
                    { terrace: 6, points: [[0.32, 0.30], [0.68, 0.27], [0.68, 0.29], [0.32, 0.32]] },
                ]
            },
            {
                src: 'before/hero-02-frontal.jpg',
                name: 'North Front',
                panels: [
                    { terrace: 2, points: [[0.10, 0.62], [0.90, 0.62], [0.90, 0.64], [0.10, 0.64]] },
                    { terrace: 3, points: [[0.18, 0.52], [0.82, 0.52], [0.82, 0.54], [0.18, 0.54]] },
                    { terrace: 4, points: [[0.26, 0.44], [0.74, 0.44], [0.74, 0.46], [0.26, 0.46]] },
                    { terrace: 5, points: [[0.32, 0.38], [0.68, 0.38], [0.68, 0.40], [0.32, 0.40]] },
                    { terrace: 6, points: [[0.38, 0.33], [0.62, 0.33], [0.62, 0.35], [0.38, 0.35]] },
                ]
            },
            {
                src: 'before/hero-03-corner.jpg',
                name: 'NE Corner',
                panels: [
                    { terrace: 2, points: [[0.05, 0.58], [0.95, 0.52], [0.95, 0.54], [0.05, 0.60]] },
                    { terrace: 3, points: [[0.12, 0.50], [0.88, 0.45], [0.88, 0.47], [0.12, 0.52]] },
                    { terrace: 4, points: [[0.20, 0.43], [0.80, 0.39], [0.80, 0.41], [0.20, 0.45]] },
                ]
            },
            {
                src: 'before/hero-04-detail.jpg',
                name: 'Close-up',
                panels: [
                    { terrace: 3, points: [[0.02, 0.48], [0.48, 0.42], [0.48, 0.46], [0.02, 0.52]] },
                    { terrace: 3, points: [[0.52, 0.42], [0.98, 0.38], [0.98, 0.42], [0.52, 0.46]] },
                ]
            }
        ];
        
        let currentView = 0;
        let currentImage = null;
        let currentTime = 'dusk';
        let currentColor = '#ff6b35';
        let contentMode = 'solid';
        let activeTerrace = { 2: true, 3: true, 4: true, 5: true, 6: true };
        let animFrame = 0;
        let uploadedImage = null;
        
        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            render();
        }
        
        function loadView(index) {
            currentView = index;
            const img = new Image();
            img.onload = () => {
                currentImage = img;
                render();
            };
            img.src = views[index].src;
        }
        
        function setView(index) {
            currentView = index;
            document.querySelectorAll('.view-selector .view-btn').forEach((b, i) => {
                b.classList.toggle('active', i === index);
            });
            loadView(index);
        }
        
        function setTime(time) {
            currentTime = time;
            document.querySelectorAll('.time-controls .view-btn').forEach(b => {
                b.classList.toggle('active', b.textContent.toLowerCase() === time);
            });
            render();
        }
        
        function setColor(color) {
            currentColor = color;
            document.querySelectorAll('.color-mode').forEach(m => {
                m.classList.toggle('active', m.style.background === color || 
                    (color.includes('gradient') && m.style.background.includes('gradient')));
            });
            render();
        }
        
        function setContent(mode) {
            contentMode = mode;
            document.querySelectorAll('.content-thumb').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }
        
        function toggleTerrace(level) {
            activeTerrace[level] = !activeTerrace[level];
            document.querySelectorAll('.diagram-bar')[6 - level].classList.toggle('active');
            updateStats();
            render();
        }
        
        function render() {
            if (!currentImage) return;
            
            const cw = canvas.width / window.devicePixelRatio;
            const ch = canvas.height / window.devicePixelRatio;
            
            // Calculate image fit
            const imgAspect = currentImage.width / currentImage.height;
            const canvasAspect = cw / ch;
            
            let drawW, drawH, drawX, drawY;
            if (imgAspect > canvasAspect) {
                drawW = cw;
                drawH = cw / imgAspect;
                drawX = 0;
                drawY = (ch - drawH) / 2;
            } else {
                drawH = ch;
                drawW = ch * imgAspect;
                drawX = (cw - drawW) / 2;
                drawY = 0;
            }
            
            ctx.clearRect(0, 0, cw, ch);
            
            // Draw base image
            ctx.drawImage(currentImage, drawX, drawY, drawW, drawH);
            
            // Time overlay
            if (currentTime === 'dusk') {
                ctx.fillStyle = 'rgba(30, 15, 50, 0.35)';
                ctx.fillRect(0, 0, cw, ch);
            } else if (currentTime === 'night') {
                ctx.fillStyle = 'rgba(5, 5, 20, 0.65)';
                ctx.fillRect(0, 0, cw, ch);
            }
            
            // Draw panels
            views[currentView].panels.forEach(panel => {
                if (!activeTerrace[panel.terrace]) return;
                
                const points = panel.points.map(([px, py]) => ({
                    x: drawX + px * drawW,
                    y: drawY + py * drawH
                }));
                
                drawPanel(points);
            });
        }
        
        function drawPanel(points) {
            // Get panel color based on mode
            let fillColor = currentColor;
            let gradient = null;
            
            if (contentMode === 'gradient' || currentColor.includes('gradient')) {
                gradient = ctx.createLinearGradient(points[0].x, points[0].y, points[1].x, points[1].y);
                if (currentColor === 'gradient1') {
                    gradient.addColorStop(0, '#ff6b35');
                    gradient.addColorStop(1, '#00d4ff');
                } else if (currentColor === 'gradient2') {
                    gradient.addColorStop(0, '#ff00aa');
                    gradient.addColorStop(1, '#ffd700');
                } else if (currentColor === 'gradient3') {
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#00d4ff');
                } else {
                    gradient.addColorStop(0, '#ff6b35');
                    gradient.addColorStop(1, '#00d4ff');
                }
                fillColor = gradient;
            }
            
            // Glow layers
            for (let i = 4; i >= 0; i--) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.closePath();
                
                ctx.shadowColor = typeof fillColor === 'string' ? fillColor : '#ff6b35';
                ctx.shadowBlur = 15 * (i + 1);
                ctx.fillStyle = gradient || hexToRgba(currentColor, 0.15 * (5 - i));
                ctx.fill();
            }
            
            // Core panel
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            points.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath();
            
            if (contentMode === 'image' && uploadedImage) {
                ctx.save();
                ctx.clip();
                // Map uploaded image to panel bounds
                const minX = Math.min(...points.map(p => p.x));
                const maxX = Math.max(...points.map(p => p.x));
                const minY = Math.min(...points.map(p => p.y));
                const maxY = Math.max(...points.map(p => p.y));
                ctx.drawImage(uploadedImage, minX, minY, maxX - minX, maxY - minY);
                ctx.restore();
            } else {
                ctx.fillStyle = fillColor;
                ctx.fill();
            }
        }
        
        function hexToRgba(hex, alpha) {
            if (hex.includes('gradient')) return `rgba(255, 107, 53, ${alpha})`;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        function handleUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    setContent('image');
                    render();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function updateStats() {
            // Calculate based on active terraces
            const terraceData = {
                2: { width: 900, depth: 280 },
                3: { width: 780, depth: 223 },
                4: { width: 600, depth: 200 },
                5: { width: 500, depth: 140 },
                6: { width: 400, depth: 100 },
            };
            
            let totalLinear = 0;
            Object.keys(activeTerrace).forEach(level => {
                if (activeTerrace[level]) {
                    const t = terraceData[level];
                    totalLinear += t.width * 2 + t.depth * 2;
                }
            });
            
            const panelHeight = 4;
            const totalArea = totalLinear * panelHeight;
            const pixelPitch = 16;
            const totalPixels = Math.round((totalLinear * 12 * 25.4 / pixelPitch) * (panelHeight * 12 * 25.4 / pixelPitch));
            
            document.getElementById('statLinear').textContent = totalLinear.toLocaleString() + ' ft';
            document.getElementById('statArea').textContent = totalArea.toLocaleString() + ' SF';
            document.getElementById('statPixels').textContent = (totalPixels / 1000000).toFixed(1) + 'M';
        }
        
        // Animation loop for animated content modes
        function animate() {
            animFrame++;
            if (contentMode === 'wave' || contentMode === 'pulse' || contentMode === 'chase') {
                render();
            }
            requestAnimationFrame(animate);
        }
        
        // Initialize
        window.addEventListener('resize', resize);
        resize();
        loadView(0);
        updateStats();
        animate();
    </script>
</body>
</html>
