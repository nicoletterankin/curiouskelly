<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziggurat Asset Generator — One-Click Exports</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            padding: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #06b6d4, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
        }
        
        .status-bar {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        .status-dot.loading { background: #f59e0b; }
        .status-dot.error { background: #ef4444; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text { flex: 1; font-size: 14px; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .preview-section {
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .preview-title {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4032 / 2217;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .preview-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .preview-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.8);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .control-group {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
        }
        .control-group h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group h2 .icon { font-size: 20px; }
        
        .variant-buttons {
            display: grid;
            gap: 10px;
        }
        .variant-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            text-align: left;
        }
        .variant-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .variant-btn.active { border-color: #3b82f6; background: rgba(59,130,246,0.15); }
        .variant-btn .color-preview {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .variant-btn .label { font-weight: 600; font-size: 14px; }
        .variant-btn .desc { font-size: 12px; color: rgba(255,255,255,0.5); }
        
        .export-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .export-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .export-btn.primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        .export-btn.primary:hover { transform: scale(1.02); }
        .export-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .export-btn.secondary:hover { background: rgba(255,255,255,0.15); }
        .export-btn.mega {
            background: linear-gradient(135deg, #22c55e, #06b6d4);
            color: white;
            padding: 20px;
            font-size: 17px;
        }
        .export-btn.mega:hover { transform: scale(1.02); }
        
        .resolution-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .download-log {
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            line-height: 1.5;
        }
        .log-entry { color: rgba(255,255,255,0.7); }
        .log-entry.success { color: #22c55e; }
        .log-entry.error { color: #ef4444; }
        
        .compare-slider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: white;
            cursor: ew-resize;
            z-index: 10;
        }
        .compare-slider::after {
            content: '⟷';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #000;
            padding: 6px;
            border-radius: 50%;
            font-size: 14px;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Ziggurat Asset Generator</h1>
        <p>One-click exports for stakeholder pitch materials</p>
    </div>
    
    <div class="status-bar">
        <div class="status-dot loading" id="statusDot"></div>
        <div class="status-text" id="statusText">Loading source image...</div>
    </div>
    
    <div class="main-grid">
        <div class="preview-section">
            <div class="preview-title">Preview</div>
            <div class="preview-container" id="previewContainer">
                <canvas id="canvasBefore"></canvas>
                <canvas id="canvasAfter"></canvas>
                <div class="compare-slider" id="slider"></div>
                <div class="preview-label" id="previewLabel">Before / After</div>
            </div>
        </div>
        
        <div class="controls">
            <!-- Variant Selection -->
            <div class="control-group">
                <h2><span class="icon">🎨</span> Visualization Style</h2>
                <div class="variant-buttons">
                    <button class="variant-btn active" onclick="setVariant('night')">
                        <div class="color-preview" style="background: linear-gradient(135deg, #0a0a1a, #1a1a3a);"></div>
                        <div>
                            <div class="label">Night Rainbow</div>
                            <div class="desc">Dramatic night with full spectrum LEDs</div>
                        </div>
                    </button>
                    <button class="variant-btn" onclick="setVariant('dusk')">
                        <div class="color-preview" style="background: linear-gradient(135deg, #2d1f4a, #4a2848);"></div>
                        <div>
                            <div class="label">Cinematic Dusk</div>
                            <div class="desc">Golden hour with warm LED glow</div>
                        </div>
                    </button>
                    <button class="variant-btn" onclick="setVariant('day')">
                        <div class="color-preview" style="background: linear-gradient(135deg, #87ceeb, #e8f4fc);"></div>
                        <div>
                            <div class="label">Daylight Preview</div>
                            <div class="desc">Subtle LED visibility in daylight</div>
                        </div>
                    </button>
                </div>
            </div>
            
            <!-- Single Export -->
            <div class="control-group">
                <h2><span class="icon">📥</span> Export Current View</h2>
                <div class="resolution-grid">
                    <button class="export-btn secondary" onclick="exportSingle(1920, 1080)">1080p</button>
                    <button class="export-btn secondary" onclick="exportSingle(2560, 1440)">1440p</button>
                    <button class="export-btn secondary" onclick="exportSingle(3840, 2160)">4K</button>
                    <button class="export-btn secondary" onclick="exportSingle(4032, 2217)">Full Res</button>
                </div>
            </div>
            
            <!-- Export All -->
            <div class="control-group">
                <h2><span class="icon">🚀</span> Batch Export</h2>
                <div class="export-buttons">
                    <button class="export-btn mega" onclick="exportAll()">
                        ⚡ Download All Assets
                    </button>
                    <div style="font-size: 12px; color: rgba(255,255,255,0.5); text-align: center;">
                        Generates: Before + 3 variants × 4 resolutions = 13 files
                    </div>
                </div>
            </div>
            
            <!-- Log -->
            <div class="control-group">
                <h2><span class="icon">📋</span> Download Log</h2>
                <div class="download-log" id="log">
                    <div class="log-entry">Ready to generate assets...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration - CORRECTED coordinates traced from actual aerial.jpg
        // Building spans roughly x: 0.21-0.68, y: 0.34-0.50
        // VERIFIED on building - Crown at Y~0.532, Base at Y~0.697
        const layers = [
            { level: 1, left: [0.166, 0.697], right: [0.707, 0.697], height: 0.018, color: '#ef4444' },
            { level: 2, left: [0.203, 0.665], right: [0.668, 0.665], height: 0.016, color: '#f97316' },
            { level: 3, left: [0.241, 0.636], right: [0.630, 0.636], height: 0.014, color: '#eab308' },
            { level: 4, left: [0.275, 0.607], right: [0.593, 0.607], height: 0.012, color: '#22c55e' },
            { level: 5, left: [0.310, 0.580], right: [0.558, 0.580], height: 0.010, color: '#06b6d4' },
            { level: 6, left: [0.342, 0.555], right: [0.526, 0.555], height: 0.009, color: '#3b82f6' },
            { level: 7, left: [0.372, 0.532], right: [0.496, 0.532], height: 0.008, color: '#8b5cf6' },
        ];
        
        const variants = {
            night: {
                name: 'Night Rainbow',
                overlay: { mode: 'multiply', color: 'rgba(8, 12, 28, 0.88)' },
                overlay2: { mode: 'overlay', color: 'rgba(15, 25, 55, 0.4)' },
                ledIntensity: 1.0,
                skyGlow: true,
                fog: 0.35
            },
            dusk: {
                name: 'Cinematic Dusk',
                overlay: { mode: 'multiply', color: 'rgba(45, 31, 74, 0.65)' },
                overlay2: { mode: 'overlay', color: 'rgba(74, 40, 72, 0.35)' },
                ledIntensity: 0.85,
                skyGlow: true,
                fog: 0.2
            },
            day: {
                name: 'Daylight Preview',
                overlay: null,
                overlay2: null,
                ledIntensity: 0.4,
                skyGlow: false,
                fog: 0
            }
        };
        
        let currentVariant = 'night';
        let sourceImage = null;
        let sliderPos = 50;
        
        const canvasBefore = document.getElementById('canvasBefore');
        const canvasAfter = document.getElementById('canvasAfter');
        const ctxBefore = canvasBefore.getContext('2d');
        const ctxAfter = canvasAfter.getContext('2d');
        const slider = document.getElementById('slider');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const log = document.getElementById('log');
        
        // Load source image
        sourceImage = new Image();
        sourceImage.crossOrigin = 'anonymous';
        sourceImage.onload = () => {
            canvasBefore.width = canvasAfter.width = sourceImage.width;
            canvasBefore.height = canvasAfter.height = sourceImage.height;
            statusDot.classList.remove('loading');
            statusText.textContent = `✓ Source loaded: ${sourceImage.width}×${sourceImage.height} — Ready to generate`;
            logEntry(`Source image loaded: aerial.jpg (${sourceImage.width}×${sourceImage.height})`, 'success');
            render();
        };
        sourceImage.onerror = () => {
            statusDot.classList.remove('loading');
            statusDot.classList.add('error');
            statusText.textContent = '⚠ Could not load aerial.jpg';
            logEntry('Failed to load aerial.jpg', 'error');
        };
        sourceImage.src = 'aerial.jpg';
        
        // Slider interaction
        let isDragging = false;
        slider.addEventListener('mousedown', () => isDragging = true);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = document.getElementById('previewContainer').getBoundingClientRect();
            sliderPos = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
            updateSlider();
        });
        
        function updateSlider() {
            slider.style.left = sliderPos + '%';
            canvasAfter.style.clipPath = `inset(0 0 0 ${sliderPos}%)`;
        }
        
        function setVariant(v) {
            currentVariant = v;
            document.querySelectorAll('.variant-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            render();
            logEntry(`Switched to: ${variants[v].name}`);
        }
        
        function render() {
            if (!sourceImage.complete) return;
            renderBefore();
            renderAfter();
            updateSlider();
        }
        
        function renderBefore() {
            ctxBefore.drawImage(sourceImage, 0, 0);
        }
        
        function renderAfter() {
            const w = canvasAfter.width;
            const h = canvasAfter.height;
            const v = variants[currentVariant];
            
            // Base image
            ctxAfter.drawImage(sourceImage, 0, 0);
            
            // Color grading
            if (v.overlay) {
                ctxAfter.save();
                ctxAfter.globalCompositeOperation = v.overlay.mode;
                ctxAfter.fillStyle = v.overlay.color;
                ctxAfter.fillRect(0, 0, w, h);
                ctxAfter.restore();
            }
            if (v.overlay2) {
                ctxAfter.save();
                ctxAfter.globalCompositeOperation = v.overlay2.mode;
                ctxAfter.fillStyle = v.overlay2.color;
                ctxAfter.fillRect(0, 0, w, h);
                ctxAfter.restore();
            }
            
            // LED layers
            ctxAfter.save();
            ctxAfter.globalCompositeOperation = 'screen';
            layers.forEach(layer => drawLED(ctxAfter, w, h, layer, v.ledIntensity));
            ctxAfter.restore();
            
            // Sky glow
            if (v.skyGlow) applySkyGlow(ctxAfter, w, h);
            
            // Fog
            if (v.fog > 0) applyFog(ctxAfter, w, h, v.fog);
            
            // Vignette
            applyVignette(ctxAfter, w, h);
        }
        
        function drawLED(ctx, w, h, layer, intensity) {
            const x1 = layer.left[0] * w;
            const y1 = layer.left[1] * h;
            const x2 = layer.right[0] * w;
            const y2 = layer.right[1] * h;
            const pH = layer.height * h;
            const rgb = hexToRgb(layer.color);
            
            // Multi-pass bloom
            for (let pass = 0; pass < 6; pass++) {
                ctx.shadowColor = layer.color;
                ctx.shadowBlur = (80 - pass * 12) * intensity;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineTo(x2, y2 + pH);
                ctx.lineTo(x1, y1 + pH);
                ctx.closePath();
                ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.02 * intensity})`;
                ctx.fill();
            }
            
            // Core gradient
            ctx.shadowBlur = 0;
            const grad = ctx.createLinearGradient(x1, y1, x1, y1 + pH);
            grad.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.75 * intensity})`);
            grad.addColorStop(0.35, `rgba(${Math.min(255, rgb.r + 60)}, ${Math.min(255, rgb.g + 60)}, ${Math.min(255, rgb.b + 60)}, ${0.95 * intensity})`);
            grad.addColorStop(0.5, `rgba(255, 255, 255, ${0.9 * intensity})`);
            grad.addColorStop(0.65, `rgba(${Math.min(255, rgb.r + 60)}, ${Math.min(255, rgb.g + 60)}, ${Math.min(255, rgb.b + 60)}, ${0.95 * intensity})`);
            grad.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.7 * intensity})`);
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x2, y2 + pH);
            ctx.lineTo(x1, y1 + pH);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
            
            // White center
            ctx.beginPath();
            ctx.moveTo(x1, y1 + pH * 0.5);
            ctx.lineTo(x2, y2 + pH * 0.5);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.7 * intensity})`;
            ctx.lineWidth = pH * 0.25;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            // Spill light
            const spillH = pH * 4;
            const spillGrad = ctx.createLinearGradient(x1, y1 + pH, x1, y1 + pH + spillH);
            spillGrad.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.18 * intensity})`);
            spillGrad.addColorStop(0.15, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.08 * intensity})`);
            spillGrad.addColorStop(0.4, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.02 * intensity})`);
            spillGrad.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.beginPath();
            ctx.moveTo(x1 - pH * 1.5, y1 + pH);
            ctx.lineTo(x2 + pH * 1.5, y2 + pH);
            ctx.lineTo(x2 + pH * 2.5, y2 + pH + spillH);
            ctx.lineTo(x1 - pH * 2.5, y1 + pH + spillH);
            ctx.closePath();
            ctx.fillStyle = spillGrad;
            ctx.fill();
        }
        
        function applySkyGlow(ctx, w, h) {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const glowColors = [
                { color: '#8b5cf6', x: 0.455, y: 0.35 },
                { color: '#3b82f6', x: 0.46, y: 0.38 },
                { color: '#06b6d4', x: 0.46, y: 0.42 },
            ];
            glowColors.forEach(g => {
                const rgb = hexToRgb(g.color);
                const glow = ctx.createRadialGradient(w * g.x, h * g.y, 0, w * g.x, h * 0.15, h * 0.55);
                glow.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.035)`);
                glow.addColorStop(0.4, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.015)`);
                glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, w, h * 0.55);
            });
            ctx.restore();
        }
        
        function applyFog(ctx, w, h, amount) {
            const fog = ctx.createLinearGradient(0, h * 0.7, 0, h);
            fog.addColorStop(0, 'rgba(0,0,0,0)');
            fog.addColorStop(0.5, `rgba(20, 30, 50, ${amount * 0.43})`);
            fog.addColorStop(1, `rgba(20, 30, 50, ${amount})`);
            ctx.fillStyle = fog;
            ctx.fillRect(0, 0, w, h);
        }
        
        function applyVignette(ctx, w, h) {
            const vignette = ctx.createRadialGradient(w * 0.5, h * 0.42, h * 0.3, w * 0.5, h * 0.42, h * 1.2);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(0.5, 'rgba(0,0,0,0.05)');
            vignette.addColorStop(0.75, 'rgba(0,0,0,0.25)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, w, h);
        }
        
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }
        
        function logEntry(msg, type = '') {
            const entry = document.createElement('div');
            entry.className = 'log-entry' + (type ? ' ' + type : '');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        function exportSingle(targetW, targetH) {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = targetW;
            exportCanvas.height = targetH;
            const exportCtx = exportCanvas.getContext('2d');
            
            // Render at target size
            const scale = targetW / sourceImage.width;
            exportCtx.save();
            exportCtx.scale(scale, scale);
            renderToContext(exportCtx, sourceImage.width, sourceImage.height);
            exportCtx.restore();
            
            const filename = `ziggurat-${currentVariant}-${targetW}x${targetH}.png`;
            downloadCanvas(exportCanvas, filename);
            logEntry(`Exported: ${filename}`, 'success');
        }
        
        function renderToContext(ctx, w, h) {
            const v = variants[currentVariant];
            
            ctx.drawImage(sourceImage, 0, 0);
            
            if (v.overlay) {
                ctx.save();
                ctx.globalCompositeOperation = v.overlay.mode;
                ctx.fillStyle = v.overlay.color;
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }
            if (v.overlay2) {
                ctx.save();
                ctx.globalCompositeOperation = v.overlay2.mode;
                ctx.fillStyle = v.overlay2.color;
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }
            
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            layers.forEach(layer => drawLED(ctx, w, h, layer, v.ledIntensity));
            ctx.restore();
            
            if (v.skyGlow) applySkyGlow(ctx, w, h);
            if (v.fog > 0) applyFog(ctx, w, h, v.fog);
            applyVignette(ctx, w, h);
        }
        
        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        async function exportAll() {
            logEntry('Starting batch export...', 'success');
            statusText.textContent = 'Generating assets...';
            
            const resolutions = [
                [1920, 1080, '1080p'],
                [2560, 1440, '1440p'],
                [3840, 2160, '4k'],
                [4032, 2217, 'full']
            ];
            
            // Export before image
            await delay(100);
            downloadCanvas(canvasBefore, 'ziggurat-before-original.png');
            logEntry('Exported: ziggurat-before-original.png', 'success');
            
            // Export each variant at each resolution
            for (const [variantKey, variant] of Object.entries(variants)) {
                currentVariant = variantKey;
                render();
                await delay(100);
                
                for (const [w, h, label] of resolutions) {
                    const exportCanvas = document.createElement('canvas');
                    exportCanvas.width = w;
                    exportCanvas.height = h;
                    const exportCtx = exportCanvas.getContext('2d');
                    
                    const scale = w / sourceImage.width;
                    exportCtx.save();
                    exportCtx.scale(scale, scale);
                    renderToContext(exportCtx, sourceImage.width, sourceImage.height);
                    exportCtx.restore();
                    
                    const filename = `ziggurat-${variantKey}-${label}.png`;
                    downloadCanvas(exportCanvas, filename);
                    logEntry(`Exported: ${filename}`, 'success');
                    await delay(150); // Small delay between downloads
                }
            }
            
            logEntry('Batch export complete! 13 files downloaded.', 'success');
            statusText.textContent = '✓ Batch export complete — 13 assets downloaded';
        }
        
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
