<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="768" viewBox="0 0 1344 768">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a0a0b"/>
<stop offset="1" stop-color="#101013"/>
</linearGradient>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
</filter>
</defs>
<rect x="0" y="0" width="1344" height="768" fill="url(#bg)"/>
<text x="48" y="86" fill="#f4f4f5" font-size="34" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Seed to Sprout</text>
<text x="48" y="120" fill="#a1a1aa" font-size="18" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">The Life Cycle Begins</text>

    <path d="M 438 358 H 448" stroke="#3b82f6" stroke-width="4" opacity="0.65"/>
    <path d="M 448 358 l -10 -10 M 448 358 l -10 10" stroke="#3b82f6" stroke-width="4" opacity="0.65" stroke-linecap="round"/>

    <path d="M 848 358 H 858" stroke="#3b82f6" stroke-width="4" opacity="0.65"/>
    <path d="M 858 358 l -10 -10 M 858 358 l -10 10" stroke="#3b82f6" stroke-width="4" opacity="0.65" stroke-linecap="round"/>
  
      <g filter="url(#softShadow)">
        <rect x="48" y="248" width="380" height="220" rx="18" fill="#18181b" stroke="#27272a"/>
      </g>
      <g>
        <circle cx="82" cy="288" r="10" fill="#3b82f6"/>
        <text x="106" y="294" fill="#f4f4f5" font-size="22" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Dormancy</text>
        <text x="82" y="334" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">The seed rests, a blueprint paused, waiting for the signal to awaken.</text>
        <path d="M 82 368 h 312" stroke="#27272a" stroke-width="2"/>
        <path d="M 82 408 C 138 378, 238 438, 368 404" stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.75" stroke-linecap="round"/>
      </g>
      <g filter="url(#softShadow)">
        <rect x="458" y="248" width="380" height="220" rx="18" fill="#18181b" stroke="#27272a"/>
      </g>
      <g>
        <circle cx="492" cy="288" r="10" fill="#22c55e"/>
        <text x="516" y="294" fill="#f4f4f5" font-size="22" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Germination</text>
        <text x="492" y="334" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Water softens the seed coat; the embryo swells, roots emerge, anchoring life.</text>
        <path d="M 492 368 h 312" stroke="#27272a" stroke-width="2"/>
        <path d="M 492 408 C 548 378, 648 438, 778 404" stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.75" stroke-linecap="round"/>
      </g>
      <g filter="url(#softShadow)">
        <rect x="868" y="248" width="380" height="220" rx="18" fill="#18181b" stroke="#27272a"/>
      </g>
      <g>
        <circle cx="902" cy="288" r="10" fill="#3b82f6"/>
        <text x="926" y="294" fill="#f4f4f5" font-size="22" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Emergence</text>
        <text x="902" y="334" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">The shoot pushes upward, reaching for light, the cotyledons unfurl, feeding the seedling.</text>
        <path d="M 902 368 h 312" stroke="#27272a" stroke-width="2"/>
        <path d="M 902 408 C 958 378, 1058 438, 1188 404" stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.75" stroke-linecap="round"/>
      </g></svg>
