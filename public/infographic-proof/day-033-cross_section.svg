<g filter="url(#softShadow)">
<rect x="780" y="168" width="516" height="520" rx="18" fill="#18181b" stroke="#27272a"/>
</g>

      <g>
        
          <g opacity="0.95">
            <circle cx="806" cy="196" r="8" fill="#3b82f6"/>
            <ellipse cx="806" cy="196" rx="18" ry="8" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
            <ellipse cx="806" cy="196" rx="8" ry="18" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.55"/>
          </g>
        <text x="840" y="190" fill="#f4f4f5" font-size="20" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Mass Matters</text>
        <text x="840" y="218" fill="#a1a1aa" font-size="15" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">The more massive an object, the stronger its gravitational pull.</text>
      </g>

      <g>
        <path d="M 784 288 C 796 276, 816 300, 828 288" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
        <text x="840" y="282" fill="#f4f4f5" font-size="20" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Distance Factor</text>
        <text x="840" y="310" fill="#a1a1aa" font-size="15" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Gravity weakens with increased distance; an inverse square law.</text>
      </g>

      <g>
        <path d="M 788 380 H 822 M 822 380 l -8 -8 M 822 380 l -8 8" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="840" y="374" fill="#f4f4f5" font-size="20" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Universal Force</text>
        <text x="840" y="402" fill="#a1a1aa" font-size="15" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Everything with mass attracts everything else with mass across the universe.</text>
      </g>

      <g>
        <path d="M 806 472 C 822 454, 844 460, 848 478 C 850 494, 828 504, 814 498 C 798 490, 792 480, 806 472 Z" fill="#22c55e" opacity="0.9"/>
        <text x="840" y="466" fill="#f4f4f5" font-size="20" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Earth&#39;s Gravity</text>
        <text x="840" y="494" fill="#a1a1aa" font-size="15" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Keeps us grounded, orbits planets, and dictates tides, influencing all.</text>
      </g><g>
