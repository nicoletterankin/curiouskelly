      <circle cx="420" cy="420" r="160" fill="#fbbf24" opacity="0.22"/>
      <circle cx="420" cy="420" r="80" fill="#fde68a" opacity="0.85"/>
      <circle cx="420" cy="420" r="80" fill="#ffffff" opacity="0.20"/>
      <path d="M 190 420 A 230 230 0 0 1 650 420" stroke="#60a5fa" stroke-width="3" opacity="0.55" fill="none"/>
      <path d="M 260 434 A 160 160 0 0 0 580 434" stroke="#3b82f6" stroke-width="3" opacity="0.45" fill="none"/>
