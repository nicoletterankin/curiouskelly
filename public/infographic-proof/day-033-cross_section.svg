<rect x="0" y="0" width="1344" height="768" fill="url(#bg)"/>
<text x="48" y="86" fill="#f4f4f5" font-size="34" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Gravity Explained</text>
<text x="48" y="120" fill="#a1a1aa" font-size="18" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Attraction Between Masses</text>
<g filter="url(#softShadow)">
<rect x="48" y="168" width="660" height="552" rx="18" fill="#18181b" stroke="#27272a"/>
</g>
<g>
      <circle cx="420" cy="420" r="230" fill="#111827" stroke="#27272a" stroke-width="2"/>
