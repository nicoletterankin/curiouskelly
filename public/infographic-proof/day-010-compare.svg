<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="768" viewBox="0 0 1344 768">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a0a0b"/>
<stop offset="1" stop-color="#101013"/>
</linearGradient>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
</filter>
</defs>
<rect x="0" y="0" width="1344" height="768" fill="url(#bg)"/>
<text x="48" y="86" fill="#f4f4f5" font-size="34" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Active Listening</text>
<text x="48" y="120" fill="#a1a1aa" font-size="18" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Focus on the speaker, not your response.</text>
<g filter="url(#softShadow)"><rect x="48" y="168" width="612" height="552" rx="18" fill="#18181b" stroke="#27272a"/></g>
<g filter="url(#softShadow)"><rect x="684" y="168" width="612" height="552" rx="18" fill="#18181b" stroke="#27272a"/></g>
<text x="72" y="216" fill="#f4f4f5" font-size="22" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Planning to Speak</text>
<text x="708" y="216" fill="#f4f4f5" font-size="22" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Truly Listening</text>

        <g>
          <circle cx="76" cy="258" r="5" fill="#fbbf24"/>
          <text x="92" y="264" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Thinking ahead to your reply.</text>
        </g>

        <g>
          <circle cx="76" cy="298" r="5" fill="#fbbf24"/>
          <text x="92" y="304" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Formulating arguments while they talk.</text>
        </g>

        <g>
          <circle cx="76" cy="338" r="5" fill="#fbbf24"/>
          <text x="92" y="344" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Interrupting to make your point.</text>
        </g>
        <g>
          <circle cx="712" cy="258" r="5" fill="#fbbf24"/>
          <text x="728" y="264" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Focusing solely on the speaker.</text>
        </g>

        <g>
          <circle cx="712" cy="298" r="5" fill="#fbbf24"/>
          <text x="728" y="304" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Understanding their perspective.</text>
        </g>

        <g>
          <circle cx="712" cy="338" r="5" fill="#fbbf24"/>
          <text x="728" y="344" fill="#a1a1aa" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI">Responding thoughtfully after they finish.</text>
        </g></svg>
