<!DOCTYPE html>
<html>
<head>
    <title>Supabase Schema Inspector</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
        .stat { font-size: 20px; margin: 10px 0; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warn { color: #ff0; }
        table { border-collapse: collapse; margin: 20px 0; width: 100%; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; font-size: 12px; }
        th { background: #333; }
        pre { background: #000; padding: 10px; overflow-x: auto; font-size: 11px; }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>🔍 Supabase Schema Inspector - ZERO TRUST MODE</h1>
    <div id="output">Loading...</div>
    
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        
        const supabase = createClient(
            'https://tvjalxxsyryjphkforjv.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2amFseHhzeXJ5anBoa2Zvcmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NjM5MTksImV4cCI6MjA3OTEzOTkxOX0.VFrBs9sWkIgfFNpavQHxo0vSy6tkICpSbuj_TWvGHxI'
        );
        
        const output = document.getElementById('output');
        
        async function inspectTable(tableName) {
            let html = `<h2>📋 ${tableName}</h2>`;
            
            try {
                const { data, error } = await supabase
                    .from(tableName)
                    .select('*')
                    .limit(3);
                
                if (error) {
                    html += `<p class="error">❌ Error: ${error.message}</p>`;
                    return html;
                }
                
                // Count
                const { count } = await supabase.from(tableName).select('*', { count: 'exact', head: true });
                html += `<div class="stat">Rows: <strong>${count || data.length}</strong></div>`;
                
                if (data.length === 0) {
                    html += `<p class="warn">⚠️ Table is empty</p>`;
                    return html;
                }
                
                // Show ACTUAL column names
                const columns = Object.keys(data[0]);
                html += `<div class="stat">Columns (${columns.length}): <code>${columns.join(', ')}</code></div>`;
                
                // Show first row as JSON
                html += `<h3>First row (raw JSON):</h3>`;
                html += `<pre>${JSON.stringify(data[0], null, 2)}</pre>`;
                
                // Show first 3 rows as table
                html += `<h3>First 3 rows:</h3>`;
                html += '<table><tr>';
                columns.forEach(c => html += `<th>${c}</th>`);
                html += '</tr>';
                data.forEach(row => {
                    html += '<tr>';
                    columns.forEach(c => {
                        let val = row[c];
                        if (typeof val === 'object') val = JSON.stringify(val).substring(0, 50) + '...';
                        if (typeof val === 'string' && val.length > 50) val = val.substring(0, 50) + '...';
                        html += `<td>${val ?? 'NULL'}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</table>';
                
            } catch (e) {
                html += `<p class="error">❌ Exception: ${e.message}</p>`;
            }
            
            return html;
        }
        
        async function check() {
            let html = '<p>Inspecting actual Supabase schema...</p>';
            
            // Inspect all relevant tables
            html += await inspectTable('core_lessons');
            html += await inspectTable('lesson_atoms');
            html += await inspectTable('lesson_shards');
            html += await inspectTable('lessons');
            
            output.innerHTML = html;
        }
        
        check();
    </script>
</body>
</html>
