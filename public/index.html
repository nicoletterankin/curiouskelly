<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- FAST REDIRECT: Returning users go straight to learn.html -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('kelly-started') || localStorage.getItem('kellyOnboarded');
          var h = localStorage.getItem('kellyState') || localStorage.getItem('kelly_progress');
          if (s || h) { window.location.replace('/learn.html'); }
        } catch(e) {}
      })();
    </script>

    <title>Curious Kelly - Learn Something New Every Day</title>
    <meta name="description" content="Meet Kelly, your AI teacher. One lesson a day, 365 topics. Ages 2 to 102. Today's lesson is always yours.">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.curiouskelly.com/">
    <meta property="og:title" content="Curious Kelly - Learn Something New Every Day">
    <meta property="og:description" content="Meet Kelly, your AI teacher. One lesson a day, 365 topics, ages 2-102.">
    <meta property="og:image" content="https://www.curiouskelly.com/images/kelly-og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Curious Kelly - Learn Something New Every Day">
    <meta name="twitter:description" content="Meet Kelly, your AI teacher. One lesson a day, 365 topics.">
    <meta name="twitter:image" content="https://www.curiouskelly.com/images/kelly-og-image.png">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #0a0a0b;
            --surface: #111113;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #a78bfa;
            --accent-glow: rgba(167, 139, 250, 0.15);
        }
        
        html, body { 
            height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        
        .kelly-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 2rem;
            box-shadow: 0 0 60px var(--accent-glow);
            border: 3px solid rgba(167, 139, 250, 0.3);
        }
        
        .logo {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }
        
        .logo .sparkle { color: var(--accent); }
        
        .tagline {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 400px;
        }
        
        .cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2.5rem;
            background: var(--accent);
            color: #0a0a0b;
            font-weight: 600;
            font-size: 1.125rem;
            border-radius: 999px;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 24px var(--accent-glow);
        }
        
        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--accent-glow);
        }
        
        .cta:active { transform: translateY(0); }
        
        .stats {
            display: flex;
            gap: 2rem;
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            display: block;
        }
        
        .footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .footer a {
            color: inherit;
            text-decoration: none;
        }
        
        .footer a:hover { color: var(--text); }
        
        @media (max-width: 480px) {
            .kelly-avatar { width: 140px; height: 140px; }
            .logo { font-size: 1.5rem; }
            .tagline { font-size: 1rem; }
            .stats { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img 
            src="/images/brand/kelly-avatar-512.png" 
            alt="Kelly" 
            class="kelly-avatar"
            onerror="this.src='/icons/icon-192.png'"
        >
        
        <h1 class="logo">
            <span class="sparkle">✨</span>
            Curious Kelly
        </h1>
        
        <p class="tagline">
            Your AI teacher. One lesson a day, 365 topics.<br>
            Ages 2 to 102. Today's lesson is always yours.
        </p>
        
        <a href="/learn.html" class="cta" id="start-btn">
            Start Today's Lesson →
        </a>
        
        <div class="stats">
            <div>
                <span class="stat-value">365</span>
                lessons
            </div>
            <div>
                <span class="stat-value">365</span>
                topics
            </div>
            <div>
                <span class="stat-value">2–102</span>
                ages
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <a href="mailto:hello@curiouskelly.com">hello@curiouskelly.com</a>
        &nbsp;·&nbsp;
        Lesson of the Day, PBC
    </footer>
    
    <script>
        // Track that user clicked to start
        document.getElementById('start-btn').addEventListener('click', function() {
            try {
                localStorage.setItem('kelly-started', 'true');
            } catch(e) {}
        });
    </script>
</body>
</html>
