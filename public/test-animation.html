<!DOCTYPE html>
<html>
<head>
  <title>Kelly Animation Test</title>
  <style>
    body { background: #1a1a2e; color: white; font-family: system-ui; padding: 20px; }
    .kelly-container { width: 400px; height: 500px; margin: 20px auto; position: relative; }
    .kelly-face { width: 100%; border-radius: 12px; }
    .controls { text-align: center; margin: 20px; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 5px; }
    .log { background: #000; padding: 10px; margin-top: 20px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
    .success { background: #1b4332; }
    .error { background: #5c1a1a; }
    .info { background: #1a3a5c; }
  </style>
</head>
<body>
  <h1>🧪 Kelly Animation Test</h1>
  
  <div class="status info" id="status">Ready to test</div>
  
  <div class="kelly-container">
    <img id="kelly-face" class="kelly-face" src="/images/kelly-hero-4k.png" alt="Kelly">
  </div>
  
  <div class="controls">
    <button onclick="loadMotionData()">1. Load Motion Data</button>
    <button onclick="playAudio()">2. Play Audio</button>
    <button onclick="startAnimation()">3. Animate Kelly</button>
    <button onclick="runFullTest()">🚀 Run Full Test</button>
  </div>
  
  <div class="log" id="log"></div>
  
  <audio id="audio" preload="auto"></audio>

  <script>
    let motionData = null;
    let audioElement = document.getElementById('audio');
    let kellyFace = document.getElementById('kelly-face');
    
    function log(msg, type = 'info') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(`[AnimTest] ${msg}`);
    }
    
    function setStatus(msg, type = 'info') {
      const status = document.getElementById('status');
      status.textContent = msg;
      status.className = `status ${type}`;
    }
    
    async function loadMotionData() {
      setStatus('Loading motion data...', 'info');
      log('Fetching motion JSON...');
      
      // Try to load the first available motion file
      const testFiles = [
        '/kelly-motion/explorer_adult_hook_unity.json',
        '/kelly-motion/scientist_adult_q1_unity.json',
        '/kelly-motion/architect_adult_q2_unity.json'
      ];
      
      for (const file of testFiles) {
        try {
          log(`Trying: ${file}`);
          const response = await fetch(file);
          if (response.ok) {
            motionData = await response.json();
            log(`✅ Loaded: ${file}`, 'success');
            log(`Keys: ${Object.keys(motionData).join(', ')}`);
            log(`Duration: ${motionData.duration || 'unknown'}s`);
            log(`Visemes: ${motionData.visemes?.length || 0}`);
            log(`Expressions: ${motionData.expressions?.length || 0}`);
            setStatus('Motion data loaded!', 'success');
            return true;
          }
        } catch (e) {
          log(`❌ Failed: ${file} - ${e.message}`, 'error');
        }
      }
      
      setStatus('No motion files found', 'error');
      log('Listing available files...', 'info');
      
      // Try to list what's actually in the folder
      try {
        const dirResponse = await fetch('/kelly-motion/');
        log(`Directory response: ${dirResponse.status}`);
      } catch (e) {
        log('Cannot list directory', 'error');
      }
      
      return false;
    }
    
    async function playAudio() {
      setStatus('Loading audio...', 'info');
      log('Setting up audio...');
      
      // Check if motion data has audio URL
      if (motionData?.audioUrl) {
        audioElement.src = motionData.audioUrl;
        log(`Audio from motion data: ${motionData.audioUrl}`);
      } else {
        // Try ElevenLabs direct or fallback
        log('No audio URL in motion data, using test audio');
        // Use a simple test tone or silence
        audioElement.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
      }
      
      try {
        await audioElement.play();
        log('✅ Audio playing', 'success');
        setStatus('Audio playing!', 'success');
      } catch (e) {
        log(`❌ Audio error: ${e.message}`, 'error');
        setStatus('Audio failed - click to enable', 'error');
      }
    }
    
    function startAnimation() {
      if (!motionData) {
        log('❌ No motion data loaded', 'error');
        setStatus('Load motion data first!', 'error');
        return;
      }
      
      setStatus('Animating...', 'info');
      log('Starting animation loop...');
      
      // Simple CSS-based animation test
      const visemes = motionData.visemes || [];
      const expressions = motionData.expressions || [];
      
      log(`Processing ${visemes.length} visemes, ${expressions.length} expressions`);
      
      // Apply some visual feedback
      let frame = 0;
      const animate = () => {
        if (frame < 60) { // Run for ~1 second at 60fps
          // Simulate mouth movement with CSS transform
          const mouthOpen = Math.sin(frame * 0.3) * 0.5 + 0.5;
          kellyFace.style.transform = `scaleY(${1 + mouthOpen * 0.02})`;
          kellyFace.style.filter = `brightness(${1 + mouthOpen * 0.1})`;
          
          frame++;
          requestAnimationFrame(animate);
        } else {
          kellyFace.style.transform = 'none';
          kellyFace.style.filter = 'none';
          log('✅ Animation complete', 'success');
          setStatus('Animation test complete!', 'success');
        }
      };
      
      animate();
    }
    
    async function runFullTest() {
      log('=== FULL TEST STARTING ===', 'info');
      setStatus('Running full test...', 'info');
      
      const motionLoaded = await loadMotionData();
      if (!motionLoaded) {
        log('❌ FAILED: No motion data', 'error');
        return;
      }
      
      await new Promise(r => setTimeout(r, 500));
      await playAudio();
      
      await new Promise(r => setTimeout(r, 500));
      startAnimation();
      
      log('=== FULL TEST COMPLETE ===', 'info');
    }
    
    // Auto-log on load
    log('Test page loaded');
    log('Kelly image: ' + kellyFace.src);
  </script>
</body>
</html>
