<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelly Lipsync Lab - Curious Kelly</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; color: #fff; padding: 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(135deg, #fff, #f39c12); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { display: inline-block; padding: 0.5rem 1rem; background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; border-radius: 50px; color: #2ecc71; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .card { background: rgba(255,255,255,0.05); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .card video { width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; }
        .card-body { padding: 1rem; }
        .card-title { font-weight: 600; margin-bottom: 0.5rem; }
        .meta { font-size: 0.8rem; color: #8892b0; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .tag { padding: 0.2rem 0.5rem; background: rgba(100,255,218,0.15); border-radius: 4px; font-size: 0.7rem; color: #64ffda; }
        .controls { margin: 1rem 0; }
        button { padding: 0.5rem 1rem; margin-right: 0.5rem; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <span class="badge"> 11 Tests Complete</span>
    <h1>Kelly Lipsync Lab</h1>
    <p style="color:#a8b2d1;margin-bottom:1rem;">Compare SadTalker vs Wav2Lip quality - click any video to play</p>
    <div class="controls">
        <button onclick="document.querySelectorAll('video').forEach(v=>v.play())"> Play All</button>
        <button onclick="document.querySelectorAll('video').forEach(v=>v.pause())"> Pause All</button>
    </div>
    <div class="grid" id="grid"></div>
    <script>
        const videos = [
            { name: "sadtalker_baseline", model: "sadtalker", day: 1, phase: "hook", time: "155.9s", url: "https://replicate.delivery/yhqm/DmRN6pZbwQI3F5er1XuHMcsvf6iP8lYDjc9cr1VKvjsnzWwVA/out.mp4" },
            { name: "wav2lip_baseline", model: "wav2lip", day: 1, phase: "hook", time: "3.9s", url: "https://replicate.delivery/yhqm/rzdX4kaV40IsLZ4cXGdxfb8ewsOj864RU0xIwplIFXrszWwVA/result_voice.mp4" },
            { name: "sadtalker_exp_0.8", model: "sadtalker", day: 1, phase: "hook", time: "28.9s", url: "https://replicate.delivery/yhqm/nn9uqq4euWTTEKp8Ep8eutovvElm75YDErt9kuxtKowI0WwVA/out.mp4" },
            { name: "sadtalker_exp_1.2", model: "sadtalker", day: 1, phase: "hook", time: "22.4s", url: "https://replicate.delivery/yhqm/Oj9bGfvfdeXzUotZ1EjxyLTOkpjn9iNbq3uNgZMEYbO8otgrA/out.mp4" },
            { name: "sadtalker_exp_1.5", model: "sadtalker", day: 1, phase: "hook", time: "22.3s", url: "https://replicate.delivery/yhqm/xeeVkGJWy1gVHUtgb5rS9fUMSEn7DfIZLVPSfPQPyWaqm2CuC/out.mp4" },
            { name: "sadtalker_q1", model: "sadtalker", day: 1, phase: "q1", time: "22.3s", url: "https://replicate.delivery/yhqm/QFtgJzMx8LZWH1LtlbnjOM7yP6e3zAROaQnlRr43nfKL1WwVA/out.mp4" },
            { name: "sadtalker_wisdom", model: "sadtalker", day: 1, phase: "wisdom", time: "22.4s", url: "https://replicate.delivery/yhqm/vgFdMk1nr3pIFV0LI1Ufhb4k1lgHueiEYWooJ43hERMi1WwVA/out.mp4" },
            { name: "sadtalker_day5", model: "sadtalker", day: 5, phase: "hook", time: "22.4s", url: "https://replicate.delivery/yhqm/2F8mpseAPUyJWi7XWs6SXLlyNa5NoWDXQtj50VeX3SewrtgrA/out.mp4" },
            { name: "sadtalker_day10", model: "sadtalker", day: 10, phase: "hook", time: "22.4s", url: "https://replicate.delivery/yhqm/McBDmfeNFBhxVUQMrEY4K8COBMDP1U0KWeeRnaqIIU88YbBXB/out.mp4" },
            { name: "sadtalker_long_text", model: "sadtalker", day: 1, phase: "hook", time: "91.3s", url: "https://replicate.delivery/yhqm/N0XoT9J1BS58J1wxECvgEIferBV7h4OI75HnKjyH8BRo3WwVA/out.mp4", note: " long text" },
            { name: "sadtalker_no_enhance", model: "sadtalker", day: 1, phase: "hook", time: "22.4s", url: "https://replicate.delivery/yhqm/yonOFvvf1RyuDa8j3lWFBejduy6f28CfbdOgKc1hUby9f2CuC/out.mp4", note: "no GFPGAN" },
        ];
        document.getElementById('grid').innerHTML = videos.map(v => `
            <div class="card"><video controls loop muted playsinline><source src="${v.url}" type="video/mp4"></video>
            <div class="card-body"><div class="card-title">${v.name}</div>
            <div class="meta"><span class="tag">${v.model}</span><span>Day ${v.day}</span><span>${v.phase}</span><span>${v.time}</span>${v.note ? `<span>${v.note}</span>` : ''}</div></div></div>
        `).join('');
    </script>
    <footer style="text-align:center;margin-top:3rem;color:#8892b0;padding-top:2rem;border-top:1px solid rgba(255,255,255,0.1);">
        <p> Curious Kelly  <a href="/" style="color:#64ffda;">Back to Home</a></p>
    </footer>
</body>
</html>
