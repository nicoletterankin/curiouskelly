<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelly Production Images - Days 1-5</title>
    <style>
        :root { --bg: #0a0a0f; --card: #12121a; --accent: #10b981; --gold: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'SF Pro Display', system-ui, sans-serif; background: var(--bg); color: #e5e5e5; min-height: 100vh; }
        
        header {
            background: linear-gradient(180deg, rgba(16,185,129,0.1) 0%, transparent 100%);
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        h1 { font-size: 2rem; color: var(--accent); margin-bottom: 0.5rem; }
        .subtitle { color: #666; }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        
        main { padding: 2rem; max-width: 1800px; margin: 0 auto; }
        
        .day-section {
            margin-bottom: 3rem;
        }
        .day-title {
            font-size: 1.2rem;
            color: var(--gold);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(245,158,11,0.3);
        }
        
        .phase-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
        }
        @media (max-width: 1200px) {
            .phase-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .phase-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        .phase-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s;
        }
        .phase-card:hover {
            transform: scale(1.02);
        }
        .phase-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        .phase-info {
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .phase-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .phase-template {
            font-size: 0.7rem;
            color: var(--accent);
            background: rgba(16,185,129,0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            color: #444;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>🎨 Kelly Production Images</h1>
        <p class="subtitle">Days 1-5 × 5 Phases = 25 Base Images</p>
    </header>
    
    <div class="stats-bar">
        <div class="stat">
            <div class="stat-value">25</div>
            <div class="stat-label">Images Generated</div>
        </div>
        <div class="stat">
            <div class="stat-value">5</div>
            <div class="stat-label">Days Complete</div>
        </div>
        <div class="stat">
            <div class="stat-value">5.4m</div>
            <div class="stat-label">Generation Time</div>
        </div>
        <div class="stat">
            <div class="stat-value">$0.07</div>
            <div class="stat-label">Total Cost</div>
        </div>
    </div>
    
    <main id="gallery"></main>
    
    <footer>
        <p>✨ Kelly Production Factory • <a href="/lipsync/factory.html">Factory</a> • <a href="/lipsync/calibration.html">Calibration</a></p>
    </footer>
    
    <script>
        const SUPABASE_URL = 'https://tvjalxxsyryjphkforjv.supabase.co/storage/v1/object/public/kelly-templates/production/images';
        
        const phases = [
            { id: 'hook', name: 'Hook', template: 'excited' },
            { id: 'q1', name: 'Q1', template: 'curious' },
            { id: 'q2', name: 'Q2', template: 'explain' },
            { id: 'q3', name: 'Q3', template: 'thoughtful' },
            { id: 'wisdom', name: 'Wisdom', template: 'heartfelt' },
        ];
        
        function renderDay(day) {
            const dayStr = String(day).padStart(3, '0');
            const phaseCards = phases.map(p => `
                <div class="phase-card">
                    <img src="${SUPABASE_URL}/day_${dayStr}_${p.id}.png" alt="Day ${day} ${p.name}">
                    <div class="phase-info">
                        <span class="phase-name">${p.name}</span>
                        <span class="phase-template">${p.template}</span>
                    </div>
                </div>
            `).join('');
            
            return `
                <div class="day-section">
                    <div class="day-title">Day ${day}</div>
                    <div class="phase-grid">${phaseCards}</div>
                </div>
            `;
        }
        
        document.getElementById('gallery').innerHTML = [1, 2, 3, 4, 5].map(renderDay).join('');
    </script>
</body>
</html>
