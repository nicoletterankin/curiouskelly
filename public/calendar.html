<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>365 Days — Curious Kelly</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/apple-touch-icon.png" />

    <!-- Brand CSS -->
    <link rel="stylesheet" href="/css/brand-colors.css" />

    <!-- Config -->
    <script src="/config.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-dark);
        color: var(--text-primary);
        min-height: 100vh;
        padding-bottom: 80px;
      }

      .header {
        padding: 20px;
        text-align: center;
        background: var(--surface-dark);
        border-bottom: 1px solid var(--border-dark);
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .streak-display {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid var(--gold);
        border-radius: 20px;
        font-size: 18px;
        font-weight: 600;
        color: var(--gold);
      }

      .stats {
        display: flex;
        justify-content: space-around;
        padding: 20px;
        gap: 12px;
      }

      .stat-card {
        flex: 1;
        padding: 16px;
        background: var(--surface-dark);
        border-radius: 12px;
        text-align: center;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 700;
        color: var(--kelly-blue);
        margin-bottom: 4px;
      }

      .stat-label {
        font-size: 12px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .calendar-container {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
        gap: 8px;
      }

      .day-cell {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--surface-dark);
        border: 1px solid var(--border-dark);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
      }

      .day-cell:hover {
        border-color: var(--kelly-blue);
        transform: scale(1.05);
      }

      .day-number {
        font-size: 16px;
        font-weight: 600;
      }

      .day-cell.completed {
        background: rgba(37, 99, 235, 0.2);
        border-color: var(--kelly-blue);
      }

      .day-cell.completed::after {
        content: '✓';
        position: absolute;
        top: 2px;
        right: 4px;
        font-size: 12px;
        color: var(--success);
      }

      .day-cell.today {
        border: 2px solid var(--gold);
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
      }

      /* Bottom Navigation */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 70px;
        background: var(--surface-dark);
        border-top: 1px solid var(--border-dark);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 1000;
      }

      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-decoration: none;
        color: var(--text-secondary);
        transition: all 0.2s;
        padding: 8px;
      }

      .nav-item:hover,
      .nav-item.active {
        color: var(--kelly-blue);
      }

      .nav-icon {
        font-size: 24px;
      }

      .nav-label {
        font-size: 11px;
        font-weight: 500;
      }

      @media (max-width: 640px) {
        .calendar-grid {
          grid-template-columns: repeat(7, 1fr);
        }

        .stats {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>📅 365 Days with Kelly</h1>
      <div class="streak-display">
        <span>🔥</span>
        <span id="streak-count">0</span>
        <span>day streak</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="completed-count">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="remaining-count">365</div>
        <div class="stat-label">Remaining</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="percent-complete">0%</div>
        <div class="stat-label">Progress</div>
      </div>
    </div>

    <div class="calendar-container">
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="/" class="nav-item">
        <div class="nav-icon">⌂</div>
        <div class="nav-label">Home</div>
      </a>
      <a href="/calendar.html" class="nav-item active">
        <div class="nav-icon">🗓️</div>
        <div class="nav-label">Calendar</div>
      </a>
      <a href="/learn.html" class="nav-item">
        <div class="nav-icon">📖</div>
        <div class="nav-label">Learn</div>
      </a>
      <a href="/me.html" class="nav-item">
        <div class="nav-icon">👤</div>
        <div class="nav-label">Me</div>
      </a>
      <a href="/settings.html" class="nav-item">
        <div class="nav-icon">⚙️</div>
        <div class="nav-label">Settings</div>
      </a>
    </nav>

    <script>
      const supabase = window.supabase.createClient(
        window.SUPABASE_URL || 'https://tvjalxxsyryjphkforjv.supabase.co',
        window.SUPABASE_ANON_KEY ||
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2amFseHhzeXJ5anBoa2Zvcmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NjM5MTksImV4cCI6MjA3OTEzOTkxOX0.VFrBs9sWkIgfFNpavQHxo0vSy6tkICpSbuj_TWvGHxI'
      );

      let completedDays = new Set();
      let streakCount = 0;

      async function loadProgress() {
        try {
          const {
            data: { user }
          } = await supabase.auth.getUser();

          if (user) {
            const { data, error } = await supabase
              .from('user_progress')
              .select('day_number')
              .eq('user_id', user.id);

            if (!error && data) {
              completedDays = new Set(data.map((p) => p.day_number));
              calculateStreak();
            }
          }
        } catch (error) {
          console.error('[Calendar] Error loading progress:', error);
        }

        updateStats();
        renderCalendar();
      }

      function calculateStreak() {
        if (completedDays.size === 0) {
          streakCount = 0;
          return;
        }

        const sorted = Array.from(completedDays).sort((a, b) => b - a);
        const today = getDayOfYear();

        let streak = 0;
        let checkDay = today;

        // Count backwards from today
        while (sorted.includes(checkDay)) {
          streak++;
          checkDay--;
        }

        streakCount = streak;
      }

      function getDayOfYear() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        return Math.floor((now - start) / (1000 * 60 * 60 * 24));
      }

      function updateStats() {
        const completed = completedDays.size;
        const remaining = 365 - completed;
        const percent = Math.round((completed / 365) * 100);

        document.getElementById('streak-count').textContent = streakCount;
        document.getElementById('completed-count').textContent = completed;
        document.getElementById('remaining-count').textContent = remaining;
        document.getElementById('percent-complete').textContent = `${percent}%`;
      }

      function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        const today = getDayOfYear();

        for (let day = 1; day <= 365; day++) {
          const cell = document.createElement('div');
          cell.className = 'day-cell';
          cell.innerHTML = `<div class="day-number">${day}</div>`;

          if (completedDays.has(day)) {
            cell.classList.add('completed');
          }

          if (day === today) {
            cell.classList.add('today');
          }

          cell.onclick = () => {
            window.location.href = `/learn.html?day=${day}`;
          };

          grid.appendChild(cell);
        }
      }

      // Initialize
      loadProgress();
    </script>
  </body>
</html>
