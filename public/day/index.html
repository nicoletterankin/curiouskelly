<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Lesson - Curious Kelly</title>
    
    <!-- SEO Meta -->
    <meta name="description" content="Your daily lesson with Kelly - one topic, every day, personalized for your age.">
    <meta property="og:title" content="The Daily Lesson - Curious Kelly">
    <meta property="og:description" content="One topic. Every day. All year. Your lifelong learning companion.">
    <meta property="og:image" content="/images/brand/kelly-og-image.png">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #09090b;
            --bg-elevated: #18181b;
            --bg-secondary: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border-color: #27272a;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .logo-text {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .day-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-primary);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .nav-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* Main Content */
        .main {
            padding: 100px 24px 120px;
            max-width: 800px;
            margin: 0 auto;
        }

        .day-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .date-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .day-number {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        /* Lesson Card */
        .lesson-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .lesson-card-header {
            position: relative;
            padding: 32px;
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-elevated));
        }

        .lesson-card-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), #60a5fa);
        }

        .lesson-emoji {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .lesson-topic {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 2rem;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 16px;
        }

        .lesson-truth {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .lesson-card-body {
            padding: 32px;
            border-top: 1px solid var(--border-color);
        }

        /* Kelly Avatar */
        .kelly-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .kelly-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--accent-primary);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }

        .kelly-info h4 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .kelly-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* CTA Buttons */
        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 32px;
            background: var(--accent-primary);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 28px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--bg-elevated);
            border-color: var(--accent-primary);
        }

        /* Meta Info */
        .lesson-meta {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Calendar Strip */
        .calendar-strip {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
            padding: 24px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .strip-day {
            width: 48px;
            height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--bg-secondary);
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .strip-day:hover {
            background: var(--bg-color);
            color: var(--text-primary);
        }

        .strip-day.current {
            background: var(--accent-primary);
            color: white;
            font-weight: 600;
        }

        .strip-day .day-num {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .strip-day .day-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 12px 24px;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 32px;
            max-width: 600px;
            margin: 0 auto;
        }

        .footer-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.2s;
        }

        .footer-link:hover, .footer-link.active {
            color: var(--accent-primary);
        }

        .footer-link svg {
            width: 24px;
            height: 24px;
        }

        .footer-link img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .main {
                padding: 80px 16px 100px;
            }
            
            .day-number {
                font-size: 2.5rem;
            }
            
            .lesson-topic {
                font-size: 1.5rem;
            }
            
            .kelly-section {
                flex-direction: column;
                text-align: center;
            }
            
            .lesson-meta {
                flex-wrap: wrap;
                gap: 16px;
            }
            
            .calendar-strip {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="/" class="logo">
                <img src="/images/brand/kelly-mark-circle-64.png" alt="Kelly">
                <span class="logo-text">Curious Kelly</span>
            </a>
            <span class="day-badge" id="day-badge">
                <span>📅</span>
                <span id="day-badge-text">Day 1</span>
            </span>
        </div>
        <nav class="header-nav">
            <a href="#" class="nav-btn" id="prev-day" title="Previous day">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <a href="#" class="nav-btn" id="next-day" title="Next day">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="day-header">
            <p class="date-label" id="date-label">Loading...</p>
            <h1 class="day-number" id="day-display">Day 1</h1>
        </div>

        <div class="lesson-card" id="lesson-card">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading your lesson...</p>
            </div>
        </div>

        <!-- Calendar Strip -->
        <div class="calendar-strip" id="calendar-strip">
            <!-- Generated by JS -->
        </div>
    </main>

    <!-- Footer Navigation -->
    <footer class="footer">
        <nav class="footer-nav">
            <a href="/" class="footer-link">
                <img src="/images/brand/kelly-mark-circle-64.png" alt="">
                <span>Home</span>
            </a>
            <a href="/calendar.html" class="footer-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>Calendar</span>
            </a>
            <a href="/learn" class="footer-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>Learn</span>
            </a>
            <a href="/curriculum.html" class="footer-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span>All Days</span>
            </a>
        </nav>
    </footer>

    <script>
        // Supabase config
        const supabaseUrl = 'https://fgskrfwmtrxmflkufouh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnc2tyZndtdHJ4bWZsa3Vmb3VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDMwMTI0MDQsImV4cCI6MjA1ODU4ODQwNH0.cbxJiJXMWNjDmPFn4Be__8XMNwlQU1U1aRPnFJNq82g';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Get day number from URL
        function getDayFromUrl() {
            const path = window.location.pathname;
            const match = path.match(/\/day\/(\d+)/);
            if (match) return parseInt(match[1]);
            
            // Fallback to today
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        // Convert day number to date
        function dayToDate(dayNum, year = 2025) {
            const date = new Date(year, 0);
            date.setDate(dayNum);
            return date;
        }

        // Topic to emoji mapping
        function getTopicEmoji(topic) {
            const t = topic.toLowerCase();
            if (t.includes('leaf') || t.includes('plant') || t.includes('tree') || t.includes('nature')) return '🌿';
            if (t.includes('sun') || t.includes('star') || t.includes('space')) return '☀️';
            if (t.includes('water') || t.includes('ocean') || t.includes('rain')) return '💧';
            if (t.includes('animal') || t.includes('dog') || t.includes('cat')) return '🐾';
            if (t.includes('music') || t.includes('song')) return '🎵';
            if (t.includes('art') || t.includes('paint') || t.includes('draw')) return '🎨';
            if (t.includes('math') || t.includes('number')) return '🔢';
            if (t.includes('history') || t.includes('ancient')) return '🏛️';
            if (t.includes('science') || t.includes('experiment')) return '🔬';
            if (t.includes('body') || t.includes('health')) return '❤️';
            if (t.includes('earth') || t.includes('planet')) return '🌍';
            if (t.includes('food') || t.includes('cook')) return '🍳';
            if (t.includes('book') || t.includes('read') || t.includes('story')) return '📚';
            if (t.includes('brain') || t.includes('think') || t.includes('mind')) return '🧠';
            if (t.includes('rule') || t.includes('law') || t.includes('govern')) return '⚖️';
            return '✨';
        }

        // Load lesson data
        async function loadLesson(dayNum) {
            try {
                const { data: lesson, error } = await supabase
                    .from('core_lessons')
                    .select('*')
                    .eq('day_number', dayNum)
                    .single();

                if (error) throw error;
                return lesson;
            } catch (error) {
                console.error('Error loading lesson:', error);
                return null;
            }
        }

        // Render lesson card
        function renderLesson(lesson, dayNum) {
            const card = document.getElementById('lesson-card');
            const date = dayToDate(dayNum);
            const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
            const dateStr = date.toLocaleDateString('en-US', options);
            
            if (!lesson) {
                card.innerHTML = `
                    <div class="lesson-card-header">
                        <div class="lesson-emoji">🔮</div>
                        <h2 class="lesson-topic">Coming Soon</h2>
                        <p class="lesson-truth">This lesson hasn't been unlocked yet. Check back on ${dateStr}!</p>
                    </div>
                    <div class="lesson-card-body">
                        <div class="cta-group">
                            <a href="/" class="btn-secondary">
                                <span>Back to Home</span>
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            const emoji = getTopicEmoji(lesson.topic);
            
            card.innerHTML = `
                <div class="lesson-card-header">
                    <div class="lesson-emoji">${emoji}</div>
                    <h2 class="lesson-topic">${lesson.topic}</h2>
                    <p class="lesson-truth">${lesson.big_truth || 'Every day brings a new opportunity to learn something wonderful.'}</p>
                </div>
                <div class="lesson-card-body">
                    <div class="kelly-section">
                        <img src="/images/brand/kelly-mark-circle-512.png" alt="Kelly" class="kelly-avatar">
                        <div class="kelly-info">
                            <h4>Learn with Kelly</h4>
                            <p>Your AI teacher, personalized for your age</p>
                        </div>
                    </div>
                    <div class="cta-group">
                        <a href="/learn?day=${dayNum}" class="btn-primary">
                            <span>Begin This Lesson</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </a>
                        <a href="/curriculum.html" class="btn-secondary">
                            <span>View All 365 Days</span>
                        </a>
                    </div>
                    <div class="lesson-meta">
                        <span class="meta-item">⏱️ ~5 minutes</span>
                        <span class="meta-item">🎓 Ages 13+</span>
                        <span class="meta-item">🌍 Available in 8 languages</span>
                    </div>
                </div>
            `;
        }

        // Render calendar strip
        function renderCalendarStrip(currentDay) {
            const strip = document.getElementById('calendar-strip');
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            let html = '';
            for (let i = -3; i <= 3; i++) {
                const dayNum = currentDay + i;
                if (dayNum < 1 || dayNum > 366) continue;
                
                const date = dayToDate(dayNum);
                const dayName = days[date.getDay()];
                const isCurrent = i === 0;
                
                html += `
                    <a href="/day/${dayNum}" class="strip-day ${isCurrent ? 'current' : ''}">
                        <span class="day-num">${date.getDate()}</span>
                        <span class="day-label">${dayName}</span>
                    </a>
                `;
            }
            
            strip.innerHTML = html;
        }

        // Update navigation
        function updateNavigation(dayNum) {
            const prevBtn = document.getElementById('prev-day');
            const nextBtn = document.getElementById('next-day');
            
            if (dayNum <= 1) {
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.href = `/day/${dayNum - 1}`;
                prevBtn.classList.remove('disabled');
            }
            
            if (dayNum >= 366) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.href = `/day/${dayNum + 1}`;
                nextBtn.classList.remove('disabled');
            }
        }

        // Update page info
        function updatePageInfo(dayNum) {
            const date = dayToDate(dayNum);
            const options = { month: 'long', day: 'numeric', year: 'numeric' };
            const dateStr = date.toLocaleDateString('en-US', options);
            
            document.getElementById('date-label').textContent = dateStr;
            document.getElementById('day-display').textContent = `Day ${dayNum}`;
            document.getElementById('day-badge-text').textContent = `Day ${dayNum}`;
            document.title = `Day ${dayNum} - The Daily Lesson | Curious Kelly`;
        }

        // Initialize page
        async function init() {
            const dayNum = getDayFromUrl();
            
            updatePageInfo(dayNum);
            updateNavigation(dayNum);
            renderCalendarStrip(dayNum);
            
            const lesson = await loadLesson(dayNum);
            renderLesson(lesson, dayNum);
        }

        init();
    </script>
</body>
</html>
