<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Submission — Curious Kelly</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #faf9f7;
            --bg-card: #ffffff;
            --bg-elevated: #f5f3f0;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --accent-kelly: #d4a574;
            --accent-blue: #87ceeb;
            --accent-primary: #3b82f6;
            --success: #22c55e;
            --border-color: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.7;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--accent-kelly) 0%, #c4956a 100%);
            padding: 40px 24px;
            text-align: center;
        }

        .header-sparkle {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        header h1 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.8rem;
            font-weight: 400;
            color: white;
            margin-bottom: 8px;
        }

        header p {
            color: rgba(255,255,255,0.85);
            font-size: 0.95rem;
        }

        /* Main */
        main {
            max-width: 680px;
            margin: -40px auto 60px;
            padding: 0 20px;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .card-title {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Submission details */
        .submission-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 16px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .meta-label {
            color: var(--text-muted);
        }

        .meta-value {
            color: var(--text-primary);
        }

        .submission-message {
            background: var(--bg-elevated);
            border-radius: 12px;
            padding: 20px;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        /* Status badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-new {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-primary);
        }

        .status-reviewed {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .status-replied {
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
        }

        /* Attachments */
        .attachments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .attachment-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .attachment-card:hover {
            border-color: var(--accent-kelly);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.2);
        }

        .attachment-icon {
            font-size: 1.5rem;
        }

        .attachment-info {
            flex: 1;
            min-width: 0;
        }

        .attachment-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .attachment-size {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Response from Kelly */
        .kelly-response {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, rgba(135, 206, 235, 0.08) 100%);
            border-left: 4px solid var(--accent-kelly);
            border-radius: 0 12px 12px 0;
            padding: 20px 24px;
            margin-top: 20px;
        }

        .kelly-response-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .kelly-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-kelly);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .kelly-name {
            font-weight: 600;
            color: var(--accent-kelly);
        }

        /* Follow-up form */
        .followup-form {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.2s;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-kelly);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-kelly);
            color: white;
        }

        .btn-primary:hover {
            background: #c4956a;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-kelly);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--accent-kelly);
            text-decoration: none;
        }

        /* Success message */
        .success-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .success-toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-sparkle">✨</div>
        <h1>Your Submission</h1>
        <p>Here's what you sent to Curious Kelly</p>
    </header>

    <main>
        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading your submission...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>✨ Curious Kelly • <a href="https://curiouskelly.com">curiouskelly.com</a></p>
    </footer>

    <div id="success-toast" class="success-toast">✓ Follow-up sent!</div>

    <script>
        // Get submission ID from URL path
        const pathParts = window.location.pathname.split('/');
        const submissionId = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];

        async function loadSubmission() {
            const content = document.getElementById('content');

            if (!submissionId || submissionId === 'submission') {
                content.innerHTML = `
                    <div class="card error-state">
                        <div class="error-icon">🔍</div>
                        <h2 style="font-family: 'Newsreader', serif; margin-bottom: 8px;">Submission Not Found</h2>
                        <p style="color: var(--text-secondary);">The submission ID is missing from the URL.</p>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(`/api/submission/${submissionId}`);
                
                if (!response.ok) {
                    throw new Error('Submission not found');
                }

                const data = await response.json();
                renderSubmission(data);

            } catch (error) {
                content.innerHTML = `
                    <div class="card error-state">
                        <div class="error-icon">😕</div>
                        <h2 style="font-family: 'Newsreader', serif; margin-bottom: 8px;">Submission Not Found</h2>
                        <p style="color: var(--text-secondary);">We couldn't find this submission. The link may be incorrect or expired.</p>
                    </div>
                `;
            }
        }

        function renderSubmission(data) {
            const content = document.getElementById('content');
            const date = new Date(data.created_at).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            const statusBadge = {
                'new': '<span class="status-badge status-new">📬 Received</span>',
                'reviewed': '<span class="status-badge status-reviewed">✅ Reviewed</span>',
                'replied': '<span class="status-badge status-replied">💬 Replied</span>',
            }[data.status] || '<span class="status-badge status-new">📬 Received</span>';

            const attachmentsHtml = data.attachments && data.attachments.length > 0 ? `
                <div class="card">
                    <h3 class="card-title">📁 Your Files</h3>
                    <div class="attachments-grid">
                        ${data.attachments.map(att => `
                            <a href="${att.public_url}" target="_blank" class="attachment-card">
                                <span class="attachment-icon">${getFileIcon(att.filename)}</span>
                                <div class="attachment-info">
                                    <div class="attachment-name">${escapeHtml(att.filename)}</div>
                                    <div class="attachment-size">${formatFileSize(att.size_bytes)}</div>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            const responseHtml = data.response ? `
                <div class="kelly-response">
                    <div class="kelly-response-header">
                        <div class="kelly-avatar">✨</div>
                        <span class="kelly-name">Kelly's Response</span>
                    </div>
                    <p style="white-space: pre-wrap; line-height: 1.8;">${escapeHtml(data.response)}</p>
                </div>
            ` : '';

            content.innerHTML = `
                <div class="card">
                    <div class="submission-meta">
                        <span class="meta-label">From:</span>
                        <span class="meta-value">${escapeHtml(data.name)} (${escapeHtml(data.email)})</span>
                        
                        <span class="meta-label">Sent:</span>
                        <span class="meta-value">${date}</span>
                        
                        <span class="meta-label">Status:</span>
                        <span class="meta-value">${statusBadge}</span>
                    </div>
                    
                    <h3 class="card-title">💬 Your Message</h3>
                    <div class="submission-message">${escapeHtml(data.message)}</div>
                    
                    ${responseHtml}
                </div>
                
                ${attachmentsHtml}
                
                <div class="card">
                    <h3 class="card-title">📝 Add a Follow-up</h3>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px;">
                        Have more to share? Add a note or upload additional files.
                    </p>
                    <form class="followup-form" onsubmit="submitFollowup(event)">
                        <div class="form-group">
                            <label for="followup-comment">Your message</label>
                            <textarea id="followup-comment" placeholder="Add any additional notes, questions, or context..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            Send Follow-up ✨
                        </button>
                    </form>
                </div>
            `;
        }

        async function submitFollowup(event) {
            event.preventDefault();
            
            const comment = document.getElementById('followup-comment').value.trim();
            
            if (!comment) {
                alert('Please add a message');
                return;
            }

            try {
                const response = await fetch(`/api/submission/${submissionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment })
                });

                if (response.ok) {
                    // Show success toast
                    const toast = document.getElementById('success-toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 3000);
                    
                    // Clear form
                    document.getElementById('followup-comment').value = '';
                } else {
                    throw new Error('Failed to send');
                }
            } catch (error) {
                alert('Failed to send follow-up. Please try again.');
            }
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📄', 'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️',
                'gif': '🖼️', 'webp': '🖼️', 'zip': '📦', 'fbx': '🎮',
                'obj': '🎮', 'blend': '🎮', 'psd': '🎨', 'ai': '🎨',
            };
            return icons[ext] || '📎';
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load on page ready
        loadSubmission();
    </script>
</body>
</html>
