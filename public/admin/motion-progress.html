<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelly Motion Library - Progress Dashboard</title>
  <meta http-equiv="refresh" content="30"> <!-- Auto-refresh every 30s -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      color: #6366f1;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 24px;
    }

    .refresh-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #1a1a2e;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #888;
    }

    .refresh-indicator.loading {
      color: #6366f1;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #1a1a2e;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #6366f1;
    }

    .stat-value.success { color: #22c55e; }
    .stat-value.warning { color: #f59e0b; }
    .stat-value.error { color: #ef4444; }

    .stat-label {
      font-size: 0.85rem;
      color: #888;
      margin-top: 4px;
    }

    /* Progress Bar */
    .progress-section {
      background: #1a1a2e;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 32px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 24px;
      background: #333;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      transition: width 0.5s ease;
    }

    .progress-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Age Bucket Grid */
    .buckets-section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ccc;
    }

    .buckets-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .bucket-card {
      background: #1a1a2e;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .bucket-card.complete {
      border: 2px solid #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }

    .bucket-card.in-progress {
      border: 2px solid #6366f1;
      background: rgba(99, 102, 241, 0.1);
    }

    .bucket-name {
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .bucket-progress {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .bucket-bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .bucket-bar-fill {
      height: 100%;
      background: #6366f1;
      border-radius: 3px;
    }

    .bucket-card.complete .bucket-bar-fill {
      background: #22c55e;
    }

    /* Recent Clips */
    .recent-section {
      margin-bottom: 32px;
    }

    .clips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .clip-card {
      background: #1a1a2e;
      border-radius: 12px;
      overflow: hidden;
    }

    .clip-video {
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      object-fit: cover;
    }

    .clip-info {
      padding: 12px;
    }

    .clip-name {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .clip-phase {
      display: inline-block;
      padding: 2px 8px;
      background: #6366f1;
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .clip-time {
      color: #888;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    /* Current Generation */
    .current-section {
      background: linear-gradient(135deg, #1a1a2e, #252540);
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 32px;
      border: 2px solid #6366f1;
    }

    .current-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pulse {
      width: 12px;
      height: 12px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .current-clip {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .current-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .current-detail {
      text-align: center;
    }

    .current-detail-label {
      font-size: 0.8rem;
      color: #888;
    }

    .current-detail-value {
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* ETA */
    .eta-section {
      background: #1a1a2e;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .eta-value {
      font-size: 2rem;
      font-weight: bold;
      color: #f59e0b;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    /* Loading */
    .loading {
      opacity: 0.6;
    }

    @media (max-width: 900px) {
      .buckets-grid { grid-template-columns: repeat(2, 1fr); }
      .current-details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="refresh-indicator" id="refresh-indicator">
    🔄 Auto-refresh: 30s
  </div>

  <h1>🎬 Kelly Motion Library</h1>
  <p class="subtitle">Real-time generation progress</p>

  <!-- Stats Grid -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card">
      <div class="stat-value success" id="stat-completed">--</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-value warning" id="stat-generating">--</div>
      <div class="stat-label">Generating</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-pending">--</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card">
      <div class="stat-value error" id="stat-failed">--</div>
      <div class="stat-label">Failed</div>
    </div>
  </div>

  <!-- Overall Progress -->
  <div class="progress-section">
    <div class="progress-header">
      <span>Overall Progress</span>
      <span id="progress-label">0 / 420</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>
  </div>

  <!-- Current Generation -->
  <div class="current-section" id="current-section" style="display: none;">
    <div class="current-header">
      <div class="pulse"></div>
      <span>Currently Generating</span>
    </div>
    <div class="current-clip" id="current-clip">--</div>
    <div class="current-details">
      <div class="current-detail">
        <div class="current-detail-label">Persona</div>
        <div class="current-detail-value" id="current-persona">--</div>
      </div>
      <div class="current-detail">
        <div class="current-detail-label">Age</div>
        <div class="current-detail-value" id="current-age">--</div>
      </div>
      <div class="current-detail">
        <div class="current-detail-label">Phase</div>
        <div class="current-detail-value" id="current-phase">--</div>
      </div>
    </div>
  </div>

  <!-- Age Buckets -->
  <div class="buckets-section">
    <div class="section-title">Progress by Age Bucket</div>
    <div class="buckets-grid" id="buckets-grid">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- ETA -->
  <div class="eta-section">
    <div class="stat-label">Estimated Time Remaining</div>
    <div class="eta-value" id="eta-value">Calculating...</div>
  </div>

  <!-- Recent Clips -->
  <div class="recent-section">
    <div class="section-title">Recently Completed</div>
    <div class="clips-grid" id="clips-grid">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- Optional: load global SUPABASE_URL / SUPABASE_ANON_KEY if present -->
  <script src="/config.js"></script>

<script type="module">
  const AGE_BUCKETS = ['kid', 'teen', 'adult', 'elder', 'super_elder'];
  const DEFAULT_TOTAL_CLIPS = 420; // 12 personas × 5 ages × 7 phases
  const AVG_CLIP_TIME = 150; // seconds per clip (rough estimate)

  function normalizeStatus(status) {
    if (!status) return 'pending';
    if (status === 'completed' || status === 'generating' || status === 'pending' || status === 'failed') return status;
    return 'pending';
  }

  function toMillis(iso) {
    if (!iso) return 0;
    const t = Date.parse(iso);
    return Number.isFinite(t) ? t : 0;
  }

  async function fetchProgressFromPublicSupabase() {
    const supabaseUrl = window.SUPABASE_URL || window.KELLY_CONFIG?.supabaseUrl;
    const supabaseKey = window.SUPABASE_ANON_KEY || window.KELLY_CONFIG?.supabaseKey;
    if (!supabaseUrl || !supabaseKey) return null;

    const url = `${supabaseUrl}/rest/v1/kelly_motion_library?select=avatar_key,persona,age_bucket,phase,status,video_url,completed_at,updated_at,created_at`;

    const res = await fetch(url, {
      headers: {
        apikey: supabaseKey,
        authorization: `Bearer ${supabaseKey}`,
      },
    });
    if (!res.ok) throw new Error(`Supabase REST error: HTTP ${res.status}`);
    const rows = await res.json();

    const stats = { completed: 0, generating: 0, pending: 0, failed: 0 };
    const buckets = {};
    let generating = null;
    const completedRows = [];

    for (const row of rows || []) {
      const s = normalizeStatus(row.status);
      stats[s] = (stats[s] || 0) + 1;

      const bucketKey = row.age_bucket || 'unknown';
      if (!buckets[bucketKey]) buckets[bucketKey] = { completed: 0, total: 0 };
      buckets[bucketKey].total++;

      if (s === 'completed') {
        buckets[bucketKey].completed++;
        completedRows.push(row);
      }

      if (s === 'generating') {
        const rowTime = Math.max(toMillis(row.updated_at), toMillis(row.created_at));
        const curTime = generating ? Math.max(toMillis(generating.updated_at), toMillis(generating.created_at)) : -1;
        if (!generating || rowTime > curTime) generating = row;
      }
    }

    for (const key of AGE_BUCKETS) {
      if (!buckets[key]) buckets[key] = { completed: 0, total: 84 };
      if (!buckets[key].total) buckets[key].total = 84;
    }

    completedRows.sort((a, b) => toMillis(b.completed_at) - toMillis(a.completed_at));

    return {
      statusCounts: stats,
      bucketCounts: buckets,
      generating,
      recent: completedRows.slice(0, 6),
      total: DEFAULT_TOTAL_CLIPS,
    };
  }

  async function fetchProgress() {
    try {
      const res = await fetch('/api/motion-progress', { cache: 'no-store' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      return {
        statusCounts: data.stats,
        bucketCounts: data.buckets,
        generating: data.generating,
        recent: data.recent,
        total: data.total || DEFAULT_TOTAL_CLIPS,
      };
    } catch (err) {
      console.warn('API fetch failed, trying public Supabase fallback:', err);
      try {
        const fallback = await fetchProgressFromPublicSupabase();
        return fallback;
      } catch (e) {
        console.error('Fallback fetch error:', e);
        return null;
      }
    }
  }

  function updateUI(data) {
    if (!data) {
      document.getElementById('eta-value').textContent = '⚠️ API unavailable';
      return;
    }

    const { statusCounts, bucketCounts, generating, recent, total } = data;

    // Update stats
    document.getElementById('stat-completed').textContent = statusCounts?.completed ?? 0;
    document.getElementById('stat-generating').textContent = statusCounts?.generating ?? 0;
    document.getElementById('stat-pending').textContent = statusCounts?.pending ?? 0;
    document.getElementById('stat-failed').textContent = statusCounts?.failed ?? 0;

    // Update progress bar
    const completed = statusCounts?.completed ?? 0;
    const percent = total ? Math.round((completed / total) * 100) : 0;
    document.getElementById('progress-fill').style.width = `${percent}%`;
    document.getElementById('progress-text').textContent = `${percent}%`;
    document.getElementById('progress-label').textContent = `${completed} / ${total}`;

    // Update buckets
    const bucketsGrid = document.getElementById('buckets-grid');
    bucketsGrid.innerHTML = AGE_BUCKETS.map(bucket => {
      const b = bucketCounts?.[bucket] || { completed: 0, total: 84 };
      const pct = b.total ? Math.round((b.completed / b.total) * 100) : 0;
      const isComplete = b.completed >= b.total && b.total > 0;
      const isInProgress = b.completed > 0 && b.completed < b.total;

      return `
        <div class="bucket-card ${isComplete ? 'complete' : ''} ${isInProgress ? 'in-progress' : ''}">
          <div class="bucket-name">${bucket.replace('_', ' ')}</div>
          <div class="bucket-progress">${b.completed}/${b.total}</div>
          <div class="bucket-bar">
            <div class="bucket-bar-fill" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
    }).join('');

    // Update current generation
    const currentSection = document.getElementById('current-section');
    if (generating) {
      currentSection.style.display = 'block';
      document.getElementById('current-clip').textContent = generating.avatar_key || '--';

      const [persona, age] = (generating.avatar_key || '').split('_');
      document.getElementById('current-persona').textContent = generating.persona || persona || '--';
      document.getElementById('current-age').textContent = generating.age_bucket || age || '--';
      document.getElementById('current-phase').textContent = generating.phase || '--';
    } else {
      currentSection.style.display = 'none';
    }

    // Update ETA
    const remaining = Math.max(0, total - completed);
    const etaSeconds = remaining * AVG_CLIP_TIME;
    const etaHours = Math.floor(etaSeconds / 3600);
    const etaMinutes = Math.floor((etaSeconds % 3600) / 60);

    if (remaining === 0) {
      document.getElementById('eta-value').textContent = '✅ Complete!';
    } else {
      document.getElementById('eta-value').textContent = `~${etaHours}h ${etaMinutes}m`;
    }

    // Update recent clips
    const clipsGrid = document.getElementById('clips-grid');
    if (!recent || recent.length === 0) {
      clipsGrid.innerHTML = '<div class="empty-state">No clips completed yet</div>';
    } else {
      clipsGrid.innerHTML = recent.map(clip => {
        const time = clip.completed_at ? new Date(clip.completed_at).toLocaleTimeString() : '--';
        return `
          <div class="clip-card">
            <video class="clip-video" src="${clip.video_url || ''}" muted loop
                   onmouseenter="this.play()" onmouseleave="this.pause()">
            </video>
            <div class="clip-info">
              <div class="clip-name">${clip.avatar_key || '--'}</div>
              <span class="clip-phase">${clip.phase || '--'}</span>
              <div class="clip-time">Completed: ${time}</div>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  // Initial load
  async function init() {
    const indicator = document.getElementById('refresh-indicator');
    indicator.classList.add('loading');
    indicator.textContent = '🔄 Loading...';

    const data = await fetchProgress();
    updateUI(data);

    indicator.classList.remove('loading');
    indicator.textContent = '🔄 Auto-refresh: 30s';
  }

  init();
</script>
</body>
</html>
