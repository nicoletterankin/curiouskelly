    }

      font-size: 0.75rem;
    }

      padding: 0.5rem;

      font-weight: bold;
      position: sticky;
      top: 0;
    }

    }

      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 230px;
    }
    
    .avatar-media {
      width: 100%;
    }
    
    .avatar-placeholder {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      border: 1px dashed #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.7rem;
      color: #9ca3af;
      padding: 0.5rem;
      background: #0f172a;
    }
    
    .avatar-placeholder.hidden {
      display: none;
    }
    
    .image-input {
      margin-top: 0.1rem;
    }
    
    .image-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: #9ca3af;
      gap: 0.25rem;
    }
    
    .image-meta span {
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    
    .micro-button {
      background: transparent;
      border: 1px solid #374151;
      color: #9ca3af;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      font-size: 0.6rem;
      cursor: pointer;
    }
    
    .micro-button:hover {
      background: #374151;
      color: #fff;
    }
    
    .micro-actions {
      display: flex;
      gap: 0.25rem;
    }
    
    .avatar-cell.has-id {
      border-color: #10b981;
    }
    
    .avatar-cell.complete {
      border-color: #3b82f6;
      background: #0f172a;
    }
    
    .avatar-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
      background: #1f2937;
    }
    
    .avatar-id {
      font-family: monospace;
      font-size: 0.65rem;
      background: #1f2937;
      padding: 2px 4px;
      border-radius: 2px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .avatar-id:hover {
      background: #374151;
    }
    
    .avatar-id.empty {
      color: #ef4444;
      font-style: italic;
    }
    
    input[type="text"] {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 4px;
      border-radius: 2px;
      font-size: 0.7rem;
    }
    
    textarea {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 4px;
      border-radius: 2px;
      font-size: 0.65rem;
      resize: vertical;
      min-height: 40px;
    }
    
    .clips {
      display: flex;
      gap: 2px;
    }
    
    .clip {
      flex: 1;
      padding: 2px;
      text-align: center;
      background: #374151;
      border-radius: 2px;
      font-size: 0.6rem;
      cursor: pointer;
    }
    
    .clip:hover {
      background: #4b5563;
    }
    
    .clip.done {
      background: #10b981;
      color: #000;
    }
    
    .actions {
      margin: 1rem 0;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    
    button:hover { background: #2563eb; }
    
    .stats {
      background: #1f2937;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .legend {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      border: 2px solid;
    }

    .legend-color.has-id { border-color: #10b981; background: #111827; }
    .legend-color.complete { border-color: #3b82f6; background: #0f172a; }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    
    function getImageUrlForKey(key) {
      const entry = registry[key];
      const custom = entry?.imageUrl?.trim();
      if (custom) return custom;
      return IMAGE_LOOKUP[key] || '';
    }
    
    // Registry data (loaded from localStorage or empty)
    let registry = {};
    
    // ============================================
    // INITIALIZATION
    // ============================================
    
    function init() {
      loadFromLocal();
      buildGrid();
      updateStats();
    }
    
    function loadFromLocal() {
      const saved = localStorage.getItem('kellyAvatarRegistry');
      registry = saved ? JSON.parse(saved) : {};
      
      PERSONAS.forEach(persona => {
        AGE_BUCKETS.forEach(age => {
          const key = `${persona.id}_${age.id}`;
          if (!registry[key]) {
            registry[key] = {
              personaId: persona.id,
              ageBucket: age.id,
              avatarId: DEFAULT_AVATAR_IDS[key] || '',
              motionPrompt: DEFAULT_PROMPTS[persona.id] || '',
              imageUrl: IMAGE_LOOKUP[key] || '',
              clips: { intro: false, main: false, outro: false }
            };
            return;
          }
          
          registry[key].personaId = registry[key].personaId || persona.id;
          registry[key].ageBucket = registry[key].ageBucket || age.id;
          registry[key].avatarId = registry[key].avatarId || DEFAULT_AVATAR_IDS[key] || '';
          registry[key].motionPrompt = registry[key].motionPrompt || DEFAULT_PROMPTS[persona.id] || '';
          registry[key].imageUrl = registry[key].imageUrl || IMAGE_LOOKUP[key] || '';
          if (!registry[key].clips) {
            registry[key].clips = { intro: false, main: false, outro: false };
          } else {
            registry[key].clips.intro = Boolean(registry[key].clips.intro);
            registry[key].clips.main = Boolean(registry[key].clips.main);
            registry[key].clips.outro = Boolean(registry[key].clips.outro);
          }
        });
      });
    }
    
    function saveToLocal() {
      // Collect current values from inputs
      document.querySelectorAll('.avatar-cell').forEach(cell => {
        const key = cell.dataset.key;
        if (key && registry[key]) {
          const idInput = cell.querySelector('.id-input');
          const promptInput = cell.querySelector('.prompt-input');
          const imageInput = cell.querySelector('.image-input');
          if (idInput) registry[key].avatarId = idInput.value;
          if (promptInput) registry[key].motionPrompt = promptInput.value;
          if (imageInput) registry[key].imageUrl = imageInput.value.trim();
        }
      });
      
      localStorage.setItem('kellyAvatarRegistry', JSON.stringify(registry));
      alert('Saved to localStorage!');
      updateStats();
      buildGrid(); // Refresh to update visual states
    }
    
    // ============================================
    // BUILD GRID
    // ============================================
    
    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      // Header row
      grid.innerHTML += '<div class="header-cell">Age / Persona</div>';
      PERSONAS.forEach(p => {
        grid.innerHTML += `<div class="header-cell">${p.icon}<br>${p.name}</div>`;
      });
      
      // Data rows
      AGE_BUCKETS.forEach(age => {
        // Row header
        grid.innerHTML += `<div class="row-header">${age.name}<br><small>${age.range}</small></div>`;
        
        // Cells
        PERSONAS.forEach(persona => {
          const key = `${persona.id}_${age.id}`;
          const data = registry[key] || {};
          const hasId = data.avatarId && data.avatarId.length > 10;
          const clipsComplete = data.clips?.intro && data.clips?.main && data.clips?.outro;
          const customImage = (data.imageUrl || '').trim();
          const imageUrl = getImageUrlForKey(key);
          const hasImage = Boolean(imageUrl);
          const safeImageUrl = escapeHtml(imageUrl);
          const safeAvatarId = escapeHtml(data.avatarId || '');
          const safePrompt = escapeHtml(data.motionPrompt || '');
          const safeCustomImage = escapeHtml(customImage);
          const personaAgeLabel = escapeHtml(`${persona.name} (${age.name})`);
          const imageSection = hasImage
            ? `<div class="avatar-media">
                <img class="avatar-img" src="${safeImageUrl}" alt="${personaAgeLabel}" loading="lazy" onerror="showImagePlaceholder(this)">
                <div class="avatar-placeholder hidden">Image failed to load</div>
               </div>`
            : `<div class="avatar-media">
                <div class="avatar-placeholder">Image coming soon</div>
               </div>`;
          const imageMeta = `
            <div class="image-meta">
              <span>${hasImage ? (customImage ? 'Custom image' : 'Default image') : 'No image yet'}</span>
              <div class="micro-actions">
                ${customImage ? `<button type="button" class="micro-button" onclick="resetImageToDefault('${key}')">Use default</button>` : ''}
                ${hasImage ? `<button type="button" class="micro-button" onclick="copyImageUrl('${key}')">Copy URL</button>` : ''}
              </div>
            </div>`;
          
          grid.innerHTML += `
            <div class="avatar-cell ${hasId ? 'has-id' : ''} ${clipsComplete ? 'complete' : ''}" data-key="${key}">
              ${imageSection}
              ${imageMeta}
              <input type="text" class="image-input" placeholder="Paste custom image URL (optional)"
                     value="${safeCustomImage}"
                     onchange="updateCell('${key}', 'imageUrl', this.value.trim())">
              <input type="text" class="id-input" placeholder="Avatar ID" 
                     value="${safeAvatarId}" 
                     onchange="updateCell('${key}', 'avatarId', this.value)">
              <textarea class="prompt-input" placeholder="Motion prompt..."
                        onchange="updateCell('${key}', 'motionPrompt', this.value)">${safePrompt}</textarea>
              <div class="clips">
                <div class="clip ${data.clips?.intro ? 'done' : ''}" onclick="toggleClip('${key}', 'intro')" title="Intro clip">1</div>
                <div class="clip ${data.clips?.main ? 'done' : ''}" onclick="toggleClip('${key}', 'main')" title="Main clip">2</div>
                <div class="clip ${data.clips?.outro ? 'done' : ''}" onclick="toggleClip('${key}', 'outro')" title="Outro clip">3</div>
              </div>
            </div>
          `;
        });
      });
    }
    
    function updateCell(key, field, value) {
      if (!registry[key]) registry[key] = {};
      registry[key][field] = value;
      if (field === 'imageUrl') {
        buildGrid();
      }
      updateStats();
    }
    
    function toggleClip(key, clipType) {
      if (!registry[key]) registry[key] = {};
      if (!registry[key].clips) registry[key].clips = { intro: false, main: false, outro: false };
      registry[key].clips[clipType] = !registry[key].clips[clipType];
      buildGrid();
      updateStats();
    }
    
    function showImagePlaceholder(img) {
      if (!img) return;
      img.style.display = 'none';
      const placeholder = img.nextElementSibling;
      if (placeholder && placeholder.classList.contains('avatar-placeholder')) {
        placeholder.classList.remove('hidden');
        placeholder.textContent = 'Image failed to load';
      }
    }
    
    function resetImageToDefault(key) {
      if (!IMAGE_LOOKUP[key]) {
        alert('No default image available for this persona yet.');
        return;
      }
      if (!registry[key]) registry[key] = {};
      registry[key].imageUrl = '';
      buildGrid();
      updateStats();
    }
    
    function copyImageUrl(key) {
      const url = getImageUrlForKey(key);
      if (!url) {
        alert('No image URL to copy yet!');
        return;
      }
      navigator.clipboard.writeText(url).then(() => {
        alert(`Copied image URL for ${key}!`);
      }).catch(err => {
        alert('Failed to copy: ' + err.message);
      });
    }
    
    // ============================================
    // STATS
    // ============================================
    
    function updateStats() {
      const total = 60;
      let withId = 0;
      let withPrompt = 0;
      let clipsComplete = 0;
      let totalClips = 0;
      let withImage = 0;
      
      Object.values(registry).forEach(r => {
        if (r.avatarId && r.avatarId.length > 10) withId++;
        if (r.motionPrompt && r.motionPrompt.length > 20) withPrompt++;
        if (r.clips?.intro) totalClips++;
        if (r.clips?.main) totalClips++;
        if (r.clips?.outro) totalClips++;
        if (r.clips?.intro && r.clips?.main && r.clips?.outro) clipsComplete++;
        if (getImageUrlForKey(`${r.personaId || ''}_${r.ageBucket || ''}`)) withImage++;
      });
      
      document.getElementById('stats').innerHTML = `
        <strong>Progress:</strong>
        Avatar IDs: ${withId}/${total} |
        Avatar Images: ${withImage}/${total} |
        Motion Prompts: ${withPrompt}/${total} |
        Complete (3 clips): ${clipsComplete}/${total} |
        Total Clips: ${totalClips}/${total * 3}
      `;
    }
    
    // ============================================
    // EXPORT/IMPORT
    // ============================================
    
    function exportJSON() {
      saveToLocal(); // Make sure we have latest
      const blob = new Blob([JSON.stringify(registry, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kelly-avatar-registry.json';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function importJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          registry = JSON.parse(text);
          localStorage.setItem('kellyAvatarRegistry', JSON.stringify(registry));
          buildGrid();
          updateStats();
          alert('Import successful!');
        } catch (err) {
          alert('Failed to import: ' + err.message);
        }
      };
      input.click();
    }
    
    function copyAllIds() {
      const ids = Object.entries(registry)
        .filter(([k, v]) => v.avatarId && v.avatarId.length > 10)
        .map(([k, v]) => `${k}: ${v.avatarId}`)
        .join('\n');
      
      if (!ids) {
        alert('No avatar IDs to copy yet!');
        return;
      }
      
      navigator.clipboard.writeText(ids).then(() => {
        alert('Copied ' + ids.split('\n').length + ' avatar IDs to clipboard!');
      }).catch(err => {
        alert('Failed to copy: ' + err.message);
      });
    }
    
    // ============================================
    // INIT
    // ============================================
    
    init();
  </script>
