<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions — Curious Kelly Admin</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #111113;
            --bg-elevated: #18181b;
            --bg-card: #1c1c1f;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --border-color: #27272a;
            --border-hover: #3f3f46;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 1.2rem;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .back-link:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        h1 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Main layout */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Stats bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .stat-card.new .stat-value { color: var(--accent-primary); }
        .stat-card.reviewed .stat-value { color: var(--success); }
        .stat-card.files .stat-value { color: var(--warning); }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }

        .filter-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }

        /* Submissions list */
        .submissions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .submission-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .submission-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .submission-card.expanded {
            border-color: var(--accent-primary);
        }

        .submission-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .submission-meta {
            flex: 1;
        }

        .submission-name {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .submission-email {
            color: var(--accent-primary);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .submission-source {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .submission-preview {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .submission-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-new {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-primary);
        }

        .badge-reviewed {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .badge-replied {
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
        }

        .badge-files {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .submission-time {
            color: var(--text-muted);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        /* Expanded submission */
        .submission-details {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .submission-card.expanded .submission-details {
            display: block;
        }

        .submission-message {
            background: var(--bg-elevated);
            border-radius: 8px;
            padding: 16px;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .attachments-section {
            margin-top: 20px;
        }

        .attachments-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .attachments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .attachment-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .attachment-card:hover {
            border-color: var(--accent-primary);
            background: var(--accent-glow);
        }

        .attachment-icon {
            font-size: 1.5rem;
        }

        .attachment-info {
            flex: 1;
            min-width: 0;
        }

        .attachment-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .attachment-size {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .submission-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
        }

        /* Error state */
        .error-state {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: var(--error);
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .submission-header {
                flex-direction: column;
            }

            .submission-badges {
                margin-top: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="/admin/" class="back-link">←</a>
            <h1>📬 Submissions</h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="loadSubmissions()">
                🔄 Refresh
            </button>
        </div>
    </header>

    <main>
        <div class="stats-bar">
            <div class="stat-card new">
                <div class="stat-label">New</div>
                <div class="stat-value" id="stat-new">-</div>
            </div>
            <div class="stat-card reviewed">
                <div class="stat-label">Reviewed</div>
                <div class="stat-value" id="stat-reviewed">-</div>
            </div>
            <div class="stat-card files">
                <div class="stat-label">With Files</div>
                <div class="stat-value" id="stat-files">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="stat-total">-</div>
            </div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="new">🔵 New</button>
            <button class="filter-btn" data-filter="reviewed">✅ Reviewed</button>
            <button class="filter-btn" data-filter="replied">💬 Replied</button>
            <button class="filter-btn" data-filter="has-files">📎 Has Files</button>
        </div>

        <div id="submissions-container">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading submissions...</p>
            </div>
        </div>
    </main>

    <script>
        // Supabase config - using anon key for read access
        const SUPABASE_URL = 'https://trmaeodthlywcjwcayvs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRybWFlb2R0aGx5d2Nqd2NheXZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzI4MjU1NjAsImV4cCI6MjA0ODQwMTU2MH0.v90GYZ138AGELnxLF2kFLer8JofeOmr6wNqZArJz5Lk';

        let submissions = [];
        let currentFilter = 'all';

        async function loadSubmissions() {
            const container = document.getElementById('submissions-container');
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading submissions...</p>
                </div>
            `;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/contact_submissions?select=*&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load submissions');
                }

                submissions = await response.json();
                updateStats();
                renderSubmissions();

            } catch (error) {
                console.error('Error loading submissions:', error);
                container.innerHTML = `
                    <div class="error-state">
                        <p>⚠️ Failed to load submissions. Make sure you're authenticated.</p>
                        <p style="font-size: 0.85rem; margin-top: 8px;">${error.message}</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            const newCount = submissions.filter(s => s.status === 'new').length;
            const reviewedCount = submissions.filter(s => s.status === 'reviewed').length;
            const filesCount = submissions.filter(s => s.attachments && s.attachments.length > 0).length;

            document.getElementById('stat-new').textContent = newCount;
            document.getElementById('stat-reviewed').textContent = reviewedCount;
            document.getElementById('stat-files').textContent = filesCount;
            document.getElementById('stat-total').textContent = submissions.length;
        }

        function renderSubmissions() {
            const container = document.getElementById('submissions-container');
            
            let filtered = submissions;
            if (currentFilter === 'new') {
                filtered = submissions.filter(s => s.status === 'new');
            } else if (currentFilter === 'reviewed') {
                filtered = submissions.filter(s => s.status === 'reviewed');
            } else if (currentFilter === 'replied') {
                filtered = submissions.filter(s => s.status === 'replied');
            } else if (currentFilter === 'has-files') {
                filtered = submissions.filter(s => s.attachments && s.attachments.length > 0);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h2>No submissions yet</h2>
                        <p>Submissions from contact forms will appear here.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="submissions-list">
                    ${filtered.map(s => renderSubmissionCard(s)).join('')}
                </div>
            `;
        }

        function renderSubmissionCard(submission) {
            const hasFiles = submission.attachments && submission.attachments.length > 0;
            const timeAgo = getTimeAgo(new Date(submission.created_at));
            
            const statusBadge = {
                'new': '<span class="badge badge-new">New</span>',
                'reviewed': '<span class="badge badge-reviewed">Reviewed</span>',
                'replied': '<span class="badge badge-replied">Replied</span>',
            }[submission.status] || '';

            const filesBadge = hasFiles 
                ? `<span class="badge badge-files">📎 ${submission.attachments.length} file${submission.attachments.length > 1 ? 's' : ''}</span>`
                : '';

            const attachmentsHtml = hasFiles ? `
                <div class="attachments-section">
                    <div class="attachments-title">📁 Attachments</div>
                    <div class="attachments-grid">
                        ${submission.attachments.map(att => `
                            <a href="${att.public_url}" target="_blank" class="attachment-card">
                                <span class="attachment-icon">${getFileIcon(att.filename)}</span>
                                <div class="attachment-info">
                                    <div class="attachment-name">${escapeHtml(att.filename)}</div>
                                    <div class="attachment-size">${formatFileSize(att.size_bytes)}</div>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            return `
                <div class="submission-card" data-id="${submission.id}" onclick="toggleSubmission('${submission.id}')">
                    <div class="submission-header">
                        <div class="submission-meta">
                            <div class="submission-name">
                                ${escapeHtml(submission.name)}
                            </div>
                            <div class="submission-email">${escapeHtml(submission.email)}</div>
                            <div class="submission-source">
                                From: ${escapeHtml(submission.source || 'Unknown')} • ${timeAgo}
                            </div>
                        </div>
                        <div class="submission-badges">
                            ${statusBadge}
                            ${filesBadge}
                        </div>
                    </div>
                    <div class="submission-preview">${escapeHtml(submission.message)}</div>
                    <div class="submission-details">
                        <div class="submission-message">${escapeHtml(submission.message)}</div>
                        ${attachmentsHtml}
                        <div class="submission-actions">
                            <a href="mailto:${escapeHtml(submission.email)}?subject=Re: Your submission to Curious Kelly" class="btn btn-primary">
                                ✉️ Reply
                            </a>
                            <button class="btn btn-secondary" onclick="markReviewed('${submission.id}', event)">
                                ✅ Mark Reviewed
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleSubmission(id) {
            const card = document.querySelector(`.submission-card[data-id="${id}"]`);
            card.classList.toggle('expanded');
        }

        async function markReviewed(id, event) {
            event.stopPropagation();
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/contact_submissions?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        status: 'reviewed',
                        reviewed_at: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    // Update local data and re-render
                    const submission = submissions.find(s => s.id === id);
                    if (submission) {
                        submission.status = 'reviewed';
                        submission.reviewed_at = new Date().toISOString();
                    }
                    updateStats();
                    renderSubmissions();
                }
            } catch (error) {
                console.error('Error updating submission:', error);
            }
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📄',
                'png': '🖼️',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'gif': '🖼️',
                'webp': '🖼️',
                'zip': '📦',
                'fbx': '🎮',
                'obj': '🎮',
                'blend': '🎮',
                'psd': '🎨',
                'ai': '🎨',
            };
            return icons[ext] || '📎';
        }

        function formatFileSize(bytes) {
            if (!bytes) return 'Unknown';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
            return date.toLocaleDateString();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderSubmissions();
            });
        });

        // Initial load
        loadSubmissions();
    </script>
</body>
</html>
