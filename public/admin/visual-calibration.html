<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Calibration - Kelly Phase Alignment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a; 
      color: #fff;
      min-height: 100vh;
    }
    
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 20px 32px;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header h1 { font-size: 24px; margin-bottom: 8px; }
    .header p { color: #888; font-size: 14px; }
    
    .stats-bar {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    
    .stat {
      background: rgba(255,255,255,0.05);
      padding: 12px 20px;
      border-radius: 8px;
    }
    
    .stat-value { font-size: 24px; font-weight: 600; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    
    .filters {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #444;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    
    .filter-btn:hover { border-color: #666; }
    .filter-btn.active { background: #4CAF50; border-color: #4CAF50; }
    
    .main-content {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: calc(100vh - 180px);
    }
    
    .visual-grid {
      padding: 24px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      align-content: start;
    }
    
    .visual-card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    
    .visual-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .visual-card.selected { border-color: #FFD700; }
    .visual-card.approved { border-color: #4CAF50; }
    .visual-card.rejected { border-color: #f44336; opacity: 0.6; }
    
    .visual-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #222;
    }
    
    .visual-card-info {
      padding: 12px;
    }
    
    .visual-card-day { font-size: 11px; color: #888; }
    .visual-card-phase { 
      font-size: 14px; 
      font-weight: 600;
      text-transform: capitalize;
    }
    
    .phase-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 8px;
    }
    
    .phase-hook { background: #FF6B6B; }
    .phase-cliff { background: #845EC2; }
    .phase-q1, .phase-q2, .phase-q3 { background: #00C9A7; }
    .phase-wisdom { background: #FFD93D; color: #000; }
    .phase-outro { background: #4D8076; }
    
    .calibration-rating {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    
    .rating-star {
      width: 16px;
      height: 16px;
      background: #333;
      border-radius: 2px;
    }
    
    .rating-star.filled { background: #FFD700; }
    
    /* Detail Panel */
    .detail-panel {
      background: #111;
      border-left: 1px solid #333;
      padding: 24px;
      overflow-y: auto;
    }
    
    .detail-panel.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
    }
    
    .detail-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
      background: #222;
    }
    
    .detail-meta {
      margin-top: 16px;
    }
    
    .detail-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .detail-topic { color: #888; font-size: 14px; margin-bottom: 16px; }
    
    .calibration-section {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    
    .calibration-section h3 {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
    }
    
    .phase-fit-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    
    .phase-fit-btn {
      padding: 12px 8px;
      border-radius: 8px;
      border: 2px solid #333;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
      transition: all 0.2s;
    }
    
    .phase-fit-btn:hover { border-color: #555; }
    .phase-fit-btn.selected { border-color: #4CAF50; background: rgba(76, 175, 80, 0.2); }
    
    .phase-fit-btn .emoji { font-size: 20px; display: block; margin-bottom: 4px; }
    
    .kelly-interaction {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .kelly-option {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #333;
      background: transparent;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    
    .kelly-option:hover { border-color: #555; }
    .kelly-option.selected { border-color: #845EC2; background: rgba(132, 94, 194, 0.2); }
    
    .kelly-option strong { display: block; margin-bottom: 4px; }
    .kelly-option span { font-size: 12px; color: #888; }
    
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    
    .action-btn {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn.approve { background: #4CAF50; color: #fff; }
    .action-btn.reject { background: #f44336; color: #fff; }
    .action-btn.skip { background: #333; color: #fff; }
    
    .action-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    
    .notes-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      margin-top: 12px;
      resize: vertical;
      min-height: 80px;
    }
    
    .keyboard-hint {
      margin-top: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      font-size: 12px;
      color: #666;
    }
    
    .keyboard-hint kbd {
      background: #333;
      padding: 2px 6px;
      border-radius: 4px;
      margin: 0 2px;
    }
    
    .progress-indicator {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 Visual Calibration Studio</h1>
    <p>Review visuals for phase alignment and Kelly interaction potential</p>
    
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Visuals</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-reviewed">0</div>
        <div class="stat-label">Reviewed</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-approved">0</div>
        <div class="stat-label">Approved</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-rejected">0</div>
        <div class="stat-label">Rejected</div>
      </div>
    </div>
    
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="approved">Approved</button>
      <button class="filter-btn" data-filter="rejected">Rejected</button>
      <span style="margin-left: 16px; color: #555;">|</span>
      <button class="filter-btn" data-phase="hook">Hook</button>
      <button class="filter-btn" data-phase="cliff">Cliff</button>
      <button class="filter-btn" data-phase="q1">Q1</button>
      <button class="filter-btn" data-phase="q2">Q2</button>
      <button class="filter-btn" data-phase="q3">Q3</button>
      <button class="filter-btn" data-phase="wisdom">Wisdom</button>
      <button class="filter-btn" data-phase="outro">Outro</button>
    </div>
  </div>
  
  <div class="main-content">
    <div class="visual-grid" id="visual-grid">
      <!-- Visuals loaded dynamically -->
    </div>
    
    <div class="detail-panel empty" id="detail-panel">
      <p>Select a visual to calibrate</p>
    </div>
  </div>
  
  <div class="progress-indicator" id="progress">
    Press <kbd>→</kbd> to navigate, <kbd>A</kbd> approve, <kbd>R</kbd> reject
  </div>

  <script>
    const SUPABASE_URL = 'https://tvjalxxsyryjphkforjv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2amFseHhzeXJ5anBoa2Zvcmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NjM5MTksImV4cCI6MjA3OTEzOTkxOX0.VFrBs9sWkIgfFNpavQHxo0vSy6tkICpSbuj_TWvGHxI';
    
    let visuals = [];
    let selectedIndex = -1;
    let calibrationData = JSON.parse(localStorage.getItem('visual-calibration') || '{}');
    let currentFilter = 'all';
    let currentPhase = null;
    
    const PHASE_PURPOSE = {
      hook: { emoji: '🎬', goal: 'Spark curiosity', kelly: 'Look at this...' },
      cliff: { emoji: '🔀', goal: 'Create tension', kelly: 'Which path calls to you?' },
      q1: { emoji: '💡', goal: 'Build foundation', kelly: 'Notice how...' },
      q2: { emoji: '💡', goal: 'Deepen insight', kelly: 'See this detail...' },
      q3: { emoji: '💡', goal: 'Surprise & wonder', kelly: 'Here\'s the twist...' },
      wisdom: { emoji: '✨', goal: 'Inspire connection', kelly: 'Remember this feeling...' },
      outro: { emoji: '🎉', goal: 'Celebrate', kelly: 'You did it!' }
    };
    
    async function loadVisuals() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/visual_commons?style=eq.blast-v1&order=day_number,phase&select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      visuals = await res.json();
      renderGrid();
      updateStats();
    }
    
    function getCalibration(id) {
      return calibrationData[id] || { status: 'pending', phaseFit: 0, kellyMode: null, notes: '' };
    }
    
    function saveCalibration(id, data) {
      calibrationData[id] = { ...getCalibration(id), ...data };
      localStorage.setItem('visual-calibration', JSON.stringify(calibrationData));
      updateStats();
    }
    
    function filterVisuals() {
      return visuals.filter(v => {
        const cal = getCalibration(v.id);
        if (currentFilter !== 'all' && cal.status !== currentFilter) return false;
        if (currentPhase && v.phase !== currentPhase) return false;
        return true;
      });
    }
    
    function renderGrid() {
      const grid = document.getElementById('visual-grid');
      const filtered = filterVisuals();
      
      grid.innerHTML = filtered.map((v, i) => {
        const cal = getCalibration(v.id);
        const phaseInfo = PHASE_PURPOSE[v.phase] || {};
        return `
          <div class="visual-card ${cal.status} ${selectedIndex === visuals.indexOf(v) ? 'selected' : ''}" 
               data-index="${visuals.indexOf(v)}" onclick="selectVisual(${visuals.indexOf(v)})">
            <img src="${v.public_url}" alt="Day ${v.day_number} ${v.phase}" loading="lazy">
            <div class="visual-card-info">
              <div class="visual-card-day">Day ${v.day_number}</div>
              <div class="visual-card-phase">
                ${v.phase}
                <span class="phase-badge phase-${v.phase}">${phaseInfo.emoji || ''}</span>
              </div>
              <div class="calibration-rating">
                ${[1,2,3,4,5].map(n => `<div class="rating-star ${n <= cal.phaseFit ? 'filled' : ''}"></div>`).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    function selectVisual(index) {
      selectedIndex = index;
      renderGrid();
      renderDetailPanel();
    }
    
    function renderDetailPanel() {
      const panel = document.getElementById('detail-panel');
      
      if (selectedIndex < 0 || selectedIndex >= visuals.length) {
        panel.className = 'detail-panel empty';
        panel.innerHTML = '<p>Select a visual to calibrate</p>';
        return;
      }
      
      const v = visuals[selectedIndex];
      const cal = getCalibration(v.id);
      const phaseInfo = PHASE_PURPOSE[v.phase] || {};
      
      panel.className = 'detail-panel';
      panel.innerHTML = `
        <img src="${v.public_url}" class="detail-image" alt="">
        
        <div class="detail-meta">
          <div class="detail-title">Day ${v.day_number}: ${v.phase.toUpperCase()}</div>
          <div class="detail-topic">${v.topic}</div>
        </div>
        
        <div class="calibration-section">
          <h3>Phase Purpose: ${phaseInfo.goal}</h3>
          <p style="color: #888; font-size: 13px; margin-bottom: 12px;">
            Kelly says: "${phaseInfo.kelly}"
          </p>
        </div>
        
        <div class="calibration-section">
          <h3>Phase Fit Rating</h3>
          <div class="phase-fit-grid">
            ${[1,2,3,4,5].map(n => `
              <button class="phase-fit-btn ${cal.phaseFit === n ? 'selected' : ''}" onclick="setPhaseFit(${n})">
                <span class="emoji">${['😕','🤔','👍','👏','🤩'][n-1]}</span>
                ${n}
              </button>
            `).join('')}
          </div>
        </div>
        
        <div class="calibration-section">
          <h3>Kelly Interaction Mode</h3>
          <div class="kelly-interaction">
            <button class="kelly-option ${cal.kellyMode === 'direct' ? 'selected' : ''}" onclick="setKellyMode('direct')">
              <strong>🎯 Direct Reference</strong>
              <span>"Look at this..." - Kelly points to specific elements</span>
            </button>
            <button class="kelly-option ${cal.kellyMode === 'ambient' ? 'selected' : ''}" onclick="setKellyMode('ambient')">
              <strong>🌅 Ambient Scene</strong>
              <span>Visual sets the mood, Kelly doesn't reference directly</span>
            </button>
            <button class="kelly-option ${cal.kellyMode === 'none' ? 'selected' : ''}" onclick="setKellyMode('none')">
              <strong>🚫 Not Usable</strong>
              <span>Doesn't fit this phase, regenerate needed</span>
            </button>
          </div>
        </div>
        
        <textarea class="notes-input" placeholder="Calibration notes (optional)..." 
                  onchange="setNotes(this.value)">${cal.notes || ''}</textarea>
        
        <div class="action-buttons">
          <button class="action-btn reject" onclick="reject()">✗ Reject</button>
          <button class="action-btn skip" onclick="skip()">Skip</button>
          <button class="action-btn approve" onclick="approve()">✓ Approve</button>
        </div>
        
        <div class="keyboard-hint">
          <kbd>←</kbd> <kbd>→</kbd> Navigate &nbsp;
          <kbd>1-5</kbd> Phase fit &nbsp;
          <kbd>A</kbd> Approve &nbsp;
          <kbd>R</kbd> Reject
        </div>
      `;
    }
    
    function setPhaseFit(rating) {
      const v = visuals[selectedIndex];
      saveCalibration(v.id, { phaseFit: rating });
      renderDetailPanel();
      renderGrid();
    }
    
    function setKellyMode(mode) {
      const v = visuals[selectedIndex];
      saveCalibration(v.id, { kellyMode: mode });
      renderDetailPanel();
    }
    
    function setNotes(notes) {
      const v = visuals[selectedIndex];
      saveCalibration(v.id, { notes });
    }
    
    function approve() {
      const v = visuals[selectedIndex];
      saveCalibration(v.id, { status: 'approved' });
      nextVisual();
    }
    
    function reject() {
      const v = visuals[selectedIndex];
      saveCalibration(v.id, { status: 'rejected' });
      nextVisual();
    }
    
    function skip() {
      nextVisual();
    }
    
    function nextVisual() {
      const filtered = filterVisuals();
      const currentInFiltered = filtered.findIndex(v => visuals.indexOf(v) === selectedIndex);
      if (currentInFiltered < filtered.length - 1) {
        selectVisual(visuals.indexOf(filtered[currentInFiltered + 1]));
      }
      renderGrid();
    }
    
    function prevVisual() {
      const filtered = filterVisuals();
      const currentInFiltered = filtered.findIndex(v => visuals.indexOf(v) === selectedIndex);
      if (currentInFiltered > 0) {
        selectVisual(visuals.indexOf(filtered[currentInFiltered - 1]));
      }
    }
    
    function updateStats() {
      const total = visuals.length;
      let reviewed = 0, approved = 0, rejected = 0;
      
      visuals.forEach(v => {
        const cal = getCalibration(v.id);
        if (cal.status === 'approved') { approved++; reviewed++; }
        else if (cal.status === 'rejected') { rejected++; reviewed++; }
      });
      
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-reviewed').textContent = reviewed;
      document.getElementById('stat-approved').textContent = approved;
      document.getElementById('stat-rejected').textContent = rejected;
    }
    
    // Filter buttons
    document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderGrid();
      });
    });
    
    document.querySelectorAll('.filter-btn[data-phase]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) {
          btn.classList.remove('active');
          currentPhase = null;
        } else {
          document.querySelectorAll('.filter-btn[data-phase]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentPhase = btn.dataset.phase;
        }
        renderGrid();
      });
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA') return;
      
      switch(e.key) {
        case 'ArrowRight': nextVisual(); break;
        case 'ArrowLeft': prevVisual(); break;
        case 'a': case 'A': approve(); break;
        case 'r': case 'R': reject(); break;
        case '1': case '2': case '3': case '4': case '5':
          setPhaseFit(parseInt(e.key));
          break;
      }
    });
    
    // Export calibration data
    window.exportCalibration = () => {
      const data = JSON.stringify(calibrationData, null, 2);
      console.log(data);
      navigator.clipboard.writeText(data);
      alert('Calibration data copied to clipboard!');
    };
    
    // Initialize
    loadVisuals();
  </script>
</body>
</html>
