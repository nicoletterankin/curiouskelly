<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Commons Gallery - Curious Kelly</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header h1 span { color: #f0c674; }
        
        .stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        
        .stat {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ecdc4;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            gap: 4px;
        }
        
        .filter-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .filter-btn.active {
            background: #4ecdc4;
            color: #000;
        }
        
        select.filter-select {
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        
        .gallery {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .day-section {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, #4ecdc4, transparent);
            padding: 12px 20px;
            margin: 20px 0 10px;
            border-radius: 8px;
        }
        
        .day-section h2 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .day-section .topic {
            font-weight: normal;
            opacity: 0.8;
            font-size: 14px;
        }
        
        .visual-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .visual-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(78, 205, 196, 0.3);
        }
        
        .visual-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #222;
        }
        
        .visual-card img.loading {
            background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .visual-card img.error {
            background: #331111;
        }
        
        .visual-info {
            padding: 12px 16px;
        }
        
        .visual-phase {
            display: inline-block;
            background: #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .phase-hook { background: #e74c3c; }
        .phase-cliff { background: #9b59b6; }
        .phase-fact1, .phase-fact2, .phase-fact3 { background: #3498db; }
        .phase-quiz { background: #e67e22; }
        .phase-wisdom { background: #27ae60; }
        
        .visual-style {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 6px;
        }
        
        .visual-model {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 6px;
        }
        
        /* V2 Badge */
        .v2-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: linear-gradient(135deg, #4ECDC4, #27AE60);
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 10;
        }
        
        .v2-card {
            border: 2px solid #4ECDC4;
        }
        
        .visual-card {
            position: relative;
        }
        
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox-content {
            max-width: 90vw;
            max-height: 80vh;
            position: relative;
        }
        
        .lightbox-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
        }
        
        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
        }
        
        .lightbox-info {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            max-width: 800px;
        }
        
        .lightbox-prompt {
            font-size: 13px;
            opacity: 0.8;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        
        .loading-overlay.hidden { display: none; }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            opacity: 0.5;
        }
        
        .nav-arrows {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            width: calc(100% + 100px);
            left: -50px;
            pointer-events: none;
        }
        
        .nav-arrow {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s;
        }
        
        .nav-arrow:hover {
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
    </div>
    
    <header class="header">
        <h1>✨ Visual Commons <span>Gallery</span></h1>
        
        <div class="stats" id="stats">
            <div class="stat">
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label">Total Visuals</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat-days">-</div>
                <div class="stat-label">Days Covered</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat-styles">-</div>
                <div class="stat-label">Styles</div>
            </div>
        </div>
        
        <div class="filters">
            <div class="filter-group" id="version-filters">
                <button class="filter-btn" data-version="all">All</button>
                <button class="filter-btn active" data-version="v2">V2 Only ✨</button>
                <button class="filter-btn" data-version="v1">V1 (Old)</button>
            </div>
            
            <div class="filter-group" id="day-filters">
                <button class="filter-btn active" data-day="all">All Days</button>
            </div>
            
            <select class="filter-select" id="phase-filter">
                <option value="all">All Phases</option>
                <option value="hook">Hook</option>
                <option value="cliff">Cliff</option>
                <option value="q1">Q1</option>
                <option value="q2">Q2</option>
                <option value="q3">Q3</option>
                <option value="fact1">Fact 1</option>
                <option value="fact2">Fact 2</option>
                <option value="fact3">Fact 3</option>
                <option value="wisdom">Wisdom</option>
                <option value="outro">Outro</option>
            </select>
            
            <select class="filter-select" id="style-filter">
                <option value="all">All Styles</option>
            </select>
        </div>
    </header>
    
    <main class="gallery" id="gallery"></main>
    
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">×</button>
            <div class="nav-arrows">
                <button class="nav-arrow" onclick="navigateLightbox(-1)">←</button>
                <button class="nav-arrow" onclick="navigateLightbox(1)">→</button>
            </div>
            <img id="lightbox-img" src="" alt="">
            <div class="lightbox-info">
                <div><strong>Day:</strong> <span id="lb-day"></span> | <strong>Phase:</strong> <span id="lb-phase"></span> | <strong>Style:</strong> <span id="lb-style"></span></div>
                <div><strong>Model:</strong> <span id="lb-model"></span></div>
                <div style="margin-top:12px"><strong>Prompt:</strong></div>
                <div class="lightbox-prompt" id="lb-prompt"></div>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://tvjalxxsyryjphkforjv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2amFseHhzeXJ5anBoa2Zvcmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NjM5MTksImV4cCI6MjA3OTEzOTkxOX0.VFrBs9sWkIgfFNpavQHxo0vSy6tkICpSbuj_TWvGHxI';
        
        let allVisuals = [];
        let filteredVisuals = [];
        let currentLightboxIndex = 0;
        
        async function fetchVisuals() {
            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/visual_commons?status=eq.active&select=*&order=day_number.asc,phase.asc`,
                {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                }
            );
            return response.json();
        }
        
        function updateStats() {
            const days = [...new Set(allVisuals.map(v => v.day_number))];
            const styles = [...new Set(allVisuals.map(v => v.style))];
            
            document.getElementById('stat-total').textContent = allVisuals.length;
            document.getElementById('stat-days').textContent = days.length;
            document.getElementById('stat-styles').textContent = styles.length;
            
            // Populate day filter buttons
            const dayFilters = document.getElementById('day-filters');
            dayFilters.innerHTML = '<button class="filter-btn active" data-day="all">All</button>';
            days.forEach(day => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.day = day;
                btn.textContent = `Day ${day}`;
                btn.onclick = () => filterByDay(day);
                dayFilters.appendChild(btn);
            });
            
            // Populate style filter
            const styleFilter = document.getElementById('style-filter');
            styles.forEach(style => {
                const opt = document.createElement('option');
                opt.value = style;
                opt.textContent = style.charAt(0).toUpperCase() + style.slice(1);
                styleFilter.appendChild(opt);
            });
        }
        
        function filterByDay(day) {
            document.querySelectorAll('#day-filters .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.day === String(day));
            });
            applyFilters();
        }
        
        function applyFilters() {
            const versionFilter = document.querySelector('#version-filters .filter-btn.active')?.dataset.version || 'all';
            const dayFilter = document.querySelector('#day-filters .filter-btn.active').dataset.day;
            const phaseFilter = document.getElementById('phase-filter').value;
            const styleFilter = document.getElementById('style-filter').value;
            
            filteredVisuals = allVisuals.filter(v => {
                // Version filter
                if (versionFilter === 'v2' && v.style !== 'curious-kelly-v2') return false;
                if (versionFilter === 'v1' && v.style === 'curious-kelly-v2') return false;
                
                if (dayFilter !== 'all' && v.day_number !== parseInt(dayFilter)) return false;
                if (phaseFilter !== 'all' && v.phase !== phaseFilter) return false;
                if (styleFilter !== 'all' && v.style !== styleFilter) return false;
                return true;
            });
            
            renderGallery();
        }
        
        // Version filter click handlers
        document.getElementById('version-filters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('#version-filters .filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                applyFilters();
            }
        });
        
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            
            if (filteredVisuals.length === 0) {
                gallery.innerHTML = '<div class="empty-state">No visuals match your filters</div>';
                return;
            }
            
            let html = '';
            let currentDay = null;
            
            filteredVisuals.forEach((visual, index) => {
                if (visual.day_number !== currentDay) {
                    currentDay = visual.day_number;
                    html += `
                        <div class="day-section">
                            <h2>
                                Day ${visual.day_number}
                                <span class="topic">${visual.topic || ''}</span>
                            </h2>
                        </div>
                    `;
                }
                
                const modelShort = visual.model_used ? visual.model_used.replace('imagen-4.0-', '').replace('-generate-001', '').replace('gemini-2.0-flash-exp-image-generation', 'gemini-flash') : 'unknown';
                const isV2 = visual.style === 'curious-kelly-v2';
                
                html += `
                    <div class="visual-card ${isV2 ? 'v2-card' : ''}" onclick="openLightbox(${index})">
                        ${isV2 ? '<span class="v2-badge">V2 ✨</span>' : ''}
                        <img 
                            src="${visual.public_url}" 
                            alt="Day ${visual.day_number} - ${visual.phase}"
                            class="loading"
                            onload="this.classList.remove('loading')"
                            onerror="this.classList.add('error'); this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22225%22><rect fill=%22%23331111%22 width=%22400%22 height=%22225%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23aa5555%22 text-anchor=%22middle%22>Failed to load</text></svg>'"
                        >
                        <div class="visual-info">
                            <span class="visual-phase phase-${visual.phase}">${visual.phase}</span>
                            <span class="visual-style">${visual.style || 'default'}</span>
                            <div class="visual-model">${modelShort}</div>
                        </div>
                    </div>
                `;
            });
            
            gallery.innerHTML = html;
        }
        
        function openLightbox(index) {
            currentLightboxIndex = index;
            const visual = filteredVisuals[index];
            
            document.getElementById('lightbox-img').src = visual.public_url;
            document.getElementById('lb-day').textContent = visual.day_number;
            document.getElementById('lb-phase').textContent = visual.phase;
            document.getElementById('lb-style').textContent = visual.style || 'default';
            document.getElementById('lb-model').textContent = visual.model_used || 'unknown';
            document.getElementById('lb-prompt').textContent = visual.prompt_used || 'No prompt recorded';
            
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        function navigateLightbox(direction) {
            currentLightboxIndex = (currentLightboxIndex + direction + filteredVisuals.length) % filteredVisuals.length;
            openLightbox(currentLightboxIndex);
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });
        
        // Click outside to close
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });
        
        // Filter change listeners
        document.getElementById('phase-filter').addEventListener('change', applyFilters);
        document.getElementById('style-filter').addEventListener('change', applyFilters);
        document.querySelector('#day-filters .filter-btn').addEventListener('click', () => filterByDay('all'));
        
        // Initialize
        async function init() {
            try {
                allVisuals = await fetchVisuals();
                filteredVisuals = [...allVisuals];
                updateStats();
                renderGallery();
            } catch (err) {
                console.error('Failed to load visuals:', err);
                document.getElementById('gallery').innerHTML = `<div class="empty-state">Error loading visuals: ${err.message}</div>`;
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
        
        init();
    </script>
</body>
</html>
