<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #08090a;
            --bg-deep: #0d0e10;
            --bg-surface: #131517;
            --bg-elevated: #1a1c1f;
            --bg-hover: #22252a;
            --border-dim: #252830;
            --border-active: #3a3f4a;
            --text-bright: #f4f5f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-kelly: #3b82f6;
            --accent-kelly-glow: rgba(59, 130, 246, 0.15);
            --status-live: #22c55e;
            --status-live-bg: rgba(34, 197, 94, 0.1);
            --status-wip: #f59e0b;
            --status-wip-bg: rgba(245, 158, 11, 0.1);
            --status-broken: #ef4444;
            --status-broken-bg: rgba(239, 68, 68, 0.1);
            --status-test: #8b5cf6;
            --status-test-bg: rgba(139, 92, 246, 0.1);
            --status-mockup: #06b6d4;
            --status-mockup-bg: rgba(6, 182, 212, 0.1);
            --status-legacy: #6b7280;
            --status-legacy-bg: rgba(107, 114, 128, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-void);
            color: var(--text-bright);
            min-height: 100vh;
            line-height: 1.5;
        }
        
        /* Hero Header */
        .hero {
            background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-surface) 100%);
            border-bottom: 1px solid var(--border-dim);
            padding: 48px 32px;
        }
        
        .hero-content {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .hero h1 .sparkle { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 32px;
            margin-top: 32px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            border-radius: 12px;
            padding: 20px 28px;
            min-width: 160px;
        }
        
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 600;
        }
        
        .stat-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        
        .stat.live .stat-value { color: var(--status-live); }
        .stat.wip .stat-value { color: var(--status-wip); }
        .stat.broken .stat-value { color: var(--status-broken); }
        .stat.test .stat-value { color: var(--status-test); }
        
        /* Filters */
        .filters {
            max-width: 1600px;
            margin: 32px auto;
            padding: 0 32px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-dim);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        
        .filter-btn:hover { 
            border-color: var(--border-active); 
            color: var(--text-bright);
        }
        
        .filter-btn.active {
            background: var(--accent-kelly);
            border-color: var(--accent-kelly);
            color: white;
        }
        
        .search-box {
            flex: 1;
            min-width: 280px;
            background: var(--bg-surface);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-bright);
            font-size: 0.95rem;
            font-family: inherit;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--accent-kelly);
            box-shadow: 0 0 0 3px var(--accent-kelly-glow);
        }
        
        /* Main Table Container */
        .table-container {
            max-width: 1600px;
            margin: 0 auto 64px;
            padding: 0 32px;
        }
        
        .page-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        .page-table th {
            text-align: left;
            padding: 16px 12px;
            background: var(--bg-surface);
            border-bottom: 2px solid var(--border-dim);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .page-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-dim);
            vertical-align: top;
        }
        
        .page-table tr:hover td {
            background: var(--bg-hover);
        }
        
        /* Page Link */
        .page-link {
            color: var(--accent-kelly);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            transition: color 0.15s;
        }
        
        .page-link:hover {
            color: #60a5fa;
            text-decoration: underline;
        }
        
        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        .status-live { background: var(--status-live-bg); color: var(--status-live); }
        .status-live::before { background: var(--status-live); }
        
        .status-wip { background: var(--status-wip-bg); color: var(--status-wip); }
        .status-wip::before { background: var(--status-wip); }
        
        .status-broken { background: var(--status-broken-bg); color: var(--status-broken); }
        .status-broken::before { background: var(--status-broken); }
        
        .status-test { background: var(--status-test-bg); color: var(--status-test); }
        .status-test::before { background: var(--status-test); }
        
        .status-mockup { background: var(--status-mockup-bg); color: var(--status-mockup); }
        .status-mockup::before { background: var(--status-mockup); }
        
        .status-legacy { background: var(--status-legacy-bg); color: var(--status-legacy); }
        .status-legacy::before { background: var(--status-legacy); }
        
        /* Theme Tags */
        .theme-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            color: var(--text-secondary);
        }
        
        /* Type Tags */
        .type-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        /* Description */
        .page-desc {
            color: var(--text-secondary);
            font-size: 0.85rem;
            max-width: 400px;
        }
        
        /* Section Headers */
        .section-header {
            background: var(--bg-deep);
            padding: 20px 12px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-bright);
            border-bottom: 2px solid var(--accent-kelly);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .section-header .count {
            background: var(--bg-elevated);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        
        /* Footer */
        footer {
            background: var(--bg-surface);
            border-top: 1px solid var(--border-dim);
            padding: 24px 32px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        footer a {
            color: var(--accent-kelly);
            text-decoration: none;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .hero { padding: 32px 20px; }
            .hero h1 { font-size: 1.8rem; }
            .stats-bar { gap: 16px; }
            .stat { padding: 16px 20px; min-width: 140px; }
            .filters, .table-container { padding: 0 20px; }
            .page-table { font-size: 0.8rem; }
        }
        
        @media (max-width: 768px) {
            .page-table th:nth-child(4),
            .page-table td:nth-child(4),
            .page-table th:nth-child(5),
            .page-table td:nth-child(5) {
                display: none;
            }
        }
        
        /* Hidden rows */
        .page-table tr.hidden { display: none; }
        
        /* Expandable sections */
        .section-toggle {
            cursor: pointer;
            user-select: none;
        }
        
        .section-toggle:hover { background: var(--bg-hover); }
        
        .section-toggle .chevron {
            transition: transform 0.2s;
        }
        
        .section-toggle.collapsed .chevron {
            transform: rotate(-90deg);
        }
    </style>
</head>

// RENDER FUNCTIONS
// ============================================

function renderStats() {
    let counts = { live: 0, wip: 0, broken: 0, test: 0, mockup: 0, legacy: 0, total: 0 };
    
    PAGES.forEach(section => {
        section.pages.forEach(page => {
            counts.total++;
            counts[page.status]++;
        });
    });
    
    document.getElementById('statsBar').innerHTML = `
        <div class="stat"><div class="stat-value">${counts.total}</div><div class="stat-label">Total Pages</div></div>
        <div class="stat live"><div class="stat-value">${counts.live}</div><div class="stat-label">Live</div></div>
        <div class="stat wip"><div class="stat-value">${counts.wip}</div><div class="stat-label">Work in Progress</div></div>
        <div class="stat test"><div class="stat-value">${counts.test}</div><div class="stat-label">Test/Debug</div></div>
        <div class="stat" style="--stat-color: var(--status-mockup);"><div class="stat-value" style="color: var(--status-mockup);">${counts.mockup}</div><div class="stat-label">Mockups</div></div>
        <div class="stat" style="--stat-color: var(--status-legacy);"><div class="stat-value" style="color: var(--status-legacy);">${counts.legacy}</div><div class="stat-label">Legacy</div></div>
    `;
}

function renderTable(filter = 'all', search = '') {
    const tbody = document.getElementById('pageTableBody');
    let html = '';
    
    PAGES.forEach(section => {
        const filteredPages = section.pages.filter(page => {
            const matchesFilter = filter === 'all' || page.status === filter;
            const matchesSearch = search === '' || 
                page.path.toLowerCase().includes(search.toLowerCase()) ||
                page.desc.toLowerCase().includes(search.toLowerCase()) ||
                page.type.toLowerCase().includes(search.toLowerCase());
            return matchesFilter && matchesSearch;
        });
        
        if (filteredPages.length === 0) return;
        
        html += `
            <tr class="section-toggle" data-section="${section.section}">
                <td colspan="5" class="section-header">
                    <span class="chevron">▼</span>
                    ${section.section}
                    <span class="count">${filteredPages.length}</span>
                </td>
            </tr>
        `;
        
        filteredPages.forEach(page => {
            const isExternal = page.path.includes('daily-lesson-marketing') || 
                              page.path.includes('curious-kellly') ||
                              page.path.includes('tools/') ||
                              page.path.includes('scripts/') ||
                              page.path.includes('(root)');
            
            const displayPath = page.path.replace(' (root)', '');
            const href = isExternal ? '#' : displayPath;
            const linkClass = isExternal ? 'page-link external' : 'page-link previewable';
            const style = isExternal ? 'style="opacity: 0.5; cursor: default;"' : '';
            
            const escapedDesc = page.desc.replace(/'/g, "\\'");
            const clickHandler = isExternal ? '' : `onclick="event.preventDefault(); openPreview('${href}', '${page.type}', '${page.theme}', '${escapedDesc}')"`;
            
            html += `
                <tr data-status="${page.status}" data-section="${section.section}" data-path="${href}">
                    <td>
                        <a href="${href}" class="${linkClass}" ${style} ${clickHandler}>
                            ${displayPath}
                        </a>
                    </td>
                    <td><span class="status-badge status-${page.status}">${page.status}</span></td>
                    <td><span class="type-tag">${page.type}</span></td>
                    <td><span class="theme-tag">${page.theme}</span></td>
                    <td><span class="page-desc">${page.desc}</span></td>
                </tr>
            `;
        });
    });
    
    tbody.innerHTML = html;
    
    // Add section toggle handlers
    document.querySelectorAll('.section-toggle').forEach(toggle => {
        toggle.addEventListener('click', () => {
            const section = toggle.dataset.section;
            const rows = document.querySelectorAll(`tr[data-section="${section}"]:not(.section-toggle)`);
            const isCollapsed = toggle.classList.toggle('collapsed');
            rows.forEach(row => row.classList.toggle('hidden', isCollapsed));
        });
    });
}

// ============================================
// EVENT HANDLERS
// ============================================

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTable(btn.dataset.filter, document.getElementById('searchBox').value);
        setTimeout(enhanceTableRows, 50);
    });
});

document.getElementById('searchBox').addEventListener('input', (e) => {
    const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
    renderTable(activeFilter, e.target.value);
    setTimeout(enhanceTableRows, 50);
});

// ============================================
// PREVIEW DRAWER - VARIABLES (before render functions)
// ============================================
let currentPreviewPath = null;
let archiveDecisions = {};

// Load decisions from localStorage
try {
    const saved = localStorage.getItem('site_archive_decisions');
    if (saved) archiveDecisions = JSON.parse(saved);
} catch(e) {}

function openPreview(path, type, theme, desc) {
    currentPreviewPath = path;
    document.getElementById('drawerTitle').textContent = path;
    document.getElementById('drawerType').textContent = type || '';
    document.getElementById('drawerTheme').textContent = theme || '';
    document.getElementById('drawerDesc').textContent = desc || '';
    document.getElementById('previewIframe').src = path;
    document.getElementById('previewDrawer').classList.add('open');
}

function saveDecisions() {
    localStorage.setItem('site_archive_decisions', JSON.stringify(archiveDecisions));
}

function closeDrawer() {
    document.getElementById('previewDrawer').classList.remove('open');
    document.getElementById('previewIframe').src = '';
    currentPreviewPath = null;
}

function openExternal() {
    if (currentPreviewPath) {
        window.open(currentPreviewPath, '_blank');
    }
}

function markAs(decision) {
    if (!currentPreviewPath) return;
    archiveDecisions[currentPreviewPath] = decision;
    saveDecisions();
    
    // Update the row in the table
    const rows = document.querySelectorAll('tr[data-path="' + currentPreviewPath + '"]');
    rows.forEach(row => {
        row.setAttribute('data-decision', decision);
    });
    
    // Visual feedback
    const btns = document.querySelectorAll('.drawer-btn');
    btns.forEach(btn => btn.style.opacity = '0.5');
    event.target.style.opacity = '1';
    
    setTimeout(() => {
        btns.forEach(btn => btn.style.opacity = '1');
    }, 300);
}

// Add click handlers to previewable links
function enhanceTableRows() {
    document.querySelectorAll('.page-link.previewable').forEach(link => {
        const row = link.closest('tr');
        if (!row) return;
        
        const path = row.getAttribute('data-path');
        const type = row.getAttribute('data-type');
        const theme = row.getAttribute('data-theme');
        const desc = row.getAttribute('data-desc');
        
        // Apply saved decision
        if (archiveDecisions[path]) {
            row.setAttribute('data-decision', archiveDecisions[path]);
        }
        
        // Add click handler for preview
        link.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openPreview(path, type, theme, desc);
        });
    });
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    if (!document.getElementById('previewDrawer').classList.contains('open')) return;
    if (e.target.tagName === 'INPUT') return;
    
    switch(e.key.toLowerCase()) {
        case 'escape': closeDrawer(); break;
        case 'k': markAs('keep'); break;
        case 'a': markAs('archive'); break;
        case 'd': markAs('delete'); break;
    }
});

// ============================================
// INIT
// ============================================

document.getElementById('lastScan').textContent = new Date().toLocaleString();
renderStats();
renderTable();

// Wait for table to render, then enhance rows
setTimeout(enhanceTableRows, 100);
