<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Context Preview - Lesson Player Simulation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a; 
      color: #fff;
      min-height: 100vh;
    }
    
    /* Control Panel */
    .control-panel {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 30, 0.95);
      border-bottom: 1px solid #333;
      padding: 12px 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }
    
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .control-group label {
      font-size: 12px;
      color: #888;
    }
    
    .control-group select, .control-group input {
      background: #1a1a2e;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .phase-nav {
      display: flex;
      gap: 4px;
    }
    
    .phase-btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    
    .phase-btn:hover { background: #333; }
    .phase-btn.active { background: #4CAF50; border-color: #4CAF50; }
    .phase-btn.no-visual { opacity: 0.4; }
    
    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .status-badge.has-visual { background: #4CAF50; }
    .status-badge.no-visual { background: #f44336; }
    
    /* Lesson Player Simulation */
    .lesson-simulation {
      margin-top: 70px;
      height: calc(100vh - 70px);
      display: grid;
      grid-template-columns: 1fr 400px;
    }
    
    .player-area {
      position: relative;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    
    /* Kelly Avatar Placeholder */
    .kelly-avatar {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    .lesson-text {
      text-align: center;
      max-width: 500px;
    }
    
    .lesson-topic {
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
    }
    
    .lesson-script {
      font-size: 20px;
      line-height: 1.6;
      color: #fff;
    }
    
    /* Visual Display - simulating lesson-phase-visual */
    .visual-preview-slot {
      position: absolute;
      bottom: 180px;
      right: 20px;
      border: 3px dashed #444;
      border-radius: 12px;
      background: rgba(0,0,0,0.3);
      transition: all 0.3s;
    }
    
    .visual-preview-slot.has-visual {
      border-style: solid;
      border-color: #4CAF50;
    }
    
    .visual-preview-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9px;
    }
    
    .visual-preview-slot .no-visual-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #666;
      text-align: center;
      padding: 10px;
    }
    
    /* Size Toggle */
    .size-controls {
      position: absolute;
      bottom: 290px;
      right: 20px;
      display: flex;
      gap: 8px;
    }
    
    .size-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-size: 11px;
    }
    
    .size-btn.active { background: #4CAF50; border-color: #4CAF50; }
    
    /* Position Toggle */
    .position-controls {
      position: absolute;
      bottom: 320px;
      right: 20px;
      display: flex;
      gap: 8px;
    }
    
    .position-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-size: 11px;
    }
    
    .position-btn.active { background: #845EC2; border-color: #845EC2; }
    
    /* Info Panel */
    .info-panel {
      background: #111;
      border-left: 1px solid #333;
      padding: 20px;
      overflow-y: auto;
    }
    
    .info-section {
      margin-bottom: 24px;
    }
    
    .info-section h3 {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .visual-full {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #1a1a1a;
      margin-bottom: 12px;
    }
    
    .visual-full img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .visual-meta {
      font-size: 13px;
      color: #aaa;
    }
    
    .visual-meta p { margin: 8px 0; }
    .visual-meta strong { color: #fff; }
    
    .kelly-script-preview {
      background: rgba(132, 94, 194, 0.1);
      border: 1px solid rgba(132, 94, 194, 0.3);
      border-radius: 12px;
      padding: 16px;
    }
    
    .kelly-script-preview h4 {
      font-size: 12px;
      color: #845EC2;
      margin-bottom: 8px;
    }
    
    .kelly-script-preview p {
      font-size: 14px;
      line-height: 1.6;
      font-style: italic;
    }
    
    .action-btns {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .action-btn.regenerate { background: #FF6B6B; color: #fff; }
    .action-btn.approve { background: #4CAF50; color: #fff; }
    
    /* Mobile simulation */
    @media (max-width: 900px) {
      .lesson-simulation {
        grid-template-columns: 1fr;
      }
      .info-panel {
        border-left: none;
        border-top: 1px solid #333;
      }
    }
  </style>
</head>
<body>
  <div class="control-panel">
    <div class="control-group">
      <label>Day:</label>
      <input type="number" id="day-input" value="352" min="1" max="365" style="width: 70px;">
    </div>
    
    <div class="phase-nav" id="phase-nav">
      <button class="phase-btn active" data-phase="hook">🎬 Hook</button>
      <button class="phase-btn" data-phase="cliff">🔀 Cliff</button>
      <button class="phase-btn" data-phase="q1">💡 Q1</button>
      <button class="phase-btn" data-phase="q2">💡 Q2</button>
      <button class="phase-btn" data-phase="q3">💡 Q3</button>
      <button class="phase-btn" data-phase="wisdom">✨ Wisdom</button>
      <button class="phase-btn" data-phase="outro">🎉 Outro</button>
    </div>
    
    <div id="status-container">
      <span class="status-badge no-visual" id="visual-status">Loading...</span>
    </div>
    
    <div style="margin-left: auto; font-size: 12px; color: #666;">
      ⌨️ Arrow keys to navigate
    </div>
  </div>
  
  <div class="lesson-simulation">
    <div class="player-area">
      <div class="kelly-avatar">🧑‍🏫</div>
      
      <div class="lesson-text">
        <div class="lesson-topic" id="lesson-topic">Loading...</div>
        <div class="lesson-script" id="lesson-script">Loading lesson content...</div>
      </div>
      
      <div class="position-controls">
        <button class="position-btn active" data-pos="bottom-right">↘ Bottom Right</button>
        <button class="position-btn" data-pos="bottom-left">↙ Bottom Left</button>
        <button class="position-btn" data-pos="top-right">↗ Top Right</button>
      </div>
      
      <div class="size-controls">
        <button class="size-btn" data-size="small">S</button>
        <button class="size-btn active" data-size="medium">M</button>
        <button class="size-btn" data-size="large">L</button>
      </div>
      
      <div class="visual-preview-slot" id="visual-slot" style="width: 180px; height: 180px;">
        <img id="visual-img" src="" alt="" style="display: none;">
        <div class="no-visual-msg" id="no-visual-msg">No visual<br>for this phase</div>
      </div>
    </div>
    
    <div class="info-panel">
      <div class="info-section">
        <h3>Current Visual</h3>
        <div class="visual-full" id="visual-full">
          <img id="visual-full-img" src="" alt="">
        </div>
        <div class="visual-meta" id="visual-meta">
          <p><strong>Day:</strong> <span id="meta-day">-</span></p>
          <p><strong>Phase:</strong> <span id="meta-phase">-</span></p>
          <p><strong>Style:</strong> <span id="meta-style">-</span></p>
          <p><strong>Status:</strong> <span id="meta-status">-</span></p>
        </div>
      </div>
      
      <div class="info-section">
        <h3>Kelly's Visual Script</h3>
        <div class="kelly-script-preview">
          <h4>Phase: <span id="kelly-phase">Hook</span></h4>
          <p id="kelly-script">"Before we begin, take a look at this..."</p>
        </div>
      </div>
      
      <div class="info-section">
        <h3>Actions</h3>
        <div class="action-btns">
          <button class="action-btn regenerate" onclick="flagForRegeneration()">🔄 Flag Regen</button>
          <button class="action-btn approve" onclick="markApproved()">✓ Looks Good</button>
        </div>
      </div>
      
      <div class="info-section">
        <h3>Day Coverage</h3>
        <div id="day-coverage" style="font-size: 13px; color: #888;">
          Loading...
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tvjalxxsyryjphkforjv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2amFseHhzeXJ5anBoa2Zvcmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NjM5MTksImV4cCI6MjA3OTEzOTkxOX0.VFrBs9sWkIgfFNpavQHxo0vSy6tkICpSbuj_TWvGHxI';
    
    const PHASES = ['hook', 'cliff', 'q1', 'q2', 'q3', 'wisdom', 'outro'];
    
    const KELLY_SCRIPTS = {
      hook: ["Before we begin, take a look at this...", "See this? There's more to this story than you might think."],
      cliff: ["Two paths lie ahead. Which one calls to you?", "Here's where things get interesting..."],
      q1: ["Notice how this works...", "Let me show you something fascinating."],
      q2: ["Now look a little deeper...", "See how this connects?"],
      q3: ["Here's the part that surprises most people...", "This changes everything."],
      wisdom: ["Remember this feeling...", "This is what it all comes down to."],
      outro: ["You did it!", "Another lesson complete!"]
    };
    
    let currentDay = 352;
    let currentPhase = 'hook';
    let dayVisuals = {};
    
    async function loadLesson(dayNumber) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/core_lessons?day_number=eq.${dayNumber}&select=topic,hook_teaser`, {
          headers: { 'apikey': SUPABASE_KEY }
        });
        const data = await res.json();
        if (data?.[0]) {
          document.getElementById('lesson-topic').textContent = `Day ${dayNumber}: ${data[0].topic}`;
          document.getElementById('lesson-script').textContent = data[0].hook_teaser || 'Lesson content loading...';
        }
      } catch (e) {
        console.error('Failed to load lesson:', e);
      }
    }
    
    async function loadDayVisuals(dayNumber) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/visual_commons?day_number=eq.${dayNumber}&status=eq.active&select=phase,public_url,style`, {
          headers: { 'apikey': SUPABASE_KEY }
        });
        const data = await res.json();
        
        dayVisuals = {};
        data.forEach(v => {
          dayVisuals[v.phase] = v;
        });
        
        // Update phase buttons
        document.querySelectorAll('.phase-btn').forEach(btn => {
          const phase = btn.dataset.phase;
          if (dayVisuals[phase]) {
            btn.classList.remove('no-visual');
          } else {
            btn.classList.add('no-visual');
          }
        });
        
        // Update coverage
        const coverage = PHASES.map(p => dayVisuals[p] ? '✅' : '❌').join(' ');
        document.getElementById('day-coverage').innerHTML = `
          <p style="margin-bottom: 8px;">${coverage}</p>
          <p>${Object.keys(dayVisuals).length}/${PHASES.length} phases covered</p>
        `;
        
        updateVisualDisplay();
      } catch (e) {
        console.error('Failed to load visuals:', e);
      }
    }
    
    function updateVisualDisplay() {
      const visual = dayVisuals[currentPhase];
      const slot = document.getElementById('visual-slot');
      const img = document.getElementById('visual-img');
      const noMsg = document.getElementById('no-visual-msg');
      const fullImg = document.getElementById('visual-full-img');
      const status = document.getElementById('visual-status');
      
      if (visual) {
        img.src = visual.public_url;
        img.style.display = 'block';
        noMsg.style.display = 'none';
        fullImg.src = visual.public_url;
        slot.classList.add('has-visual');
        status.className = 'status-badge has-visual';
        status.textContent = '✓ Visual exists';
        
        document.getElementById('meta-style').textContent = visual.style || 'unknown';
        document.getElementById('meta-status').textContent = 'Active';
      } else {
        img.style.display = 'none';
        noMsg.style.display = 'flex';
        fullImg.src = '';
        slot.classList.remove('has-visual');
        status.className = 'status-badge no-visual';
        status.textContent = '✗ No visual';
        
        document.getElementById('meta-style').textContent = '-';
        document.getElementById('meta-status').textContent = 'Missing';
      }
      
      document.getElementById('meta-day').textContent = currentDay;
      document.getElementById('meta-phase').textContent = currentPhase;
      
      // Update Kelly script
      const scripts = KELLY_SCRIPTS[currentPhase] || [''];
      document.getElementById('kelly-phase').textContent = currentPhase.toUpperCase();
      document.getElementById('kelly-script').textContent = `"${scripts[0]}"`;
      
      // Update active phase button
      document.querySelectorAll('.phase-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.phase === currentPhase);
      });
    }
    
    function setPhase(phase) {
      currentPhase = phase;
      updateVisualDisplay();
    }
    
    function setDay(day) {
      currentDay = parseInt(day);
      document.getElementById('day-input').value = currentDay;
      loadLesson(currentDay);
      loadDayVisuals(currentDay);
    }
    
    function nextPhase() {
      const idx = PHASES.indexOf(currentPhase);
      if (idx < PHASES.length - 1) {
        setPhase(PHASES[idx + 1]);
      } else {
        // Go to next day
        setDay(currentDay + 1);
        setPhase('hook');
      }
    }
    
    function prevPhase() {
      const idx = PHASES.indexOf(currentPhase);
      if (idx > 0) {
        setPhase(PHASES[idx - 1]);
      } else if (currentDay > 1) {
        setDay(currentDay - 1);
        setPhase('outro');
      }
    }
    
    // Event listeners
    document.getElementById('day-input').addEventListener('change', (e) => {
      setDay(e.target.value);
    });
    
    document.querySelectorAll('.phase-btn').forEach(btn => {
      btn.addEventListener('click', () => setPhase(btn.dataset.phase));
    });
    
    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const slot = document.getElementById('visual-slot');
        const sizes = { small: '120px', medium: '180px', large: '260px' };
        slot.style.width = sizes[btn.dataset.size];
        slot.style.height = sizes[btn.dataset.size];
      });
    });
    
    document.querySelectorAll('.position-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.position-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const slot = document.getElementById('visual-slot');
        slot.style.top = 'auto';
        slot.style.bottom = 'auto';
        slot.style.left = 'auto';
        slot.style.right = 'auto';
        
        const pos = btn.dataset.pos;
        if (pos === 'bottom-right') { slot.style.bottom = '180px'; slot.style.right = '20px'; }
        if (pos === 'bottom-left') { slot.style.bottom = '180px'; slot.style.left = '20px'; }
        if (pos === 'top-right') { slot.style.top = '100px'; slot.style.right = '20px'; }
      });
    });
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPhase();
      if (e.key === 'ArrowLeft') prevPhase();
      if (e.key === 'ArrowUp') setDay(currentDay + 1);
      if (e.key === 'ArrowDown') setDay(Math.max(1, currentDay - 1));
    });
    
    function flagForRegeneration() {
      alert(`Flagged Day ${currentDay} / ${currentPhase} for regeneration`);
      // TODO: Save to database
    }
    
    function markApproved() {
      alert(`Day ${currentDay} / ${currentPhase} marked as approved`);
      // TODO: Save to database
    }
    
    // Initialize
    const urlParams = new URLSearchParams(window.location.search);
    currentDay = parseInt(urlParams.get('day')) || 352;
    currentPhase = urlParams.get('phase') || 'hook';
    
    setDay(currentDay);
  </script>
</body>
</html>
