<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2563eb" />
    <title>404 - Page Not Found — Curious Kelly</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/images/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/images/brand/favicon.ico" />

    <!-- Brand CSS -->
    <link rel="stylesheet" href="/css/brand-colors.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@400;500;600;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --kelly-blue: #2563eb;
        --kelly-purple: #7c3aed;
        --kelly-pink: #ec4899;
        --kelly-orange: #f97316;
        --kelly-yellow: #fbbf24;
        --kelly-green: #10b981;
        --kelly-bg: #0f172a;
        --kelly-surface: #1e293b;
        --kelly-text: #f1f5f9;
        --kelly-text-muted: #94a3b8;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, var(--kelly-bg) 0%, #1e293b 100%);
        color: var(--kelly-text);
        overflow: hidden;
      }

      .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        position: relative;
      }

      .error-code {
        font-family: 'Fraunces', serif;
        font-size: clamp(6rem, 20vw, 12rem);
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, var(--kelly-blue) 0%, var(--kelly-purple) 50%, var(--kelly-pink) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .kelly-avatar {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        margin-bottom: 2rem;
        animation: wiggle 2s ease-in-out infinite;
      }

      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-8deg); }
        75% { transform: rotate(8deg); }
      }

      h1 {
        font-family: 'Fraunces', serif;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 600;
        margin-bottom: 1rem;
        line-height: 1.2;
      }

      p {
        font-size: clamp(1rem, 3vw, 1.125rem);
        color: var(--kelly-text-muted);
        margin-bottom: 2rem;
        max-width: 500px;
        line-height: 1.6;
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 2rem;
      }

      .cta-button {
        display: inline-block;
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        background: var(--kelly-blue);
        border: none;
        border-radius: 12px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 30px rgba(37, 99, 235, 0.3);
      }

      .cta-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 40px rgba(37, 99, 235, 0.4);
        background: #1d4ed8;
      }

      .cta-button:active {
        transform: translateY(0);
      }

      .secondary-button {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      }

      .secondary-button:hover {
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }

      .quick-links {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        justify-content: center;
        margin-top: 2rem;
      }

      .quick-link {
        color: var(--kelly-text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s ease;
      }

      .quick-link:hover {
        color: var(--kelly-blue);
        text-decoration: underline;
      }

      .path-info {
        margin-top: 3rem;
        padding: 1rem 1.5rem;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 600px;
        word-break: break-all;
      }

      .path-info code {
        color: var(--kelly-yellow);
        font-size: 0.85rem;
      }

      @media (max-width: 768px) {
        .container {
          padding: 1.5rem;
        }

        .kelly-avatar {
          width: 120px;
          height: 120px;
        }

        .button-group {
          flex-direction: column;
          width: 100%;
          max-width: 300px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-code">404</div>

      <img
        src="/images/expressions/confused.jpeg"
        alt="Kelly confused"
        class="kelly-avatar"
      />

      <h1>Hmm, that page wandered off...</h1>

      <p>
        I can't seem to find what you're looking for. Maybe it moved, or perhaps it never existed.
        Let's get you back on track!
      </p>

      <div class="button-group">
        <a href="/index.html" class="cta-button">
          Go Home
        </a>
        <a href="/learn.html" class="cta-button secondary-button">
          Start Learning
        </a>
      </div>

      <div class="quick-links">
        <a href="/pricing.html" class="quick-link">Pricing</a>
        <a href="/about.html" class="quick-link">About</a>
        <a href="mailto:hello@curiouskelly.com" class="quick-link">Contact</a>
      </div>

      <div class="path-info">
        <p style="margin: 0; font-size: 0.85rem; color: var(--kelly-text-muted);">
          Looking for: <code id="current-path"></code>
        </p>
      </div>
    </div>

    <script>
      // Display the attempted path
      document.getElementById('current-path').textContent = window.location.pathname;

      // Track 404 for analytics
      console.log('404 Error - Page not found:', window.location.pathname);
      // TODO: Send to analytics
    </script>
  </body>
</html>
