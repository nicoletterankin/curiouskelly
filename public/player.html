<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Lesson - Curious Kelly</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 30px;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo-icon { font-size: 24px; }
    
    .day-badge {
      background: rgba(0, 217, 255, 0.15);
      color: #00d9ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Vibe Tuner Button */
    .vibe-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .vibe-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    /* Vibe Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .vibe-panel {
      background: rgba(20, 20, 25, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.open .vibe-panel {
      transform: scale(1);
    }

    .vibe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .vibe-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 24px;
      cursor: pointer;
    }

    .slider-group {
      margin-bottom: 24px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slider-container {
      position: relative;
      height: 40px;
      display: flex;
      align-items: center;
    }

    .vibe-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      outline: none;
    }

    .vibe-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
      transition: transform 0.1s;
    }

    .vibe-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .current-archetype {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .archetype-name {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #aaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .archetype-desc {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }
    
    /* Main Content */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }
    
    /* Kelly Avatar Section */
    .avatar-section {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .avatar-container {
      position: relative;
      width: 100%;
      max-width: 450px;
    }
    
    .avatar-image {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }
    
    .avatar-image.speaking {
      box-shadow: 0 20px 60px rgba(0, 217, 255, 0.3);
    }
    
    /* Speaking indicator */
    .speaking-indicator {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 30px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .speaking-indicator.active {
      opacity: 1;
    }
    
    .speaking-bar {
      width: 4px;
      height: 20px;
      background: #00d9ff;
      border-radius: 2px;
      animation: speak 0.5s ease-in-out infinite alternate;
    }
    
    .speaking-bar:nth-child(1) { animation-delay: 0s; }
    .speaking-bar:nth-child(2) { animation-delay: 0.1s; }
    .speaking-bar:nth-child(3) { animation-delay: 0.2s; }
    .speaking-bar:nth-child(4) { animation-delay: 0.1s; }
    .speaking-bar:nth-child(5) { animation-delay: 0s; }
    
    @keyframes speak {
      0% { height: 8px; }
      100% { height: 24px; }
    }
    
    /* Lesson Content Section */
    .content-section {
      padding: 20px;
    }
    
    .lesson-category {
      color: #00d9ff;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    
    .lesson-title {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 20px;
    }
    
    .lesson-description {
      color: #999;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    /* Transcript Box */
    .transcript-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      min-height: 150px;
      max-height: 250px;
      overflow-y: auto;
    }
    
    .transcript-label {
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    
    .transcript-text {
      font-size: 18px;
      line-height: 1.8;
      color: #ddd;
    }
    
    .transcript-text .current-word {
      color: #00d9ff;
      font-weight: 600;
    }
    
    /* Phase Progress */
    .phase-progress {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }
    
    .phase-dot {
      width: 40px;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      transition: all 0.3s;
    }
    
    .phase-dot.active {
      background: #00d9ff;
    }
    
    .phase-dot.completed {
      background: #00ff88;
    }
    
    /* Controls */
    .controls {
      display: flex;
      gap: 16px;
    }
    
    .btn {
      padding: 16px 32px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #00d9ff, #0088ff);
      color: #fff;
      flex: 1;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 217, 255, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }
    
    /* Loading State */
    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Error State */
    .error-message {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff6b6b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    /* Responsive */
    @media (max-width: 900px) {
      .main {
        grid-template-columns: 1fr;
        gap: 30px;
      }
      
      .lesson-title {
        font-size: 32px;
      }
      
      .avatar-container {
        max-width: 350px;
      }
    }
  </style>
</head>

    // ============================================
    // VIBE TUNER LOGIC
    // ============================================
    function getNearestArchetype(x, y) {
      let minDistance = Infinity;
      let nearest = ARCHETYPES[0];

      ARCHETYPES.forEach(archetype => {
        // Calculate Euclidean distance
        const dist = Math.sqrt(Math.pow(x - archetype.x, 2) + Math.pow(y - archetype.y, 2));
        if (dist < minDistance) {
          minDistance = dist;
          nearest = archetype;
        }
      });

      return nearest;
    }

    function updateVibe() {
      const x = parseInt(elements.sliderPerspective.value);
      const y = parseInt(elements.sliderEnergy.value);
      const age = elements.selectAge.value;
      const language = elements.selectLanguage.value;
      
      const archetype = getNearestArchetype(x, y);
      
      // Update UI immediately
      elements.archetypeDisplay.textContent = archetype.name;
      elements.archetypeDesc.textContent = archetype.desc;
      
      // Only reload if something changed
      if (archetype.name !== currentArchetype || age !== currentAge || language !== currentLanguage) {
        console.log(`🔄 [VIBE] Updating to: ${archetype.name} | ${age} | ${language}`);
        currentArchetype = archetype.name;
        currentAge = age;
        currentLanguage = language;
        
        // Debounce the reload to prevent spamming API
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          loadLesson(currentLesson.day_number);
        }, 500);
      }
    }

    // Event Listeners for Vibe Tuner
    elements.vibeBtn.addEventListener('click', () => {
      elements.vibeModal.classList.add('open');
    });

    elements.closeVibe.addEventListener('click', () => {
      elements.vibeModal.classList.remove('open');
    });

    // Close on outside click
    elements.vibeModal.addEventListener('click', (e) => {
      if (e.target === elements.vibeModal) {
        elements.vibeModal.classList.remove('open');
      }
    });

    elements.sliderPerspective.addEventListener('input', updateVibe);
    elements.sliderEnergy.addEventListener('input', updateVibe);
    elements.selectAge.addEventListener('change', updateVibe);
    elements.selectLanguage.addEventListener('change', updateVibe);

    // ============================================
    // UTILITIES
    // ============================================
    function getTodayLessonDay() {
      const startDate = new Date('2025-01-01');
      const today = new Date();
      const diffTime = Math.abs(today - startDate);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return ((diffDays - 1) % 365) + 1;
    }
    
    function showError(message) {
      elements.errorMessage.textContent = message;
      elements.errorMessage.classList.add('show');
      setTimeout(() => elements.errorMessage.classList.remove('show'), 5000);
    }
    
    function setLoading(loading) {
      if (loading) {
        elements.btnStart.innerHTML = '<div class="loading-spinner"></div> Loading...';
        elements.btnStart.disabled = true;
      } else {
        elements.btnStart.innerHTML = isPlaying ? '⏸ Pause' : '▶ Continue';
        elements.btnStart.disabled = false;
      }
    }
    
    function updatePhaseIndicator() {
      elements.phaseDots.forEach((dot, index) => {
        dot.classList.remove('active', 'completed');
        if (index < currentPhaseIndex) {
          dot.classList.add('completed');
        } else if (index === currentPhaseIndex) {
          dot.classList.add('active');
        }
      });
    }
    
    /**
     * Extract text from lesson_atom content JSON
     */
    function extractTextFromContent(content) {
      if (typeof content === 'string') {
        return content;
      }
      if (typeof content === 'object' && content !== null) {
        // Try common content structure patterns
        if (content.text) return content.text;
        if (content.script) return content.script;
        if (content.content) return content.content;
        if (content.message) return content.message;
        if (Array.isArray(content)) {
          return content.map(item => extractTextFromContent(item)).join(' ');
        }
        // If it's an object with nested structure, try to find text
        const textKeys = ['text', 'script', 'content', 'message', 'transcript'];
        for (const key of textKeys) {
          if (content[key]) {
            return typeof content[key] === 'string' ? content[key] : JSON.stringify(content[key]);
          }
        }
        // Last resort: stringify the object
        return JSON.stringify(content);
      }
      return String(content);
    }
    
    function setSpeaking(speaking) {
      if (speaking) {
        elements.avatar.classList.add('speaking');
        elements.speakingIndicator.classList.add('active');
      } else {
        elements.avatar.classList.remove('speaking');
        elements.speakingIndicator.classList.remove('active');
      }
    }
    
    // ============================================
    // SUPABASE
    // ============================================
    async function initSupabase() {
      try {
        supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        console.log('✅ Supabase initialized');
      } catch (error) {
        console.error('❌ Supabase init failed:', error);
        showError('Failed to connect to database');
      }
    }
    
    /**
     * Load lesson from core_lessons and lesson_atoms
     * Logs complete data structure for debugging
     */
    async function loadLesson(dayNumber) {
      try {
        console.log(`\n🔍 [AUDIT] Loading Day ${dayNumber} lesson...`);
        
        // Step 1: Load core_lessons
        const { data: coreLesson, error: coreError } = await supabase
          .from('core_lessons')
          .select('*')
          .eq('day_number', dayNumber)
          .single();
        
        if (coreError) {
          console.error('❌ [AUDIT] core_lessons query error:', coreError);
          throw coreError;
        }
        
        if (!coreLesson) {
          throw new Error(`No lesson found for day ${dayNumber}`);
        }
        
        console.log('✅ [AUDIT] core_lessons loaded:', {
          id: coreLesson.id,
          day_number: coreLesson.day_number,
          topic: coreLesson.topic,
          available_columns: Object.keys(coreLesson)
        });
        console.log('📋 [AUDIT] Full core_lessons data:', JSON.stringify(coreLesson, null, 2));
        
        currentLesson = coreLesson;
        
        // Step 2: Load lesson_atoms for this lesson and archetype
        console.log(`\n🔍 [AUDIT] Loading lesson_atoms for archetype: ${currentArchetype}...`);
        const { data: atoms, error: atomsError } = await supabase
          .from('lesson_atoms')
          .select('*')
          .eq('core_lesson_id', coreLesson.id)
          .eq('archetype', currentArchetype);
        
        if (atomsError) {
          console.error('❌ [AUDIT] lesson_atoms query error:', atomsError);
          // Try without archetype filter
          console.log('🔄 [AUDIT] Trying without archetype filter...');
          const { data: allAtoms, error: allAtomsError } = await supabase
            .from('lesson_atoms')
            .select('*')
            .eq('core_lesson_id', coreLesson.id);
          
          if (allAtomsError) {
            console.error('❌ [AUDIT] lesson_atoms query (no filter) error:', allAtomsError);
            throw allAtomsError;
          }
          
          if (allAtoms && allAtoms.length > 0) {
            console.log(`⚠️  [AUDIT] Found ${allAtoms.length} atoms but none for archetype "${currentArchetype}"`);
            console.log('📋 [AUDIT] Available archetypes:', [...new Set(allAtoms.map(a => a.archetype))]);
            // Use first available archetype
            const firstArchetype = allAtoms[0].archetype;
            console.log(`🔄 [AUDIT] Using archetype: ${firstArchetype}`);
            currentArchetype = firstArchetype;
            lessonAtoms = allAtoms.filter(a => a.archetype === firstArchetype);
          } else {
            lessonAtoms = [];
          }
        } else {
          lessonAtoms = atoms || [];
        }
        
        console.log(`✅ [AUDIT] Found ${lessonAtoms.length} lesson_atoms`);
        
        if (lessonAtoms.length > 0) {
          console.log('📋 [AUDIT] lesson_atoms structure:');
          lessonAtoms.forEach((atom, index) => {
            console.log(`\n--- Atom ${index + 1} ---`);
            console.log(`Phase: ${atom.phase}`);
            console.log(`Archetype: ${atom.archetype}`);
            console.log(`Content type: ${typeof atom.content}`);
            if (typeof atom.content === 'object') {
              console.log(`Content keys:`, Object.keys(atom.content));
              console.log('Content preview:', JSON.stringify(atom.content, null, 2).substring(0, 500));
            }
          });
          
          // Sort atoms by phase order
          lessonAtoms.sort((a, b) => {
            const aIndex = PHASE_ORDER.indexOf(a.phase);
            const bIndex = PHASE_ORDER.indexOf(b.phase);
            if (aIndex === -1 && bIndex === -1) return a.phase.localeCompare(b.phase);
            if (aIndex === -1) return 1;
            if (bIndex === -1) return -1;
            return aIndex - bIndex;
          });
          
          console.log('📊 [AUDIT] Phases in order:', lessonAtoms.map(a => a.phase));
        } else {
          console.warn('⚠️  [AUDIT] No lesson_atoms found - will use fallback content');
        }
        
        // Step 3: Update phase dots based on actual data
        updatePhaseDots(lessonAtoms.length);
        
        // Step 4: Update UI
        elements.dayBadge.textContent = `Day ${dayNumber} of 365`;
        elements.category.textContent = coreLesson.difficulty_level || coreLesson.ideal_age_range || 'General Knowledge';
        elements.title.textContent = coreLesson.topic;
        elements.description.textContent = coreLesson.universal_truth || `Explore the fascinating world of ${coreLesson.topic}.`;
        
        console.log('✅ [AUDIT] Lesson loaded successfully');
        console.log('📊 [AUDIT] Summary:', {
          day: dayNumber,
          topic: coreLesson.topic,
          atoms_count: lessonAtoms.length,
          phases: lessonAtoms.map(a => a.phase),
          archetype: currentArchetype,
          age: currentAge,
          language: currentLanguage
        });
        
        return coreLesson;
        
      } catch (error) {
        console.error('❌ [AUDIT] Lesson load failed:', error);
        
        // Fallback lesson
        currentLesson = {
          id: 'fallback',
          day_number: dayNumber,
          topic: 'The Sun',
          universal_truth: 'The Sun is our star',
          difficulty_level: 'Beginner'
        };
        lessonAtoms = [];
        
        elements.dayBadge.textContent = `Day ${dayNumber} of 365`;
        elements.category.textContent = 'Astronomy';
        elements.title.textContent = 'The Sun: Our Star';
        elements.description.textContent = 'Explore the fascinating world of The Sun.';
        
        updatePhaseDots(0);
        
        return currentLesson;
      }
    }
    
    /**
     * Update phase dots to match actual number of phases
     */
    function updatePhaseDots(count) {
      const phaseProgress = document.querySelector('.phase-progress');
      phaseProgress.innerHTML = '';
      
      const actualCount = Math.max(count, 1); // At least 1 dot
      
      for (let i = 0; i < actualCount; i++) {
        const dot = document.createElement('div');
        dot.className = 'phase-dot';
        dot.setAttribute('data-phase', i);
        phaseProgress.appendChild(dot);
      }
      
      // Update elements reference
      elements.phaseDots = document.querySelectorAll('.phase-dot');
      updatePhaseIndicator();
    }
    
    // ============================================
    // ELEVENLABS VOICE
    // ============================================
    async function generateVoice(text) {
      try {
        // Try to use API endpoint first (for production)
        const response = await fetch('/api/voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        
        if (response.ok) {
          const blob = await response.blob();
          return URL.createObjectURL(blob);
        }
        
        // If API fails, we'll use browser speech synthesis as fallback
        console.warn('Voice API failed, using browser speech');
        return null;
        
      } catch (error) {
        console.error('Voice generation error:', error);
        return null;
      }
    }
    
    function speakWithBrowser(text) {
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        
        // Try to get a female voice
        const voices = speechSynthesis.getVoices();
        const femaleVoice = voices.find(v => 
          v.name.includes('Female') || 
          v.name.includes('Samantha') || 
          v.name.includes('Google US English')
        );
        if (femaleVoice) utterance.voice = femaleVoice;
        
        utterance.onend = () => {
          setSpeaking(false);
          resolve();
        };
        
        utterance.onstart = () => setSpeaking(true);
        
        speechSynthesis.speak(utterance);
      });
    }
    
    // ============================================
    // PLAYBACK
    // ============================================
    async function playPhase(phaseIndex) {
      console.log(`\n🎬 [PLAYBACK] Starting phase ${phaseIndex} of ${lessonAtoms.length}`);
      
      // Check if we have lesson_atoms data
      if (lessonAtoms.length === 0) {
        console.warn('⚠️  [PLAYBACK] No lesson_atoms - using fallback');
        const fallbackText = `Welcome! Today is Day ${currentLesson.day_number} of your learning journey. We're going to explore ${currentLesson.topic}. This is going to be fascinating!`;
        await playText(fallbackText, phaseIndex);
        return;
      }
      
      if (phaseIndex >= lessonAtoms.length) {
        // Lesson complete
        console.log('✅ [PLAYBACK] Lesson complete!');
        elements.transcript.textContent = "Great job! You've completed today's lesson. See you tomorrow!";
        elements.btnStart.innerHTML = '✓ Complete';
        elements.btnStart.disabled = true;
        currentPhaseIndex = lessonAtoms.length;
        updatePhaseIndicator();
        return;
      }
      
      currentPhaseIndex = phaseIndex;
      updatePhaseIndicator();
      
      const atom = lessonAtoms[phaseIndex];
      console.log(`📝 [PLAYBACK] Phase: ${atom.phase}`);
      console.log(`📦 [PLAYBACK] Atom content:`, atom.content);
      
      // Extract text from content
      const text = extractTextFromContent(atom.content);
      console.log(`💬 [PLAYBACK] Extracted text (${text.length} chars):`, text.substring(0, 100) + '...');
      
      await playText(text, phaseIndex);
    }
    
    /**
     * Play text with voice synthesis
     */
    async function playText(text, phaseIndex) {
      elements.transcript.textContent = text;
      setLoading(true);
      
      // Try ElevenLabs first, fallback to browser speech
      const audioUrl = await generateVoice(text);
      
      setLoading(false);
      isPlaying = true;
      elements.btnStart.innerHTML = '⏸ Pause';
      elements.btnReplay.disabled = false;
      
      if (audioUrl) {
        // Play ElevenLabs audio
        currentAudio = new Audio(audioUrl);
        setSpeaking(true);
        
        currentAudio.onended = () => {
          console.log(`✅ [PLAYBACK] Phase ${phaseIndex} audio ended`);
          setSpeaking(false);
          isPlaying = false;
          if (phaseIndex < lessonAtoms.length - 1) {
            elements.btnStart.innerHTML = '▶ Continue';
          } else {
            elements.btnStart.innerHTML = '✓ Complete';
            elements.btnStart.disabled = true;
          }
        };
        
        currentAudio.onerror = (error) => {
          console.error('❌ [PLAYBACK] Audio error:', error);
          setSpeaking(false);
          speakWithBrowser(text);
        };
        
        currentAudio.play().catch(error => {
          console.error('❌ [PLAYBACK] Audio play failed:', error);
          setSpeaking(false);
          speakWithBrowser(text);
        });
      } else {
        // Use browser speech synthesis
        await speakWithBrowser(text);
        isPlaying = false;
        if (phaseIndex < lessonAtoms.length - 1) {
          elements.btnStart.innerHTML = '▶ Continue';
        } else {
          elements.btnStart.innerHTML = '✓ Complete';
          elements.btnStart.disabled = true;
        }
      }
    }
    
    // ============================================
    // EVENT HANDLERS
    // ============================================
    elements.btnStart.addEventListener('click', async () => {
      console.log(`\n🖱️  [INTERACTION] Start/Continue clicked. isPlaying: ${isPlaying}, phase: ${currentPhaseIndex}`);
      
      if (isPlaying) {
        // Pause
        console.log('⏸️  [INTERACTION] Pausing...');
        if (currentAudio) {
          currentAudio.pause();
        }
        speechSynthesis.cancel();
        setSpeaking(false);
        isPlaying = false;
        elements.btnStart.innerHTML = '▶ Continue';
      } else {
        // Start or continue
        if (currentPhaseIndex === 0 && lessonAtoms.length === 0) {
          // First time starting, but no atoms loaded yet
          console.log('⚠️  [INTERACTION] No atoms loaded, waiting for lesson load...');
          return;
        }
        
        if (currentPhaseIndex === 0 && !isPlaying) {
          // First time starting
          console.log('▶️  [INTERACTION] Starting first phase...');
          await playPhase(0);
        } else {
          // Continue to next phase
          console.log(`▶️  [INTERACTION] Continuing to phase ${currentPhaseIndex + 1}...`);
          await playPhase(currentPhaseIndex + 1);
        }
      }
    });
    
    elements.btnReplay.addEventListener('click', async () => {
      console.log(`\n🔄 [INTERACTION] Replay clicked for phase ${currentPhaseIndex}`);
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      speechSynthesis.cancel();
      await playPhase(currentPhaseIndex);
    });
    
    // ============================================
    // INITIALIZATION
    // ============================================
    async function init() {
      // Load voices for browser speech
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => {};
      }
      speechSynthesis.getVoices();
      
      await initSupabase();
      
      const dayNumber = getTodayLessonDay();
      // Allow URL parameter to override day number for testing
      const urlParams = new URLSearchParams(window.location.search);
      const testDay = urlParams.get('day');
      const finalDayNumber = testDay ? parseInt(testDay) : dayNumber;
      
      console.log(`\n🚀 [INIT] Initializing player for Day ${finalDayNumber}...`);
      await loadLesson(finalDayNumber);
      
      if (currentLesson) {
        elements.transcript.textContent = `Ready to learn about ${currentLesson.topic}? Click "Start Lesson" to begin!`;
      }
      
      console.log('✅ [INIT] Player initialized');
      console.log('📊 [INIT] Final state:', {
        lesson: currentLesson?.topic,
        atoms_count: lessonAtoms.length,
        archetype: currentArchetype,
        phases: lessonAtoms.map(a => a.phase)
      });
    }
    
    // Start
    init();
  </script>
