<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelly OS - Learning Experience</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.5);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --accent-color: #0071e3;
      --danger-color: #ff3b30;
      --success-color: #34c759;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background Container (Kelly/Unity) */
    .bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: #fff; /* Fallback */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-image {
      height: 100%;
      width: auto;
      object-fit: cover;
      opacity: 0.9;
      transition: all 0.5s ease;
    }

    /* Overlay UI Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none; /* Let clicks pass through to "Kelly" if needed */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Interactive Elements Container */
    .ui-controls {
      pointer-events: auto;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-bg);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid var(--glass-border);
    }

    .logo-text {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.5px;
    }

    .menu-area {
      display: flex;
      gap: 12px;
    }

    /* Menu Icons */
    .menu-item {
      position: relative;
    }

    .menu-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      backdrop-filter: blur(20px);
    }

    .menu-btn:hover, .menu-btn.active {
      transform: scale(1.05);
      background: #fff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    /* Dropdown Menus */
    .dropdown-menu {
      position: absolute;
      top: 55px;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 16px;
      width: 260px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(30px);
      transform-origin: top right;
      transform: scale(0.9);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dropdown-menu.open {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .dropdown-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Age Slider */
    .age-slider-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .age-value {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      color: var(--accent-color);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-top: -10px;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: #e5e5e5;
      border-radius: 2px;
    }

    /* Tone Grid */
    .tone-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tone-option {
      padding: 10px;
      border-radius: 12px;
      background: rgba(0,0,0,0.03);
      border: 1px solid transparent;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tone-option:hover {
      background: rgba(0,0,0,0.06);
    }

    .tone-option.selected {
      background: #fff;
      border-color: var(--accent-color);
      color: var(--accent-color);
      box-shadow: 0 2px 10px rgba(0, 113, 227, 0.1);
    }

    /* Center Content */
    .center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Push to bottom initially */
      align-items: center;
      padding-bottom: 120px; /* Space for nav bar */
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      pointer-events: none; /* Let interaction pass through */
    }

    .lesson-card {
      background: var(--glass-bg);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(30px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.05);
      border: 1px solid var(--glass-border);
      pointer-events: auto;
      transition: all 0.3s ease;
      opacity: 0; /* Hidden initially */
      transform: translateY(20px);
      animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      animation-delay: 0.5s;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .slot-machine-text {
      font-size: 24px;
      line-height: 1.4;
      font-weight: 500;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-animating {
      opacity: 0.5;
      filter: blur(2px);
      transform: scale(0.98);
      transition: all 0.2s;
    }

    /* Bottom Navigation (Phases) */
    .bottom-nav {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: var(--glass-bg);
      padding: 8px;
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 1px solid var(--glass-border);
      pointer-events: auto;
    }

    .phase-segment {
      padding: 10px 20px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      color: var(--text-secondary);
      background: transparent;
      position: relative;
      overflow: hidden;
    }

    .phase-segment:hover {
      color: var(--text-primary);
      background: rgba(0,0,0,0.03);
    }

    .phase-segment.active {
      background: #fff;
      color: var(--text-primary);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .phase-segment.completed {
      color: var(--success-color);
    }

    .phase-segment.completed::after {
      content: '✓';
      font-size: 10px;
      margin-left: 4px;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }
    
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Mobile Tweaks */
    @media (max-width: 768px) {
      .bg-image {
        width: 100%;
        height: 100%;
        object-position: top center;
      }
      .bottom-nav {
        bottom: 20px;
        width: 90%;
        overflow-x: auto;
        justify-content: flex-start;
      }
      .phase-segment {
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="loading-overlay" id="loading-screen">
    <div class="logo-area" style="transform: scale(1.5);">
      <span class="logo-icon">✨</span>
      <span class="logo-text">Kelly OS</span>
    </div>
  </div>

  <!-- Background -->
  <div class="bg-container">
    <img src="/assets/kelly_canonical/core/chair/kelly-chair-wisdom.png" alt="Kelly" class="bg-image" id="kelly-bg">
  </div>

  <!-- UI Layer -->
  <div class="ui-layer">
    
    <!-- Top Bar -->
    <div class="top-bar ui-controls">
      <div class="logo-area">
        <span class="logo-icon">✨</span>
        <span class="logo-text">Kelly OS</span>
      </div>

      <div class="menu-area">
        <!-- Age Menu -->
        <div class="menu-item">
          <div class="menu-btn" id="btn-age" title="Age Group">
            <span>🎂</span>
          </div>
          <div class="dropdown-menu" id="menu-age">
            <div class="dropdown-title">Target Age</div>
            <div class="age-slider-container">
              <div class="age-value" id="age-display">18</div>
              <input type="range" min="2" max="102" value="18" id="age-slider">
              <div style="display:flex; justify-content:space-between; font-size:10px; color:#aaa;">
                <span>2</span>
                <span>102</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Tone Menu -->
        <div class="menu-item">
          <div class="menu-btn" id="btn-tone" title="Lesson Tone">
            <span>🎭</span>
          </div>
          <div class="dropdown-menu" id="menu-tone">
            <div class="dropdown-title">Lesson Tone</div>
            <div class="tone-grid">
              <div class="tone-option selected" data-tone="neutral">Neutral</div>
              <div class="tone-option" data-tone="fun">Fun</div>
              <div class="tone-option" data-tone="warm">Warm</div>
              <div class="tone-option" data-tone="inspirational">Inspire</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Center Content -->
    <div class="center-content">
      <div class="lesson-card ui-controls">
        <div class="slot-machine-text" id="lesson-text">
          initializing neural link...
        </div>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
          <button id="btn-speak" style="background: var(--accent-color); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600;">
            ▶ Play
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav ui-controls" id="phase-nav">
      <!-- Segments injected via JS -->
    </div>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Configuration
    const CONFIG = {
      SUPABASE_URL: 'https://tvjalxxsyryjphkforjv.supabase.co',
      SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2amFseHhzeXJ5anBoa2Zvcmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NjM5MTksImV4cCI6MjA3OTEzOTkxOX0.VFrBs9sWkIgfFNpavQHxo0vSy6tkICpSbuj_TWvGHxI',
    };

    // State
    const state = {
      age: 18,
      tone: 'neutral',
      phaseIndex: 0,
      // Phase order: Hook (engaging intro) → Fact1/Q1 → Fact2/Q2 → Fact3/Q3 → Wisdom
      phases: ['Hook', 'Fact1', 'Fact2', 'Fact3', 'Wisdom'], // Default phases
      lessonData: null, // Core lesson data
      atoms: [], // Loaded atoms
      isPlaying: false
    };

    // Tone to Archetype Mapping (Internal Logic)
    const TONE_MAP = {
      'neutral': 'The Scientist',
      'fun': 'The Explorer',
      'warm': 'The Provider',
      'inspirational': 'The Mystic'
    };

    // Elements
    const els = {
      ageBtn: document.getElementById('btn-age'),
      ageMenu: document.getElementById('menu-age'),
      ageSlider: document.getElementById('age-slider'),
      ageDisplay: document.getElementById('age-display'),
      toneBtn: document.getElementById('btn-tone'),
      toneMenu: document.getElementById('menu-tone'),
      toneOptions: document.querySelectorAll('.tone-option'),
      lessonText: document.getElementById('lesson-text'),
      phaseNav: document.getElementById('phase-nav'),
      loading: document.getElementById('loading-screen'),
      speakBtn: document.getElementById('btn-speak')
    };

    // Initialize
    const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

    async function init() {
      console.log('✨ Kelly OS Initializing...');
      
      // Simulate loading
      setTimeout(() => {
        els.loading.classList.add('hidden');
      }, 1000);

      // Load Data
      await loadLessonData(330); // Hardcoded day for now as per previous context
      
      // Render UI
      renderPhases();
      updateContent();

      // Event Listeners
      setupInteractions();
    }

    async function loadLessonData(day) {
      console.log(`📚 Loading Day ${day}...`);
      
      // Load from Supabase 'core_lessons' table
      // ACTUAL COLUMNS: id, day_number, topic, universal_truth, marketing_headline, etc.
      const { data: core, error } = await supabase
        .from('core_lessons')
        .select('id, day_number, topic, universal_truth, marketing_headline')
        .eq('day_number', day)
        .single();
      
      if (error || !core) {
        console.log('⚠️ No lesson in Supabase for day', day);
        state.lessonData = { topic: 'Lesson Not Found' };
        state.atoms = [];
        return;
      }
      
      state.lessonData = {
        id: core.id,
        day_number: core.day_number,
        topic: core.topic,  // ACTUAL field name
        universal_truth: core.universal_truth,
        headline: core.marketing_headline
      };
      console.log('✅ Core Lesson Loaded:', state.lessonData.topic);

      // Load lesson_atoms for this lesson
      // ACTUAL COLUMNS: id, core_lesson_id, archetype, phase, content, visual_url
      const { data: atoms } = await supabase
        .from('lesson_atoms')
        .select('id, archetype, phase, content')
        .eq('core_lesson_id', core.id);
        
      state.atoms = atoms || [];
      console.log(`✅ Atoms Loaded: ${state.atoms.length}`);
    }

    function getBestAtom() {
      // Logic: Find atom matching current Phase + mapped Archetype
      // Fallback to "The Scientist" if specific tone/archetype missing
      const targetArchetype = TONE_MAP[state.tone] || 'The Scientist';
      const targetPhase = state.phases[state.phaseIndex];

      let atom = state.atoms.find(a => 
        a.phase === targetPhase && a.archetype === targetArchetype
      );

      if (!atom) {
        // Fallback: Try finding ANY atom for this phase
        atom = state.atoms.find(a => a.phase === targetPhase);
      }

      return atom;
    }

    function updateContent() {
      // Slot machine animation effect
      els.lessonText.classList.add('slot-animating');
      
      setTimeout(() => {
        const atom = getBestAtom();
        if (atom && atom.content) {
          // Extract text logic
          let text = "Content missing...";
          if (typeof atom.content === 'string') text = atom.content;
          else if (atom.content.script) text = atom.content.script;
          else if (atom.content.text) text = atom.content.text;
          
          // Personalized tweak (Client-side "AI" adaptation simulation)
          // In a real app, we'd use the shards table for age-specific text.
          // Since shards are missing, we simulate age adaptation by simple prefixing/logic if possible, 
          // or just relying on the tone mapping which is real.
          
          els.lessonText.innerHTML = text;
        } else {
          els.lessonText.innerHTML = `(No content for ${state.phases[state.phaseIndex]})`;
        }
        els.lessonText.classList.remove('slot-animating');
      }, 250);
    }

    function renderPhases() {
      els.phaseNav.innerHTML = '';
      state.phases.forEach((phase, idx) => {
        const el = document.createElement('div');
        el.className = `phase-segment ${idx === state.phaseIndex ? 'active' : ''}`;
        el.innerText = phase;
        el.onclick = () => {
          state.phaseIndex = idx;
          renderPhases();
          updateContent();
        };
        els.phaseNav.appendChild(el);
      });
    }

    function setupInteractions() {
      // Menu Toggles
      const toggleMenu = (btn, menu) => {
        const isOpen = menu.classList.contains('open');
        // Close all
        document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
        
        if (!isOpen) {
          menu.classList.add('open');
          btn.classList.add('active');
        }
      };

      els.ageBtn.onclick = (e) => { e.stopPropagation(); toggleMenu(els.ageBtn, els.ageMenu); };
      els.toneBtn.onclick = (e) => { e.stopPropagation(); toggleMenu(els.toneBtn, els.toneMenu); };

      // Close menus on outside click
      document.body.onclick = () => {
        document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
      };

      // Stop propagation inside menus
      document.querySelectorAll('.dropdown-menu').forEach(el => {
        el.onclick = (e) => e.stopPropagation();
      });

      // Age Slider
      els.ageSlider.oninput = (e) => {
        const val = e.target.value;
        state.age = val;
        els.ageDisplay.innerText = val;
        // "Slot machine" update on slide end or debounced could go here
        // For now, we update immediately to feel "real time"
        updateContent(); 
      };

      // Tone Options
      els.toneOptions.forEach(opt => {
        opt.onclick = () => {
          els.toneOptions.forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          state.tone = opt.dataset.tone;
          updateContent();
        };
      });
      
      // Speak Button (Mock)
      els.speakBtn.onclick = () => {
        const text = els.lessonText.innerText;
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
      };
    }

    init();

  </script>
</body>
</html>
