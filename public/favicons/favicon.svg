<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Dark radial background -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    
    <!-- Warm skin gradient -->
    <radialGradient id="skin" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f5d0c5"/>
      <stop offset="70%" stop-color="#e8b4a6"/>
      <stop offset="100%" stop-color="#d4a090"/>
    </radialGradient>
    
    <!-- Hair gradient -->
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="50%" stop-color="#6b4c12"/>
      <stop offset="100%" stop-color="#4a3510"/>
    </linearGradient>
    
    <!-- Eye color -->
    <radialGradient id="eye-iris" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7a9e7a"/>
      <stop offset="100%" stop-color="#4a6b4a"/>
    </radialGradient>
    
    <!-- Sparkle glow -->
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Dark circular background -->
  <circle cx="32" cy="32" r="32" fill="#0f0f1a"/>
  <circle cx="32" cy="32" r="30" fill="url(#bg-glow)"/>
  
  <!-- Hair (back layer) -->
  <ellipse cx="32" cy="28" rx="22" ry="20" fill="url(#hair)"/>
  <path d="M12 32 Q10 45, 18 52 Q14 40, 16 32 Z" fill="url(#hair)"/>
  <path d="M52 32 Q54 45, 46 52 Q50 40, 48 32 Z" fill="url(#hair)"/>
  
  <!-- Face shape -->
  <ellipse cx="32" cy="34" rx="16" ry="18" fill="url(#skin)"/>
  
  <!-- Hair (front layer - bangs) -->
  <path d="M16 26 Q20 18, 32 16 Q44 18, 48 26 Q44 22, 32 21 Q20 22, 16 26 Z" fill="url(#hair)"/>
  
  <!-- Eyebrows - raised in curiosity -->
  <path d="M22 28 Q26 26, 28 27" stroke="#6b4c12" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M36 27 Q38 26, 42 28" stroke="#6b4c12" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Eyes - looking UP and to the RIGHT (curiosity direction) -->
  <!-- Left eye -->
  <ellipse cx="25" cy="33" rx="4" ry="3.5" fill="white"/>
  <circle cx="26.5" cy="31.5" r="2.2" fill="url(#eye-iris)"/>
  <circle cx="27" cy="31" r="0.8" fill="white"/>
  <circle cx="25" cy="33" r="1.8" fill="#1a1a1a"/>
  <ellipse cx="26" cy="31.5" rx="0.6" ry="0.5" fill="white" opacity="0.9"/>
  
  <!-- Right eye -->
  <ellipse cx="39" cy="33" rx="4" ry="3.5" fill="white"/>
  <circle cx="40.5" cy="31.5" r="2.2" fill="url(#eye-iris)"/>
  <circle cx="41" cy="31" r="0.8" fill="white"/>
  <circle cx="39" cy="33" r="1.8" fill="#1a1a1a"/>
  <ellipse cx="40" cy="31.5" rx="0.6" ry="0.5" fill="white" opacity="0.9"/>
  
  <!-- Nose -->
  <path d="M32 35 Q33 38, 32 40 Q31 39, 30 40" stroke="#d4a090" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  
  <!-- Slight smile -->
  <path d="M27 44 Q32 47, 37 44" stroke="#c4918a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Chin on hand indication (subtle) -->
  <ellipse cx="32" cy="50" rx="6" ry="4" fill="url(#skin)" opacity="0.9"/>
  
  <!-- Blue sweater hint at bottom -->
  <path d="M18 54 Q32 58, 46 54 L46 64 L18 64 Z" fill="#60a5fa" opacity="0.8"/>
  
  <!-- Sparkle accent (top right) -->
  <circle cx="52" cy="12" r="4" fill="url(#sparkle-glow)" opacity="0.8"/>
  <text x="50" y="15" font-size="8" fill="#fbbf24" font-family="system-ui">✨</text>
  
  <!-- Subtle inner glow ring -->
  <circle cx="32" cy="32" r="29" stroke="#3b82f6" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>
