<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/learn.html" />
    <script>
      // Preserve query string/hash for links like /learn?hybrid=1
      (function () {
        try {
          var next = '/learn.html' + (location.search || '') + (location.hash || '');
          location.replace(next);
        } catch (_) {
          // If JS is blocked, the meta refresh above will still redirect.
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/learn.html">/learn.html</a>…</p>
  </body>
</html>
